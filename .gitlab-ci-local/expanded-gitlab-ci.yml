    - tests-runner
  image:
    name: python:3.12
  rules:
    - if: $CI_EXEC_UNIT_TESTS == "true"
      when: always
    - when: never
  variables:
    KAAPANA_DIR: $CI_PROJECT_DIR
    DOCKER_HOST: tcp://docker:2375
    TMPDIR: $CI_PROJECT_DIR/tmp
    NO_PROXY: localhost,127.0.0.1,docker,.dkfz.de,.dkfz-heidelberg.de
    no_proxy: localhost,127.0.0.1,docker,.dkfz.de,.dkfz-heidelberg.de
  services:
    - name: docker.io/library/docker:28-dind
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ''
  script:
    - mkdir -p "$TMPDIR"
    - >-
      pip install $KAAPANA_DIR/lib/kaapana_containers $KAAPANA_DIR/lib/task_api
      pytest
    - pytest $KAAPANA_DIR/lib/task_api/task_api --junitxml=task_api_report.xml
  artifacts:
    reports:
      junit:
        - task_api_report.xml
