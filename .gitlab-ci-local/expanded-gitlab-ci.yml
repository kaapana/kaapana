playwright_ui_tests:
  tags:
    - deploy-runner
  image:
    name: $CI_BASE_IMAGE
  variables:
    ANSIBLE_HOST_KEY_CHECKING: 'False'
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    - chmod 600 "$CI_SSH_PRIVATE_KEY"
  stage: test
  rules:
    - if: $CI_EXEC_INTEGRATION_TESTS == "true" && $CI_EXEC_DEPLOY == "true"
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
      optional: false
    - job: platform_deployment
      artifacts: true
      optional: false
    - job: first_login
      artifacts: true
      optional: false
  script:
    - cd "$CI_PROJECT_DIR/tests/ui"
    - npm ci
    - npx playwright install chromium
    - |
      KAAPANA_TEST_INSTANCE_UI="https://$VM_FQDN" \
        npx playwright test \
          --project auth-setup \
          --project project-management \
          --workers 1
  artifacts:
    when: always
    paths:
      - tests/ui/playwright-report/
      - tests/ui/test-results/
    expose_as: Playwright UI Report
    reports:
      junit: tests/ui/test-results/junit.xml
destroy_deployment:
  stage: clean
  interruptible: false
  timeout: 1 hour
  needs:
    - job: prepare_deployment
      artifacts: true
      optional: false
    - job: server_installation
      artifacts: false
      optional: true
    - job: platform_deployment
      artifacts: false
      optional: true
    - job: setup_integration_tests
      artifacts: false
      optional: true
    - job: scan_ports
      artifacts: false
      optional: true
    - job: first_login
      artifacts: false
      optional: true
    - job: install_extensions
      artifacts: false
      optional: true
    - job: send_data
      artifacts: false
      optional: true
    - job: run_workflows
      artifacts: false
      optional: true
    - job: playwright_ui_tests
      artifacts: false
      optional: true
  rules:
    - if: $CI_EXEC_DEPLOY == "true" && $DEPLOYMENT_INSTANCE_FQDN != ""
      when: never
    - if: $CI_EXEC_DEPLOY == "true" && $CI_EXEC_DESTROY_DELAYED == "true"
      when: delayed
      start_in: 4 hours
    - if: $CI_EXEC_DEPLOY == "true"
      when: always
    - when: never
  tags:
    - deploy-runner
  image:
    name: $CI_BASE_IMAGE
  script:
    - >-
      ansible-playbook -i localhost,
      "$CI_PROJECT_DIR/ci/ci-code/deploy/delete_harvester_vm.yaml"
if_ci_failing:
  stage: clean
  tags:
    - deploy-runner
  image:
    name: $CI_BASE_IMAGE
  needs:
    - job: build_ci_image
      artifacts: false
      optional: true
    - job: unit_tests
      artifacts: false
      optional: true
    - job: task_api_tests
      artifacts: false
      optional: true
    - job: kaapana_extensions_tests
      artifacts: false
      optional: true
    - job: workflow_api_tests
      artifacts: false
      optional: true
    - job: portal_api_tests
      artifacts: false
      optional: true
    - job: extensions_api_tests
      artifacts: false
      optional: true
    - job: kaapana_backend_tests
      artifacts: false
      optional: true
    - job: auth_backend_tests
      artifacts: false
      optional: true
    - job: opa_policy_tests
      artifacts: false
      optional: true
    - job: access_information_interface_tests
      artifacts: false
      optional: true
    - job: keycloak_setup_tests
      artifacts: false
      optional: true
    - job: build_documentation
      artifacts: false
      optional: true
    - job: check_readthedocs
      artifacts: false
      optional: true
    - job: build_packages
      artifacts: true
      optional: true
    - job: security_scan
      artifacts: false
      optional: true
    - job: security
      artifacts: false
      optional: true
    - job: prepare_deployment
      artifacts: false
      optional: true
    - job: server_installation
      artifacts: true
      optional: true
    - job: platform_deployment
      artifacts: true
      optional: true
    - job: setup_integration_tests
      artifacts: false
      optional: true
    - job: scan_ports
      artifacts: true
      optional: true
    - job: first_login
      artifacts: true
      optional: true
    - job: install_extensions
      artifacts: true
      optional: true
    - job: send_data
      artifacts: true
      optional: true
    - job: run_workflows
      artifacts: true
      optional: true
    - job: playwright_ui_tests
      artifacts: false
      optional: true
  script:
    - mkdir -p "$ARTIFACTS_DIR"
    - >-
      [[ -f "$CI_PROJECT_DIR/build/build.log" ]] && cp
      "$CI_PROJECT_DIR/build/build.log" "$ARTIFACTS_DIR/" || true
    - cd "$CI_PROJECT_DIR/ci/ci-code/clean"
    - python3 create_ticket_if_ci_failed.py
    - python3 notify_slack.py
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_failure
default:
  interruptible: true
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_PIPELINE_SOURCE == "api"
      when: always
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: always
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
      when: always
    - if: >-
        $MAINTENANCE != "true" && $CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $MAINTENANCE != "true" && $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: >-
        $MAINTENANCE != "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
        && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/
      when: always
    - when: never
variables:
  CI_EXEC_UNIT_TESTS: 'true'
  CI_EXEC_BUILD: 'true'
  CI_EXEC_BUILD_ARGUMENTS: ''
  CI_EXEC_DEPLOY: 'true'
  CI_EXEC_SERVER_INSTALLATION: 'true'
  CI_EXEC_INTEGRATION_TESTS: 'true'
  CI_EXEC_SECURITY_SCAN: 'false'
  CI_EXEC_SECURITY_SCAN_ARGUMENTS: --vulnerability-scan --configuration-check --create-sboms
  CI_EXEC_DOCKER_PRUNE: 'false'
  CI_EXEC_DESTROY_DELAYED: 'false'
  MAINTENANCE: 'false'
  REGISTRY_URL: $CI_REGISTRY_URL
  REGISTRY_USER: $CI_REGISTRY_USER
  REGISTRY_TOKEN: $CI_REGISTRY_TOKEN
  DOCKER_IO_USER: $DOCKER_IO_USER
  DOCKER_IO_PASSWORD: $DOCKER_IO_PASSWORD
  CI_IMAGES_TAG: v3
  CI_BASE_IMAGE: $CI_REGISTRY_URL/ci-base:$CI_IMAGES_TAG
  GITLAB_API_TOKEN: $CI_REGISTRY_TOKEN
  BLABLADOR_API_TOKEN: $CI_REGISTRY_TOKEN
  DEPLOYMENT_INSTANCE_FQDN: ''
  DEPLOYMENT_INSTANCE_USER: ubuntu
  DEPLOYMENT_INSTANCE_VM_NAME: ci-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  DEPLOYMENT_INSTANCE_DOMAIN: vms.dkfz.de
  DEPLOYMENT_INSTANCE_IMAGE_ID: ubuntu24
  DEPLOYMENT_INSTANCE_CPU: '32'
  DEPLOYMENT_INSTANCE_MEMORY: 256Gi
  DEPLOYMENT_INSTANCE_DISK: 128Gi
  DEPLOYMENT_INSTANCE_NETWORK: harvester-public/dkfz-net
  DEPLOYMENT_INSTANCE_STORAGE_CLASS: px-fa-direct-access
  DEPLOYMENT_INSTANCE_HARVESTER_NAMESPACE: kaapana-ci
  DEPLOYMENT_INSTANCE_SSH_KEYPAIR: kaapana
  DEPLOYMENT_INSTANCE_PLATFORM_PREFIX: ci-dep
  SLACK_BOT_TOKEN: $SLACK_BOT_TOKEN
  SLACK_CHANNEL_ID: $SLACK_CHANNEL_ID
  KAAPANA_READTHEDOCS_TOKEN: $KAAPANA_READTHEDOCS_TOKEN
  HTTP_PROXY: http://www-int2.dkfz-heidelberg.de:80
  HTTPS_PROXY: http://www-int2.dkfz-heidelberg.de:80
  NO_PROXY: localhost,127.0.0.1,.dkfz.de,.dkfz-heidelberg.de
  no_proxy: $NO_PROXY
  ANSIBLE_VERBOSITY: '0'
  GIT_STRATEGY: fetch
  GIT_DEPTH: '1'
  ARTIFACTS_DIR: $CI_PROJECT_DIR/artifacts
include:
  - local: /ci/pipeline/ci-image.yml
  - local: /ci/pipeline/unit-tests.yml
  - local: /ci/pipeline/build.yml
  - local: /ci/pipeline/deploy.yml
  - local: /ci/pipeline/integration-tests.yml
  - local: /ci/pipeline/clean.yml
