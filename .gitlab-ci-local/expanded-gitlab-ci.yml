stages:
  - .pre
  - tests
  - build
  - deploy
  - test
  - clean
  - .post
build_ci_image:
  stage: tests
  tags:
    - build-runner
  image:
    name: docker.io/library/docker:28-cli
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE ==
        "push" && $CI_COMMIT_BRANCH == "develop")
      changes:
        - ci/images/**/*
        - ci/harvester/tasks/requirements.txt
        - ci/ci-code/integration_tests/pyproject.toml
      when: on_success
    - when: never
  script:
    - >
      set +x

      # # DOCKER_AUTH_CONFIG shadows CLI logins, unset it so build/scan pushes
      use their logins

      unset DOCKER_AUTH_CONFIG

      echo "$CI_REGISTRY_TOKEN" | docker login "$CI_REGISTRY_URL" -u
      "$CI_REGISTRY_USER" --password-stdin
    - >-
      docker build --build-arg http_proxy="$HTTP_PROXY" --build-arg
      https_proxy="$HTTPS_PROXY" -f ci/images/ci-base/Dockerfile -t
      "$CI_BASE_IMAGE" ci
    - docker push "$CI_BASE_IMAGE"
  after_script:
    - docker logout "$CI_REGISTRY_URL" || true
.test_template:
  stage: tests
  tags:
    - tests-runner
  image: python:3.12
  rules:
    - if: $CI_EXEC_UNIT_TESTS == "true"
      when: always
    - when: never
  variables:
    KAAPANA_DIR: $CI_PROJECT_DIR
unit_tests:
  stage: tests
  tags:
    - tests-runner
  image:
    name: python:3.12
  rules:
    - if: $CI_EXEC_UNIT_TESTS == "true"
      when: always
    - when: never
  variables:
    KAAPANA_DIR: $CI_PROJECT_DIR
  script:
    - pip install -r $KAAPANA_DIR/tests/requirements.txt
    - pytest $KAAPANA_DIR/tests/ --junitxml=unittest_report.xml
  artifacts:
    reports:
      junit:
        - unittest_report.xml
task_api_tests:
