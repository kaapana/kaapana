.build_cli_env:
  tags:
    - build-runner
  image: $CI_BASE_IMAGE
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: '0'
  before_script:
    - unset DOCKER_AUTH_CONFIG
    - pip install -e build_cli/
    - |-
      if [[ $CI_PIPELINE_SOURCE == "merge_request_event" ]]; then
        git checkout -B $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME $CI_COMMIT_SHA
      elif [[ -n "$CI_COMMIT_TAG" ]]; then
        # Tag pipeline: no branch ref; stay detached, git describe resolves the tag
        git checkout $CI_COMMIT_SHA
      else
        git checkout -B $CI_COMMIT_BRANCH $CI_COMMIT_SHA
      fi
    - git status
    - git fetch --tags
build_packages:
  tags:
    - build-runner
  image:
    name: $CI_BASE_IMAGE
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: '0'
    RUNNER_SCRIPT_TIMEOUT: 8h
  before_script:
    - unset DOCKER_AUTH_CONFIG
    - pip install -e build_cli/
    - |-
      if [[ $CI_PIPELINE_SOURCE == "merge_request_event" ]]; then
        git checkout -B $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME $CI_COMMIT_SHA
      elif [[ -n "$CI_COMMIT_TAG" ]]; then
        # Tag pipeline: no branch ref; stay detached, git describe resolves the tag
        git checkout $CI_COMMIT_SHA
      else
        git checkout -B $CI_COMMIT_BRANCH $CI_COMMIT_SHA
      fi
    - git status
    - git fetch --tags
  stage: build
  dependencies: []
  timeout: 8 hours
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
      when: on_success
      variables:
        REGISTRY_URL: $RELEASE_REGISTRY_URL
        REGISTRY_USER: $RELEASE_REGISTRY_USER
        REGISTRY_TOKEN: $RELEASE_REGISTRY_TOKEN
        CI_EXEC_DOCKER_PRUNE: 'true'
    - if: $CI_EXEC_BUILD == "true"
      when: on_success
    - when: never
  script:
    - >
      [[ $CI_EXEC_DOCKER_PRUNE == "true" ]] && docker system prune --all
      --volumes -f
    - >
      set +x

      echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER"
      --password-stdin

      if [[ -n "$DOCKER_IO_USER" ]]; then
        echo "$DOCKER_IO_PASSWORD" | docker login docker.io -u "$DOCKER_IO_USER" --password-stdin
      fi

      export REGISTRY_PW="$REGISTRY_TOKEN"
    - kaapana-build --default-registry "$REGISTRY_URL" $CI_EXEC_BUILD_ARGUMENTS
  artifacts:
    name: build_$CI_COMMIT_SHORT_SHA
    when: always
    paths:
      - $CI_PROJECT_DIR/build/build.log
security_scan:
  tags:
    - build-runner
  image:
    name: $CI_BASE_IMAGE
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: '0'
  before_script:
    - unset DOCKER_AUTH_CONFIG
    - pip install -e build_cli/
    - |-
      if [[ $CI_PIPELINE_SOURCE == "merge_request_event" ]]; then
        git checkout -B $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME $CI_COMMIT_SHA
      elif [[ -n "$CI_COMMIT_TAG" ]]; then
        # Tag pipeline: no branch ref; stay detached, git describe resolves the tag
        git checkout $CI_COMMIT_SHA
      else
        git checkout -B $CI_COMMIT_BRANCH $CI_COMMIT_SHA
      fi
    - git status
    - git fetch --tags
  stage: build
  timeout: 4 hours
  needs:
    - job: build_packages
      artifacts: false
      optional: false
  rules:
    - if: $CI_EXEC_SECURITY_SCAN == "true" && $CI_EXEC_BUILD == "true"
      when: on_success
    - when: never
  script:
    - |
      set +x
      export REGISTRY_PW="$REGISTRY_TOKEN"
    - >-
      kaapana-build --scan-only $CI_EXEC_SECURITY_SCAN_ARGUMENTS
      --default-registry "$REGISTRY_URL"
  artifacts:
    name: security_$CI_COMMIT_SHORT_SHA
    when: always
    paths:
      - $CI_PROJECT_DIR/security-reports/
    exclude:
      - $CI_PROJECT_DIR/security-reports/.trivy_cache/**/*
      - $CI_PROJECT_DIR/security-reports/.trivy_worker_*/**/*
security:
  stage: build
  needs:
    - job: security_scan
      artifacts: true
      optional: false
  tags:
    - build-runner
  image:
    name: $CI_BASE_IMAGE
  before_script:
    - pip install jsonschema
  script:
    - >-
      CONSOLIDATED="$CI_PROJECT_DIR/security-reports/consolidated_vulnerability_report.json"
    - >-
      python3 "$CI_PROJECT_DIR/ci/ci-code/clean/create_vulnerability_report.py"
      "$CONSOLIDATED" "$CI_PROJECT_DIR/gl-container-scanning-report.json"
      --output json
    - >-
      python3 "$CI_PROJECT_DIR/ci/ci-code/clean/create_vulnerability_report.py"
      "$CONSOLIDATED" "$CI_PROJECT_DIR/vulnerability_report.html" --output html
    - >-
      echo "Access the report at
      https://kaapana.pages.hzdr.de/-/kaapana/-/jobs/${CI_JOB_ID}/artifacts/vulnerability_report.html"
  artifacts:
    paths:
      - $CI_PROJECT_DIR/vulnerability_report.html
    reports:
      container_scanning: $CI_PROJECT_DIR/gl-container-scanning-report.json
  allow_failure: true
  rules:
    - if: $CI_EXEC_SECURITY_SCAN == "true" && $CI_EXEC_BUILD == "true"
      when: on_success
    - when: never
.remote_execution_template:
  tags:
    - deploy-runner
  image: $CI_BASE_IMAGE
  variables:
    ANSIBLE_HOST_KEY_CHECKING: 'False'
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    - chmod 600 "$CI_SSH_PRIVATE_KEY"
prepare_deployment:
  tags:
    - deploy-runner
  image:
    name: $CI_BASE_IMAGE
  variables:
    ANSIBLE_HOST_KEY_CHECKING: 'False'
    GIT_STRATEGY: clone
    GIT_DEPTH: '0'
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    - chmod 600 "$CI_SSH_PRIVATE_KEY"
  interruptible: false
  rules:
    - if: $CI_EXEC_DEPLOY == "true"
      when: on_success
    - when: never
  stage: deploy
  script:
    - git fetch --tags
    - VERSION_TAG=$(git describe --tags --always)
    - >
      if [[ "$CI_EXEC_BUILD_ARGUMENTS" =~ (--latest) && "$VERSION_TAG" =~
      ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        BASE_TAG=$(echo "$VERSION_TAG" | sed -E 's/-[0-9]+-g[0-9a-f]+.*//')
        VERSION_TAG="${BASE_TAG}-latest"
      fi
    - echo "Resolved VERSION_TAG=$VERSION_TAG"
    - >
      set +x

      helm registry login "${REGISTRY_URL%%/*}" -u "$REGISTRY_USER" -p
      "$REGISTRY_TOKEN" >/dev/null 2>&1

      if ! helm show chart "oci://$REGISTRY_URL/kaapana-admin-chart" --version
      "$VERSION_TAG" >/dev/null; then
        echo "ERROR: kaapana-admin-chart '$VERSION_TAG' not found in $REGISTRY_URL — was this commit built and pushed?"
        exit 1
      fi
    - mkdir -p artifacts
    - |
      if [[ -z "$DEPLOYMENT_INSTANCE_FQDN" ]]; then
        ansible-playbook -i localhost, "$CI_PROJECT_DIR/ci/ci-code/deploy/provision_harvester_vm.yaml"
      else
        # dcmsend rejects peerhosts > 57 chars — fail now, not mid-tests
        if [[ ${#DEPLOYMENT_INSTANCE_FQDN} -gt 57 ]]; then
          echo "ERROR: DEPLOYMENT_INSTANCE_FQDN '${DEPLOYMENT_INSTANCE_FQDN}' is ${#DEPLOYMENT_INSTANCE_FQDN} characters, exceeding the 57-character dcmsend peerhost limit."
          exit 1
        fi
        echo "Skipping VM provisioning and using existing deployment target: $DEPLOYMENT_INSTANCE_FQDN"
        echo "VM_FQDN=$DEPLOYMENT_INSTANCE_FQDN" > artifacts/deployment.env
        echo "VM_USER=$DEPLOYMENT_INSTANCE_USER" >> artifacts/deployment.env
      fi
    - echo "VERSION_TAG=$VERSION_TAG" >> artifacts/deployment.env
  artifacts:
    when: always
    paths:
      - artifacts/deployment.env
    reports:
      dotenv: artifacts/deployment.env
server_installation:
  tags:
    - deploy-runner
  image:
    name: $CI_BASE_IMAGE
  variables:
    ANSIBLE_HOST_KEY_CHECKING: 'False'
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    - chmod 600 "$CI_SSH_PRIVATE_KEY"
  stage: deploy
  rules:
    - if: $CI_EXEC_DEPLOY == "true" && $CI_EXEC_SERVER_INSTALLATION == "true"
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
      optional: false
  script:
    - >
      ansible-playbook
      "$CI_PROJECT_DIR/ci/ci-code/deploy/server_installation.yaml" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$CI_SSH_PRIVATE_KEY"
  artifacts:
    paths:
      - artifacts/server_installation.log
    when: always
    access: developer
platform_deployment:
  tags:
    - deploy-runner
  image:
    name: $CI_BASE_IMAGE
  variables:
    ANSIBLE_HOST_KEY_CHECKING: 'False'
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    - chmod 600 "$CI_SSH_PRIVATE_KEY"
  stage: deploy
  needs:
    - job: server_installation
      artifacts: true
      optional: true
    - job: prepare_deployment
      artifacts: true
      optional: false
  script:
    - |
      if [ -z "$VM_FQDN" ]; then
        echo "ERROR: VM_FQDN is empty. No deployment target."
        exit 1
      fi
    - >
      ansible-playbook "$CI_PROJECT_DIR/ci/ci-code/deploy/deploy_platform.yaml"
      \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$CI_SSH_PRIVATE_KEY"
    - echo "Kaapana Platform Deployed Successfully"
    - echo "Access the platform at https://$VM_FQDN"
    - |
      echo "<html>
      <body>
      <h1>Kaapana Platform Deployed</h1>
      <p>Access it here: <a href=\"https://$VM_FQDN\">https://$VM_FQDN</a></p>
      </body>
      </html>" > artifacts/deployment.html
  rules:
    - if: $CI_EXEC_DEPLOY == "true"
      when: on_success
    - when: never
  artifacts:
    paths:
      - artifacts/deployment.log
      - artifacts/system_check.log
      - artifacts/deployment.html
    when: always
    expose_as: Kaapana Deployment Report
setup_integration_tests:
  tags:
    - deploy-runner
  image:
    name: $CI_BASE_IMAGE
  variables:
    ANSIBLE_HOST_KEY_CHECKING: 'False'
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    - chmod 600 "$CI_SSH_PRIVATE_KEY"
  stage: test
  needs:
    - job: prepare_deployment
      artifacts: true
      optional: false
    - job: platform_deployment
      artifacts: true
      optional: false
  rules:
    - if: $CI_EXEC_INTEGRATION_TESTS == "true" && $CI_EXEC_DEPLOY == "true"
      when: on_success
    - when: never
  script:
    - >
      ansible-playbook
      "$CI_PROJECT_DIR/ci/ci-code/integration_tests/remote_execution/setup_integration_tests.yaml"
      \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$CI_SSH_PRIVATE_KEY"
  artifacts:
    reports:
      dotenv:
        - artifacts/integration_test_setup.env
    access: developer
.integration_test_local:
  tags:
    - deploy-runner
  image: $CI_BASE_IMAGE
  variables:
    ANSIBLE_HOST_KEY_CHECKING: 'False'
    PYTEST_ARGS: >-
      --client-secret $CLIENT_SECRET --host $VM_FQDN --allowed-ports 22,80,443
      --download-directory $CI_PROJECT_DIR/downloaded_test_data
      --test-data-repo-root /srv/kaapana-test-data
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    - chmod 600 "$CI_SSH_PRIVATE_KEY"
  stage: test
  rules:
    - if: $CI_EXEC_INTEGRATION_TESTS == "true" && $CI_EXEC_DEPLOY == "true"
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
    - job: setup_integration_tests
      artifacts: true
    - platform_deployment
  script:
    - pip install --no-deps -e "$CI_PROJECT_DIR/ci/ci-code/integration_tests"
    - >
      python3 -m pytest -n "${PYTEST_WORKERS:-auto}" --dist
      "${PYTEST_DIST:-load}" \
        -s "$CI_PROJECT_DIR/$PYTEST_FILE" $PYTEST_ARGS \
        --junitxml="$ARTIFACTS_DIR/$JUNIT_FILE" | tee "$ARTIFACTS_DIR/$LOG_FILE"
  artifacts:
    paths:
      - $ARTIFACTS_DIR/$JUNIT_FILE
      - $ARTIFACTS_DIR/$LOG_FILE
    reports:
      junit:
        - $ARTIFACTS_DIR/$JUNIT_FILE
test_data_probe:
  stage: test
  tags:
    - deploy-runner
  image:
    name: $CI_BASE_IMAGE
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: on_success
    - when: never
  variables:
    TEST_DATA_ROOT: /srv/kaapana-test-data
  script:
    - mkdir -p "$TEST_DATA_ROOT"
    - pip install --no-deps -e "$CI_PROJECT_DIR/ci/ci-code/integration_tests"
    - |
      python3 - <<'PY'
      import os
      import sys
      from pathlib import Path

      from integration_tests.data import (
          clone_test_data_repos,
          get_series_to_download_from_manifest,
      )

      spec = os.environ.get("CI_TEST_DATA_REPOS", "")
      if not spec:
          sys.exit("CI_TEST_DATA_REPOS is not set, TCIA would be the only source")

      dirs = clone_test_data_repos(spec, Path(os.environ["TEST_DATA_ROOT"]))
      if not dirs:
          sys.exit("no test-data repository could be cloned")
      print(f"repositories: {dirs}")

      manifests = sorted(
          Path("ci/ci-code/integration_tests/data/download-info").glob("*.tcia")
      )
      total = absent_total = 0
      for manifest in manifests:
          # send_data truncates the dataset name the same way
          dataset = manifest.stem[:16]
          uids = get_series_to_download_from_manifest(manifest)
          absent = [
              uid
              for uid in uids
              if not any((Path(d) / dataset / f"{uid}.zip").is_file() for d in dirs)
          ]
          total += len(uids)
          absent_total += len(absent)
          print(f"{dataset}: {len(uids) - len(absent)}/{len(uids)} series in the repository")
          for uid in absent:
              print(f"  falls back to TCIA: {uid}")
      print(f"total: {total - absent_total}/{total} series served without TCIA")
      PY
    - du -sh "$TEST_DATA_ROOT"/* || true
scan_ports:
  tags:
    - deploy-runner
  image:
    name: $CI_BASE_IMAGE
  variables:
    ANSIBLE_HOST_KEY_CHECKING: 'False'
    PYTEST_ARGS: >-
      --client-secret $CLIENT_SECRET --host $VM_FQDN --allowed-ports 22,80,443
      --download-directory $CI_PROJECT_DIR/downloaded_test_data
      --test-data-repo-root /srv/kaapana-test-data
    PYTEST_FILE: ci/ci-code/integration_tests/tests/test_scan_ports.py
    JUNIT_FILE: scan_ports.xml
    LOG_FILE: scan_ports.log
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    - chmod 600 "$CI_SSH_PRIVATE_KEY"
  stage: test
  rules:
    - if: $CI_EXEC_INTEGRATION_TESTS == "true" && $CI_EXEC_DEPLOY == "true"
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
      optional: false
    - job: setup_integration_tests
      artifacts: true
      optional: false
    - job: platform_deployment
      artifacts: true
      optional: false
  script:
    - pip install --no-deps -e "$CI_PROJECT_DIR/ci/ci-code/integration_tests"
    - >
      python3 -m pytest -n "${PYTEST_WORKERS:-auto}" --dist
      "${PYTEST_DIST:-load}" \
        -s "$CI_PROJECT_DIR/$PYTEST_FILE" $PYTEST_ARGS \
        --junitxml="$ARTIFACTS_DIR/$JUNIT_FILE" | tee "$ARTIFACTS_DIR/$LOG_FILE"
  artifacts:
    paths:
      - $ARTIFACTS_DIR/$JUNIT_FILE
      - $ARTIFACTS_DIR/$LOG_FILE
    reports:
      junit:
        - $ARTIFACTS_DIR/$JUNIT_FILE
