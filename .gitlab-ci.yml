# Pipeline inputs:
# - Set per run in the "Run pipeline" form on GitLab
# - Set per schedule on GitLab
# - `glab ci run -i <name>:<value>`
# Input syntax and types: https://docs.gitlab.com/ci/inputs/
spec:
  inputs:
    # --- [exec] stage toggles and their arguments
    exec_unit_tests:
      default: true
      type: boolean
      description: "[exec] tests stage: unit tests + documentation build"
    exec_build:
      default: true
      type: boolean
      description: "[exec] build stage: full platform build"
    exec_build_arguments:
      default: ""
      type: string
      description: '[exec] extra kaapana-build flags, e.g. "--latest"'
    exec_deploy:
      default: true
      type: boolean
      description: "[exec] deploy stage: provision test VM + server install + platform deploy"
    exec_server_installation:
      default: true
      type: boolean
      description: "[exec] false skips the OS/microk8s install and runs target_readiness instead"
    exec_redeploy:
      default: false
      type: boolean
      description: "[exec] true undeploys a platform already on the target, false fails the job"
    exec_integration_tests:
      default: true
      type: boolean
      description: "[exec] test stage: pytest + Playwright against the test VM"
    exec_security_scan:
      default: false
      type: boolean
      description: "[exec] registry scan of the images this pipeline pushed"
    exec_security_scan_arguments:
      default: --vulnerability-scan --configuration-check
      type: string
      description: "[exec] flags for the security scan above"
    exec_docker_prune:
      default: false
      type: boolean
      description: "[exec] true wipes the runner docker cache first (cold build)"
    exec_destroy_delayed:
      default: false
      type: boolean
      description: "[exec] true keeps the test VM for 4h after the pipeline"

    # --- [runner] runner tag per stage group.
    build_runner_tag:
      default: build-runner
      type: string
      description: "[runner] ci-image and build stages"
    security_runner_tag:
      default: security-runner
      type: string
      description: "[runner] security stage"
    tests_runner_tag:
      default: tests-runner
      type: string
      description: "[runner] preflight and unit-test stages"
    deploy_runner_tag:
      default: deploy-runner
      type: string
      description: "[runner] deploy, integration-test and clean"

    # --- [target] deployment destination (provisioned automatically by default)
    deployment_fqdn:
      default: ""
      type: string
      regex: ^.{0,57}$
      description: "[target] empty provisions a fresh Harvester VM, set deploys onto that host (dcmsend rejects more than 57 characters)"
    deployment_user:
      default: ubuntu
      type: string
      description: "[target] SSH user on the deployment target"
---
default:
  interruptible: true

stages:
  - preflight
  - tests
  - build
  - security
  - deploy
  - test
  - clean

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_PIPELINE_SOURCE == "api"
      when: always
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: always
    # Release build: maintainer pushes a protected release
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
      when: always
    - if: $MAINTENANCE == "true"
      when: never
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)Security(,|$)/
      when: always
      variables:
        CI_EXEC_SECURITY_SCAN: "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

variables:
  MAINTENANCE: "false" # "true" pauses push/schedule/MR pipelines (workflow:rules)

  # --- Registries, both configured as project variables: CI_REGISTRY_* for
  # normal builds, RELEASE_REGISTRY_* (protected) for release tag pipelines.
  # Jobs consume the effective REGISTRY_* triple below; the tag rule on
  # build_packages swaps in the release triple via rules:variables.
  # NB: CI_REGISTRY_USER shadows a GitLab-predefined variable — if the project
  # variable is ever deleted, jobs silently get "gitlab-ci-token".
  REGISTRY_URL: $CI_REGISTRY_URL
  REGISTRY_USER: $CI_REGISTRY_USER
  REGISTRY_TOKEN: $CI_REGISTRY_TOKEN # secret — project variable (masked)

  # --- docker.io pull credentials (avoids anonymous pull rate limits).
  # Empty → the docker.io login in build_packages is skipped.
  DOCKER_IO_USER: $DOCKER_IO_USER # project variable, paired with the password
  DOCKER_IO_PASSWORD: $DOCKER_IO_PASSWORD # secret — project variable (masked)

  # --- CI job image, one for all jobs. Runners pull "if-not-present", so bump
  # CI_IMAGES_TAG in the same MR that changes ci/images/** — re-pushing an
  # existing tag leaves warm runners on the stale image. Always
  # $CI_REGISTRY_URL, never the release registry.
  CI_IMAGES_TAG: "v6"
  CI_BASE_IMAGE: "$CI_REGISTRY_URL/ci-base:$CI_IMAGES_TAG"

  # Purpose-specific tokens, currently aliasing the shared CI_REGISTRY_TOKEN.
  # To give a purpose its own credential, create a same-named project variable
  # (it outranks these defaults) — no pipeline change needed.
  GITLAB_API_TOKEN: $CI_REGISTRY_TOKEN
  BLABLADOR_API_TOKEN: $CI_REGISTRY_TOKEN

  # --- Deployment instance: the per-pipeline test VM on Harvester.
  # FQDN empty → provision a fresh VM; set (plus _USER) → deploy onto an
  # existing machine instead, which the clean stage never destroys.
  DEPLOYMENT_INSTANCE_FQDN: "$[[ inputs.deployment_fqdn ]]"
  DEPLOYMENT_INSTANCE_USER: "$[[ inputs.deployment_user ]]"
  # ssh key for user to change when deploying on its own target, with description in the project variable. The key must be in the user's authorized_keys. 
  DEPLOYMENT_INSTANCE_SSH_KEY:
    description: "SSH private key for the deployment target user (must match the public key in authorized_keys)"


  # vm_name is truncated in the provisioning playbook so the FQDN
  # (<vm_name>.<domain>) stays within the 57-char dcmsend peerhost limit.
  DEPLOYMENT_INSTANCE_VM_NAME: "ci-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  DEPLOYMENT_INSTANCE_DOMAIN: "vms.dkfz.de"
  DEPLOYMENT_INSTANCE_IMAGE_ID: "ubuntu24"
  DEPLOYMENT_INSTANCE_CPU: "32"
  DEPLOYMENT_INSTANCE_MEMORY: "256Gi"
  DEPLOYMENT_INSTANCE_DISK: "128Gi"
  DEPLOYMENT_INSTANCE_NETWORK: "harvester-public/dkfz-net"
  DEPLOYMENT_INSTANCE_STORAGE_CLASS: "px-fa-direct-access"
  DEPLOYMENT_INSTANCE_HARVESTER_NAMESPACE: "kaapana-ci"
  DEPLOYMENT_INSTANCE_HARVESTER_KEYPAIR: "kaapana" # Harvester KeyPair resource in the namespace
  DEPLOYMENT_INSTANCE_PLATFORM_PREFIX: "ci-dep" # project namespaces become <prefix>-project-<short_id>
  # kaapanactl's own defaults (kaapanactl.sh, load_kaapana_config): the helm
  # release is named after the chart and installed into HELM_NAMESPACE=default.
  # The deploy/undeploy playbooks look the release up under these names.
  DEPLOYMENT_INSTANCE_ADMIN_CHART: "kaapana-admin-chart"
  DEPLOYMENT_INSTANCE_HELM_NAMESPACE: "default"

  # --- Notifications (if_ci_failing on develop)
  SLACK_BOT_TOKEN: $SLACK_BOT_TOKEN # secret — project variable (masked)
  SLACK_CHANNEL_ID: $SLACK_CHANNEL_ID # project variable

  # --- Documentation (scheduled readthedocs check)
  KAAPANA_READTHEDOCS_TOKEN: $KAAPANA_READTHEDOCS_TOKEN # secret — project variable (masked)

  # --- DKFZ network proxy. NO_PROXY is mandatory alongside: without the
  # exemptions, requests to localhost and internal targets (test VMs, Harvester
  # API) hairpin through the proxy and time out.
  HTTP_PROXY: "http://www-int2.dkfz-heidelberg.de:80"
  HTTPS_PROXY: "http://www-int2.dkfz-heidelberg.de:80"
  NO_PROXY: "localhost,127.0.0.1,.dkfz.de,.dkfz-heidelberg.de,10.129.1.5" # Harvester API
  # Lowercase for apt in ui unit tests on servers that need proxy
  http_proxy: "$HTTP_PROXY"
  https_proxy: "$HTTPS_PROXY"
  no_proxy: "$NO_PROXY"

  # --- Fixed settings
  ANSIBLE_VERBOSITY: 0 # read natively by ansible-playbook
  # Shallow checkout per job; jobs needing history/tags (git describe) must
  # override with clone AND GIT_DEPTH "0"
  GIT_STRATEGY: "fetch"
  GIT_DEPTH: "1"
  ARTIFACTS_DIR: "$CI_PROJECT_DIR/artifacts"
  # Not declared here: CLIENT_SECRET is extracted from the deployed platform by
  # setup_integration_tests and passed downstream via a dotenv artifact.

# Job definitions live in one file per stage — each file's header states what
# the stage takes in and hands out.
include:
  - local: /ci/pipeline/preflight.yml
    inputs:
      runner_tag: $[[ inputs.tests_runner_tag ]]
      exec_build: $[[ inputs.exec_build ]]
      exec_deploy: $[[ inputs.exec_deploy ]]
      exec_server_installation: $[[ inputs.exec_server_installation ]]
      exec_redeploy: $[[ inputs.exec_redeploy ]]
  - local: /ci/pipeline/ci-image.yml
    inputs:
      runner_tag: $[[ inputs.build_runner_tag ]]
  - local: /ci/pipeline/unit-tests.yml
    inputs:
      runner_tag: $[[ inputs.tests_runner_tag ]]
      exec_unit_tests: $[[ inputs.exec_unit_tests ]]
  - local: /ci/pipeline/build.yml
    inputs:
      runner_tag: $[[ inputs.build_runner_tag ]]
      exec_build: $[[ inputs.exec_build ]]
      exec_docker_prune: $[[ inputs.exec_docker_prune ]]
      build_arguments: $[[ inputs.exec_build_arguments ]]
  - local: /ci/pipeline/security.yml
    inputs:
      runner_tag: $[[ inputs.security_runner_tag ]]
      exec_security_scan: $[[ inputs.exec_security_scan ]]
      security_scan_arguments: $[[ inputs.exec_security_scan_arguments ]]
  - local: /ci/pipeline/deploy.yml
    inputs:
      runner_tag: $[[ inputs.deploy_runner_tag ]]
      exec_deploy: $[[ inputs.exec_deploy ]]
      exec_server_installation: $[[ inputs.exec_server_installation ]]
      exec_redeploy: $[[ inputs.exec_redeploy ]]
      build_arguments: $[[ inputs.exec_build_arguments ]]
  - local: /ci/pipeline/integration-tests.yml
    inputs:
      runner_tag: $[[ inputs.deploy_runner_tag ]]
      exec_integration_tests: $[[ inputs.exec_integration_tests ]]
      exec_deploy: $[[ inputs.exec_deploy ]]
  - local: /ci/pipeline/clean.yml
    inputs:
      runner_tag: $[[ inputs.deploy_runner_tag ]]
      exec_deploy: $[[ inputs.exec_deploy ]]
      exec_destroy_delayed: $[[ inputs.exec_destroy_delayed ]]
