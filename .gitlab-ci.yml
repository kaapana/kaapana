default:
  interruptible: true

stages:
- prepare_build
- build
- deploy_and_test
- clean

workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "web"
    when: always
  - if: $CI_PIPELINE_SOURCE == "trigger"
    when: always
  - if: $MAINTENANCE != "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
    when: always
  - if: $MAINTENANCE != "true" && $CI_PIPELINE_SOURCE == "schedule"
    when: always
  - if: $MAINTENANCE != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/
    when: always
  - when: never

variables:
  ### PIPELINE
  DOCKER_PRUNE: $DOCKER_PRUNE
  DEPLOY_PLATFORM: $DEPLOY_PLATFORM
  EXECUTE_BUILD: $EXECUTE_BUILD
  TEST_STAGE: $TEST_STAGE
  BUILD_ARGUMENTS: $BUILD_ARGUMENTS

  ### CONFIGURABLE
  DOCKER_IO_USER: $DOCKER_IO_USER ### username for docker.io
  DOCKER_IO_PASSWORD: $DOCKER_IO_PASSWORD ### password for docker.io
  SLACK_BOT_TOKEN: $SLACK_BOT_TOKEN ### Oauth bot token of the slack app
  SLACK_CHANNEL_ID: $SLACK_CHANNEL_ID ### Channel ID to inform about failing pipelines
  USER: $USER ### username on the CI instance
  DEPLOYMENT_INSTANCE_NAME: $DEPLOYMENT_INSTANCE_NAME
  DEPLOYMENT_INSTANCE_IP: $DEPLOYMENT_INSTANCE_IP ### Set in order to reuse an instance
  DEPLOYMENT_INSTANCE_USER: $DEPLOYMENT_INSTANCE_USER ### Username on the deployment instance
  DEPLOYMENT_ON_WORKSTATION: $DEPLOYMENT_ON_WORKSTATION
  HTTP_PROXY: $HTTP_PROXY
  HTTPS_PROXY: $HTTPS_PROXY
  SSH_FILE: $SSH_FILE ### Path to the ssh file used for connecting to the deployment instance
  REGISTRY_TOKEN: $REGISTRY_TOKEN
  REGISTRY_URL: $REGISTRY_URL
  KAAPANA_READTHEDOCS_TOKEN: $KAAPANA_READTHEDOCS_TOKEN
  REGISTRY_USER: $GITLAB_USER_LOGIN

  ### FIXED VARIABLES
  #REGISTRY_TOKEN: $CI_REGISTRY_PASSWORD
  GIT_STRATEGY: "none" ### Predefined Gitlab CI variable; Has to be one of ["clone", "fetch", "none"]
  # GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PIPELINE_ID
  GIT_CLONE_PATH: /home/ubuntu/builds/$CI_COMMIT_SHORT_SHA
  KAAPANA_DIR: $GIT_CLONE_PATH
  REPO_DIR: $GIT_CLONE_PATH/ci
  ANSIBLE_VERBOSITY: 0

#############################################
############## PREPARE ######################
#############################################
prepare_pipeline:
  stage: prepare_build
  tags:
    - build-shared
  before_script: # Necessary because otherwise HEAD is detached and the build fails
  - |-
    if [[ $CI_PIPELINE_SOURCE == "merge_request_event" ]]; then
      git checkout -B $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME $CI_COMMIT_SHA
    else
      git checkout -B $CI_COMMIT_BRANCH $CI_COMMIT_SHA
    fi
  - git status
  - git fetch --tags
  variables:
    GIT_STRATEGY: clone
  script:
  - find $CI_BUILDS_DIR/ -maxdepth 1 -mtime +7 -exec rm -rf -- {} \;
  - export VERSION_TAG=$( if [[ $BUILD_ARGUMENTS == *"--latest"* ]]; then echo "0.0.0-latest"; else echo $( git describe ); fi)
  - echo VERSION_TAG=$VERSION_TAG >> prepare.env
  - export ARTIFACTS_DIR="/home/$USER/artifacts/$CI_COMMIT_SHORT_SHA/"
  - echo "ARTIFACTS_DIR=$ARTIFACTS_DIR" >> prepare.env
  - sudo rm -rf $ARTIFACTS_DIR
  - mkdir -p $ARTIFACTS_DIR
  artifacts:
    reports:
      dotenv: prepare.env

unit_tests:
  stage: prepare_build
  tags:
    - build-shared
  needs:
  - prepare_pipeline
  script:
  - python3 -m virtualenv $KAAPANA_DIR/test/.venv
  - source $KAAPANA_DIR/test/.venv/bin/activate
  - pip install -r $KAAPANA_DIR/tests/requirements.txt
  - pytest $KAAPANA_DIR/tests/ --junitxml=unittest_report.xml
  artifacts:
    when: always
    paths:
    - unittest_report.xml
    reports:
      junit:
        - unittest_report.xml

task_api_tests:
  stage: prepare_build
  tags:
    - build-shared
  needs:
  - prepare_pipeline
  script:
  - python3 -m virtualenv $KAAPANA_DIR/lib/.venv
  - source $KAAPANA_DIR/lib/.venv/bin/activate
  - python3 -m pip install build pytest
  - python3 -m build $KAAPANA_DIR/lib/task_api
  - python3 -m pip install $KAAPANA_DIR/lib/task_api/dist/task_api-1.0.0.tar.gz
  - pytest $KAAPANA_DIR/lib/task_api/task_api --junitxml=task_api_report.xml
  artifacts:
    when: always
    paths:
    - task_api_report.xml
    reports:
      junit:
        - task_api_report.xml

workflow_api_tests:
  stage: prepare_build
  tags:
    - build-shared
  needs:
  - prepare_pipeline
  script:
  - cd $KAAPANA_DIR/services/base/workflow-api/docker/files/tests/unit
  - bash run_tests.sh
  artifacts:
    when: always
    paths:
      - workflow_api_report.xml
    reports:
      junit:
        - workflow_api_report.xml

build_documentation:
  stage: prepare_build
  tags:
    - build-shared
  needs:
  - prepare_pipeline
  script:
  - source /home/$USER/venv/bin/activate
  - cd $REPO_DIR/ci-code/build
  - bash build_documentation.sh
  - if [[ $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop" ]]; then bash check_readthedocs.sh; fi
  rules:
  - if: $EXECUTE_BUILD == "false"
    when: never
  - when: on_success

#############################################
############## BUILD ########################
#############################################
build_packages:
  stage: build
  tags:
    - build-dedicated
  needs:
  - prepare_pipeline
  timeout: 2 hours
  script:
  - source /home/$USER/venv/bin/activate
  - if [[ $DOCKER_PRUNE == "true" ]]; then docker system prune --all --volumes -f; fi
  - if [[ $EXECUTE_BUILD == "true" ]]; then bash $REPO_DIR/ci-code/build/build.sh; fi
  retry: 1

#############################################
############## DEPLOY #######################
#############################################
prepare_deployment_instance:
  stage: deploy_and_test
  tags:
    - deploy-shared
  needs:
  - prepare_pipeline
  variables:
    GIT_STRATEGY: clone
    ARTIFACTS_DIR: "/home/$USER/artifacts/$CI_COMMIT_SHORT_SHA/"
  script: |
    mkdir -p $ARTIFACTS_DIR
    source /home/$USER/venv/bin/activate
    echo "Using VERSION_TAG=$VERSION_TAG"
    echo "CI runner: $CI_RUNNER_DESCRIPTION"
    ansible-playbook $REPO_DIR/ci-code/prepare/prepare_deploy.yaml 2>&1 | tee $ARTIFACTS_DIR/server_installation.log
  artifacts:
    reports:
      dotenv: prepare.env
  rules:
  - if: $DEPLOY_PLATFORM == "false"
    when: never
  - when: on_success
  resource_group: "deploy-$CI_RUNNER_DESCRIPTION"
  environment: "deploy-$CI_RUNNER_DESCRIPTION"
  retry: 1

deploy_and_test:
  stage: deploy_and_test
  needs:
  - prepare_pipeline
  - prepare_deployment_instance
  - build_packages
  variables:
    VERSION_TAG: $VERSION_TAG
    KAAPANA_DIR: $KAAPANA_DIR
    ARTIFACTS_DIR: $ARTIFACTS_DIR
  trigger:
    include:
      - local: 'ci/ci-code/deploy/.deploy_stage.yaml'
    strategy: depend
    forward:
      pipeline_variables: true
      yaml_variables: true
  rules:
  - if: $DEPLOY_PLATFORM == "false"
    when: never
  - when: on_success
  resource_group: "deploy-$CI_RUNNER_DESCRIPTION"
  environment: "deploy-$CI_RUNNER_DESCRIPTION"

#######################
############## CLEAN ########################
#############################################
if_ci_failing:
  stage: clean
  tags:
    - deploy-shared
  variables:
    ARTIFACTS_DIR: "/home/$USER/artifacts/$CI_COMMIT_SHORT_SHA/"
  script:
    - source /home/$USER/venv/bin/activate
    - cd $REPO_DIR/ci-code/clean
    - python3 create_ticket_if_ci_failed.py
    - python3 notify_slack.py
  rules:
  - if: $CI_COMMIT_BRANCH == "develop"
    when: on_failure
  - if: $CI_COMMIT_BRANCH == "master"
    when: on_failure
  - when: never
  allow_failure: true

security:
  stage: clean
  tags:
    - build-shared
  script:
    - cd $REPO_DIR/ci-code/clean
    - export GIT_DESCRIBE=$(git describe)
    - source /home/$USER/venv/bin/activate
    - python3 create_vulnerability_report.py --output html $KAAPANA_DIR/build/security-reports/${GIT_DESCRIBE}/${GIT_DESCRIBE}_cves.json vulnerability_report.html
    - echo "Access the report at https://kaapana.pages.hzdr.de/-/kaapana/-/jobs/${CI_JOB_ID}/artifacts/ci/ci-code/clean/vulnerability_report.html"
  artifacts:
    paths:
      - ci/ci-code/clean/vulnerability_report.html
  allow_failure: true
  rules:
  - if: $BUILD_ARGUMENTS =~ /.*--vulnerability-scan.*/
    when: always
  - when: never

build_logs:
  stage: clean
  tags:
    - build-shared
  needs:
    - build_packages
    - prepare_pipeline
  script: 
    - mkdir -p $CI_PROJECT_DIR/artifacts/build
    - cp -r $ARTIFACTS_DIR/* $CI_PROJECT_DIR/artifacts/build/ || true
  artifacts:
    name: build-logs
    paths:
    - artifacts/build/
  when: always

deploy_logs:
  stage: clean
  tags:
    - deploy-shared
  needs:
    - deploy_and_test
    - prepare_pipeline
  variables:
    ARTIFACTS_DIR: "/home/$USER/artifacts/$CI_COMMIT_SHORT_SHA/"
  script:
    - mkdir -p $CI_PROJECT_DIR/artifacts/deploy
    - cp -r $ARTIFACTS_DIR/* $CI_PROJECT_DIR/artifacts/deploy/ || true
  artifacts:
    name: deploy-logs
    paths:
    - artifacts/deploy/
  when: always
