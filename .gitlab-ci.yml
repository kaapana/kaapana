default:
  interruptible: true

stages:
  - tests
  - build
  - deploy
  - test
  - clean

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_PIPELINE_SOURCE == "api"
      when: always
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: always
    # Release build: maintainer pushes a protected release
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
      when: always
    - if: $MAINTENANCE != "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $MAINTENANCE != "true" && $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $MAINTENANCE != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/
      when: always
    - when: never

variables:
  ############################################################################
  # All pipeline variables are declared here with their defaults — this block
  # is the reference documentation for the CI configuration.
  #
  # Precedence (highest wins): schedule/manual/trigger pipeline variables >
  # project UI variables > job rules:variables > job variables > these global
  # defaults. Keep project-level UI variables to the secrets and the registry
  # configuration marked below — a project variable silently overrides every
  # YAML value of the same name (that is what broke the 0.7.0 release build,
  # see RELEASING.md).
  ############################################################################

  # --- Execution toggles: which stages a pipeline runs.
  # Override per-run via "Run pipeline" or per-schedule via schedule variables.
  CI_EXEC_UNIT_TESTS: "true" # tests stage: unit tests + documentation build
  CI_EXEC_BUILD: "true" # build stage: full platform build
  CI_EXEC_BUILD_ARGUMENTS: "" # extra kaapana-build flags, e.g. "--vulnerability-scan"
  CI_EXEC_DEPLOY: "true" # deploy stage: provision test VM + server install + platform deploy
  CI_EXEC_INTEGRATION_TESTS: "true" # test stage: pytest + Playwright against the test VM
  CI_EXEC_DOCKER_PRUNE: "false" # "true" = wipe the runner docker cache first (cold build)
  CI_EXEC_DESTROY_DELAYED: "false" # "true" = keep the test VM for 4h after the pipeline for inspection
  MAINTENANCE: "false" # "true" pauses push/schedule/MR pipelines (workflow:rules)

  # --- Registries. Two registries are configured entirely (including URL) as
  # project variables (Settings → CI/CD → Variables):
  #   CI_REGISTRY_URL / CI_REGISTRY_USER / CI_REGISTRY_TOKEN — normal CI builds
  #   RELEASE_REGISTRY_URL / RELEASE_REGISTRY_USER / RELEASE_REGISTRY_TOKEN —
  #     protected; used only by release tag pipelines (build_packages rules)
  # Jobs and playbooks consume the effective REGISTRY_* values below; the tag
  # rule on build_packages swaps in the release triple via rules:variables.
  # NB: CI_REGISTRY_USER shadows a GitLab-predefined variable — the project
  # variable takes precedence, but if it is ever deleted, jobs silently get
  # the predefined value "gitlab-ci-token".
  REGISTRY_URL: $CI_REGISTRY_URL
  REGISTRY_USER: $CI_REGISTRY_USER
  REGISTRY_TOKEN: $CI_REGISTRY_TOKEN # secret — project variable (masked)

  # --- docker.io pull credentials (avoids anonymous pull rate limits)
  DOCKER_IO_USER: $DOCKER_IO_USER # project variable, paired with the password
  DOCKER_IO_PASSWORD: $DOCKER_IO_PASSWORD # secret — project variable (masked)

  # --- CI job image (docker executor, CI-ARCHITECTURE.md phase 2). One image
  # for all jobs, build jobs included. Runners pull with pull_policy =
  # ["if-not-present"], so bump CI_IMAGES_TAG in the same MR that changes
  # ci/images/** — re-pushing an existing tag leaves warm runners on the stale
  # image. Always $CI_REGISTRY_URL, never the release registry (REGISTRY_URL
  # is swapped on tag pipelines, this must not be).
  CI_IMAGES_TAG: "v1"
  CI_BASE_IMAGE: "$CI_REGISTRY_URL/ci-base:$CI_IMAGES_TAG"

  # Purpose-specific tokens (CI-AUDIT.md S2). Both currently alias the shared
  # CI_REGISTRY_TOKEN secret. To move a purpose onto its own credential, create
  # a project-level CI variable with the same name — project variables take
  # precedence over these YAML defaults, so no pipeline change is needed.
  GITLAB_API_TOKEN: $CI_REGISTRY_TOKEN
  BLABLADOR_API_TOKEN: $CI_REGISTRY_TOKEN

  # --- Deployment instance: the per-pipeline test VM on Harvester.
  # Leave DEPLOYMENT_INSTANCE_FQDN empty to provision a fresh VM. Set it (plus
  # DEPLOYMENT_INSTANCE_USER) to deploy onto an existing machine instead;
  # externally-provided VMs are never destroyed by the clean stage.
  DEPLOYMENT_INSTANCE_FQDN: ""
  DEPLOYMENT_INSTANCE_USER: "ubuntu"
  # vm_name is truncated in the provisioning playbook so the FQDN
  # (<vm_name>.<domain>) stays within the 57-char dcmsend peerhost limit.
  DEPLOYMENT_INSTANCE_VM_NAME: "ci-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  DEPLOYMENT_INSTANCE_DOMAIN: "vms.dkfz.de"
  DEPLOYMENT_INSTANCE_IMAGE_ID: "ubuntu24"
  DEPLOYMENT_INSTANCE_CPU: "32"
  DEPLOYMENT_INSTANCE_MEMORY: "256Gi"
  DEPLOYMENT_INSTANCE_DISK: "512Gi"
  DEPLOYMENT_INSTANCE_NETWORK: "harvester-public/dkfz-net"
  DEPLOYMENT_INSTANCE_STORAGE_CLASS: "px-fa-direct-access"
  DEPLOYMENT_INSTANCE_HARVESTER_NAMESPACE: "kaapana-ci"
  DEPLOYMENT_INSTANCE_SSH_KEYPAIR: "kaapana" # Harvester KeyPair resource in the namespace
  DEPLOYMENT_INSTANCE_PLATFORM_PREFIX: "ci-dep" # project namespaces become <prefix>-project-<short_id>

  # --- Orchestrator: machine-local paths on the deploy runner, as provisioned
  # by ci/harvester/setup_ci.yaml (tasks/configure-deploy-instance.yaml)
  ORCHESTRATOR_INSTANCE_PYTHON_VENV: "~/venv"
  ORCHESTRATOR_INSTANCE_HARVESTER_KUBECONFIG: "/home/ubuntu/.kube/harvester.yaml"
  ORCHESTRATOR_INSTANCE_PRIVATE_SSH_KEY: "~/.ssh/kaapana.pem"

  # --- Notifications (if_ci_failing on develop)
  SLACK_BOT_TOKEN: $SLACK_BOT_TOKEN # secret — project variable (masked)
  SLACK_CHANNEL_ID: $SLACK_CHANNEL_ID # project variable

  # --- Documentation (scheduled readthedocs check)
  KAAPANA_READTHEDOCS_TOKEN: $KAAPANA_READTHEDOCS_TOKEN # secret — project variable (masked)

  # --- DKFZ network proxy. NO_PROXY is mandatory alongside: requests/httpx
  # honor the proxy vars for EVERY destination incl. 127.0.0.1, so without the
  # exemptions the pytest-docker registries (kaapana_extensions_tests) and all
  # internal targets (test VMs on vms.dkfz.de, Harvester API, internal mirror)
  # hairpin through www-int2 and time out.
  HTTP_PROXY: "http://www-int2.dkfz-heidelberg.de:80"
  HTTPS_PROXY: "http://www-int2.dkfz-heidelberg.de:80"
  NO_PROXY: "localhost,127.0.0.1,.dkfz.de,.dkfz-heidelberg.de"
  no_proxy: "$NO_PROXY" # lowercase twin — some tools read only one casing

  # --- Fixed settings
  ANSIBLE_VERBOSITY: 0 # read natively by ansible-playbook
  GIT_STRATEGY: "none" # Don't clone repo on each job by default; individual jobs will override as needed
  GIT_CLONE_PATH: "$CI_BUILDS_DIR/$CI_COMMIT_SHORT_SHA"
  ARTIFACTS_DIR: "$CI_PROJECT_DIR/artifacts"
  # Not declared here: CLIENT_SECRET is extracted from the deployed platform by
  # setup_integration_tests and passed downstream via a dotenv artifact.

##############################################
# CI IMAGE
##############################################
# Rebuilds the CI job image when its inputs change. Bootstrap is a manual
# build+push (CI-ARCHITECTURE.md phase 2, step 0); this job handles updates.
# Note: jobs of the same pipeline don't wait for this rebuild — land image
# changes with a CI_IMAGES_TAG bump, jobs pull the new tag on first use.
build_ci_image:
  stage: tests
  tags:
    - build-runner
  rules:
    # rules:changes only has a diff basis on push/MR pipelines — it evaluates
    # to true on schedule/web/api/trigger, which would rebuild every run.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop")
      changes:
        - ci/images/**/*
        - ci/harvester/tasks/requirements.txt
        - ci/ci-code/integration_tests/pyproject.toml
      when: on_success
    - when: never
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  script:
    - |
      set +x
      echo "$CI_REGISTRY_TOKEN" | docker login "$CI_REGISTRY_URL" -u "$CI_REGISTRY_USER" --password-stdin
    # Context is ci/, not the repo root — no .dockerignore exists, the root
    # would ship the entire checkout as build context.
    - docker build --build-arg http_proxy="$HTTP_PROXY" --build-arg https_proxy="$HTTPS_PROXY"
        -f ci/images/ci-base/Dockerfile -t "$CI_BASE_IMAGE" ci
    - docker push "$CI_BASE_IMAGE"
  after_script:
    # Don't leave docker login sessions on the shared runner (CI-AUDIT.md S2)
    - docker logout "$CI_REGISTRY_URL" || true

##############################################
# TESTS AND DOCS
##############################################
.test_template:
  stage: tests
  tags:
    - tests-runner
  # Docker executor: each job gets a fresh container — no venv juggling, no
  # per-job clone paths, no workspace GC (that was shell-executor hygiene).
  image: python:3.12
  rules:
    - if: '$CI_EXEC_UNIT_TESTS == "true"'
      when: always
    - when: never
  variables:
    KAAPANA_DIR: "$CI_PROJECT_DIR"
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1

##############################################
# Unit Tests: General Platform Tests
##############################################
unit_tests:
  extends: .test_template
  script:
    - pip install -r $KAAPANA_DIR/tests/requirements.txt
    - pytest $KAAPANA_DIR/tests/ --junitxml=unittest_report.xml
  artifacts:
    reports:
      junit:
        - unittest_report.xml

##############################################
# Task API Tests
##############################################
task_api_tests:
  extends: .test_template
  # These tests build and run real task containers (DockerRunner bind-mounts
  # paths and asserts on the outputs), so they get a per-job docker daemon as
  # a privileged dind service — the only job that needs one. Bind mounts
  # resolve because the runner shares the /builds volume with services, so
  # all mounted paths (TASK_DIR, TMPDIR) must live under $CI_PROJECT_DIR.
  services:
    - name: docker:28-dind
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    TMPDIR: "$CI_PROJECT_DIR/tmp"
    # docker-py goes through requests — the dind service must not hairpin
    # through the DKFZ proxy (requests reads no_proxy before NO_PROXY).
    NO_PROXY: "localhost,127.0.0.1,docker,.dkfz.de,.dkfz-heidelberg.de"
    no_proxy: "localhost,127.0.0.1,docker,.dkfz.de,.dkfz-heidelberg.de"
  script:
    - mkdir -p "$TMPDIR"
    # One pip invocation: task_api depends on the local sibling package
    # kaapana-containers — installing them together makes pip resolve it from
    # the repo instead of PyPI (installing task_api alone only worked on the
    # shell runner because the persistent venv already contained it).
    - pip install $KAAPANA_DIR/lib/kaapana_containers $KAAPANA_DIR/lib/task_api pytest
    - pytest $KAAPANA_DIR/lib/task_api/task_api --junitxml=task_api_report.xml

  artifacts:
    reports:
      junit:
        - task_api_report.xml

kaapana_extensions_tests:
  extends: .test_template
  # The integration tests need an OCI registry. Locally pytest-docker starts
  # one per xdist worker; here a single shared service container serves all
  # workers (KAAPANA_TEST_REGISTRY skips pytest-docker, conftest isolates
  # workers by repo) — keeps the tests runner free of any docker socket.
  services:
    - name: registry:3.1.1
      alias: registry
      variables:
        REGISTRY_STORAGE_DELETE_ENABLED: "true"
  variables:
    KAAPANA_TEST_REGISTRY: "http://registry:5000"
    # Both casings set explicitly: the service must not hairpin through the
    # DKFZ proxy, and requests reads no_proxy before NO_PROXY.
    NO_PROXY: "localhost,127.0.0.1,registry,.dkfz.de,.dkfz-heidelberg.de"
    no_proxy: "localhost,127.0.0.1,registry,.dkfz.de,.dkfz-heidelberg.de"
  script:
    - pip install -e "$KAAPANA_DIR/lib/kaapana_containers[test]"
    - pip install -e "$KAAPANA_DIR/lib/kaapana_extensions[test]"
    - pytest -n auto --asyncio-mode=auto
        $KAAPANA_DIR/lib/kaapana_containers/tests/
        $KAAPANA_DIR/lib/kaapana_extensions/tests/
        --junitxml=kaapana_extensions_report.xml
  artifacts:
    when: always
    reports:
      junit:
        - kaapana_extensions_report.xml

workflow_api_tests:
  extends: .test_template
  script:
    - pip install -r $KAAPANA_DIR/services/base/workflow-api/docker/files/tests/unit/requirements.txt
    - pytest $KAAPANA_DIR/services/base/workflow-api/docker/files/tests/unit --junitxml=workflow_api_report.xml
  artifacts:
    reports:
      junit:
        - workflow_api_report.xml

##############################################
# Extension API Tests
##############################################
extensions_api_tests:
  extends: .test_template
  script:
    - pip install -e "$KAAPANA_DIR/lib/kaapana_containers"
    - pip install -e "$KAAPANA_DIR/lib/kaapana_extensions"
    - pip install -r  $KAAPANA_DIR/services/base/extension-manager-service/docker/files/app/tests/requirements.txt
    - pytest  $KAAPANA_DIR/services/base/extension-manager-service/docker/files/app --junitxml=extensions_api_report.xml
  artifacts:
    reports:
      junit:
        - extensions_api_report.xml

##############################################
# Keycloak Backend Tests
##############################################
kaapana_backend_tests:
  extends: .test_template
  script:
    - pip install -r $KAAPANA_DIR/services/base/kaapana-backend/docker/files/tests/requirements.txt
    - pytest $KAAPANA_DIR/services/base/kaapana-backend/docker/files/tests/ --junitxml=kaapana_backend_report.xml
  artifacts:
    reports:
      junit:
        - kaapana_backend_report.xml

##############################################
# Access Information Interface Tests
##############################################
access_information_interface_tests:
  extends: .test_template
  script:
    - pip install -r $KAAPANA_DIR/services/data-separation/access-information-interface/docker/backend/files/tests/requirements.txt
    - pytest $KAAPANA_DIR/services/data-separation/access-information-interface/docker/backend/files/tests/test_keycloak_helper.py --junitxml=aii_report.xml
  artifacts:
    reports:
      junit:
        - aii_report.xml

##############################################
# Keycloak Setup Tests
##############################################
keycloak_setup_tests:
  extends: .test_template
  script:
    - pip install -r $KAAPANA_DIR/services/kaapana-admin/keycloak/keycloak-setup/tests/requirements.txt
    - pytest $KAAPANA_DIR/services/kaapana-admin/keycloak/keycloak-setup/tests/ --junitxml=keycloak_setup_report.xml
  artifacts:
    reports:
      junit:
        - keycloak_setup_report.xml

##############################################
# Documentation Build
##############################################
build_documentation:
  stage: tests
  extends: .test_template
  tags:
    - tests-runner
  script:
    - cd $KAAPANA_DIR/docs
    - pip install -r requirements.txt
    - make html 2>&1 | tee "build_documentation_html.log"
  artifacts:
    expose_as: "Documentation"
    paths:
      - $KAAPANA_DIR/docs/build/html/
      - "$KAAPANA_DIR/docs/build_documentation_html.log"

##############################################
# ReadTheDocs Build Check (scheduled pipelines on develop only)
##############################################
check_readthedocs:
  extends: .test_template
  image: $CI_BASE_IMAGE # needs curl + jq
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never
  script:
    - bash $KAAPANA_DIR/ci/ci-code/build/check_readthedocs.sh

##############################################
# BUILD
##############################################
build_packages:
  stage: build
  dependencies: []
  tags:
    - build-runner
  variables:
    GIT_STRATEGY: clone
    PYTHON_VENV_DIR: ".venv-build"
    RUNNER_SCRIPT_TIMEOUT: 8h
  timeout: 8 hours
  rules:
    # Release build: triggered by pushing a protected release tag. Publishes to
    # the release registry (protected RELEASE_REGISTRY_* project variables).
    # This override only works because no REGISTRY_* project variables exist —
    # project variables would outrank rules:variables (broke the 0.7.0 release).
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
      when: on_success
      variables:
        REGISTRY_URL: $RELEASE_REGISTRY_URL
        REGISTRY_USER: $RELEASE_REGISTRY_USER
        REGISTRY_TOKEN: $RELEASE_REGISTRY_TOKEN
        CI_EXEC_DOCKER_PRUNE: "true"
    - if: '$CI_EXEC_BUILD == "true"'
      when: on_success
    - when: never
  before_script:
    # Concurrent jobs GC the same directories — ENOENT races must not fail the job
    - find $CI_BUILDS_DIR/ -maxdepth 1 -mtime +7 -exec rm -rf -- {} \; || true
    - python3 -m venv "$PYTHON_VENV_DIR"
    - source "$PYTHON_VENV_DIR/bin/activate"
    - pip install --upgrade pip && pip install -e build_cli/
    - |-
      if [[ $CI_PIPELINE_SOURCE == "merge_request_event" ]]; then
        git checkout -B $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME $CI_COMMIT_SHA
      elif [[ -n "$CI_COMMIT_TAG" ]]; then
        # Tag pipeline: no branch ref; stay detached, git describe resolves the tag
        git checkout $CI_COMMIT_SHA
      else
        git checkout -B $CI_COMMIT_BRANCH $CI_COMMIT_SHA
      fi
    - git status
    - git fetch --tags

  script:
    - |
      [[ $CI_EXEC_DOCKER_PRUNE == "true" ]] && docker system prune --all --volumes -f

    # Disable exit-on-error for scan/check modes
    - |
      if [[ "$CI_EXEC_BUILD_ARGUMENTS" =~ (-vs|--vulnerability-scan|-cc|--configuration-check) ]]; then
        export EXIT_ON_ERROR="false"
      fi

    # Docker logins (set +x to hide credentials from job log)
    - |
      set +x
      echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
      echo "$DOCKER_IO_PASSWORD" | docker login docker.io -u "$DOCKER_IO_USER" --password-stdin
      export REGISTRY_PW="$REGISTRY_TOKEN"

    # Fix, for when registry.hzdr.de is unreachable — pre-pull collabora base image from internal mirror
    # so that the FROM in the Dockerfile resolves locally without needing the public registry.
    - |
      docker pull registry.git.dkfz.de/mic/personal/group1/kaapana-fallback/collabora-code-patched:23.05.5.4.1
      docker tag  registry.git.dkfz.de/mic/personal/group1/kaapana-fallback/collabora-code-patched:23.05.5.4.1 \
                  registry.hzdr.de/kaapana/public/collabora-code-patched:23.05.5.4.1

    # Run build, capturing exit code so artifacts are always collected
    - kaapana-build --default-registry "$REGISTRY_URL" $CI_EXEC_BUILD_ARGUMENTS

  after_script:
    # Don't leave docker login sessions on the shared runner (CI-AUDIT.md S2).
    # after_script runs in a fresh shell, so $REGISTRY_URL may not be the
    # release registry in a tag pipeline — log out of it explicitly too.
    - docker logout "$REGISTRY_URL" || true
    - '[[ -n "$RELEASE_REGISTRY_URL" ]] && docker logout "$RELEASE_REGISTRY_URL" || true'
    - docker logout docker.io || true

  artifacts:
    name: "build_$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - "$CI_PROJECT_DIR/build/build.log"
      # Trivy writes to <repo>/security-reports/ (trivy_helper.py), not build/
      - "$CI_PROJECT_DIR/security-reports/"
    exclude:
      # Trivy DB cache lives inside the reports dir — not a report
      - "$CI_PROJECT_DIR/security-reports/.trivy_cache/**/*"
      - "$CI_PROJECT_DIR/security-reports/.trivy_worker_*/**/*"

security:
  stage: build
  needs:
    - job: build_packages
      artifacts: true
  tags:
    - build-runner
  variables:
    PYTHON_VENV_DIR: ".venv-build"
    # The report script + vendored schema come from the repo, the reports from
    # the build_packages artifact — no reliance on runner disk state (B2).
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  before_script:
    - python3 -m venv "$PYTHON_VENV_DIR"
    - source "$PYTHON_VENV_DIR/bin/activate"
    - pip install jsonschema
  script:
    - CONSOLIDATED="$CI_PROJECT_DIR/security-reports/consolidated_vulnerability_report.json"
    - python3 "$CI_PROJECT_DIR/ci/ci-code/clean/create_vulnerability_report.py"
        "$CONSOLIDATED"
        "$CI_PROJECT_DIR/gl-container-scanning-report.json"
        --output json
    - python3 "$CI_PROJECT_DIR/ci/ci-code/clean/create_vulnerability_report.py"
        "$CONSOLIDATED"
        "$CI_PROJECT_DIR/vulnerability_report.html"
        --output html
    - echo "Access the report at https://kaapana.pages.hzdr.de/-/kaapana/-/jobs/${CI_JOB_ID}/artifacts/vulnerability_report.html"
  artifacts:
    paths:
      - "$CI_PROJECT_DIR/vulnerability_report.html"
    reports:
      container_scanning: "$CI_PROJECT_DIR/gl-container-scanning-report.json"
  allow_failure: true
  rules:
    - if: $CI_EXEC_BUILD == "true" && $CI_EXEC_BUILD_ARGUMENTS =~ /--vulnerability-scan/
      when: on_success
    - when: never
##############################################
# DEPLOY
##############################################

.remote_execution_template:
  tags:
    - deploy-runner
  before_script:
    - export ARTIFACTS_DIR="$ARTIFACTS_DIR"
    - VENV_PATH=$(eval echo "$ORCHESTRATOR_INSTANCE_PYTHON_VENV")
    - source "$VENV_PATH/bin/activate"
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - mkdir -p $ARTIFACTS_DIR
    - git fetch --tags --unshallow 2>/dev/null || git fetch --tags
    - VERSION_TAG=$(git describe --tags --always --dirty)
    - |
      if [[ "$CI_EXEC_BUILD_ARGUMENTS" =~ (--latest) && "$VERSION_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        BASE_TAG=$(echo "$VERSION_TAG" | sed -E 's/-[0-9]+-g[0-9a-f]+.*//')
        VERSION_TAG="${BASE_TAG}-latest"
      fi
    - export VERSION_TAG

##############################################

prepare_deployment:
  # Clone repo + Optional: Provision VM
  interruptible: false
  extends: .remote_execution_template
  rules:
    - if: '$CI_EXEC_DEPLOY == "true"'
      when: on_success
    - when: never
  stage: deploy
  variables:
    GIT_STRATEGY: "clone"
  script:
    # Concurrent jobs GC the same directories — ENOENT races must not fail the job
    - find $CI_BUILDS_DIR/ -maxdepth 1 -mtime +7 -exec rm -rf -- {} \; || true
    - |
      if [[ "$CI_EXEC_DEPLOY" == "true" && -z "$DEPLOYMENT_INSTANCE_FQDN" ]]; then
        # vm_name is truncated inside the provisioning playbook to keep the FQDN
        # within 57 characters (dcmsend peerhost limit).
        ansible-playbook -i localhost, "$CI_PROJECT_DIR/ci/ci-code/deploy/provision_harvester_vm.yaml"
      else
        # Fail early when a pre-provided FQDN is too long — dcmsend will reject it
        # during tests and the failure would surface much later otherwise.
        if [[ ${#DEPLOYMENT_INSTANCE_FQDN} -gt 57 ]]; then
          echo "ERROR: DEPLOYMENT_INSTANCE_FQDN '${DEPLOYMENT_INSTANCE_FQDN}' is ${#DEPLOYMENT_INSTANCE_FQDN} characters, exceeding the 57-character dcmsend peerhost limit."
          exit 1
        fi
        echo "Skipping VM provisioning and using existing deployment target: $DEPLOYMENT_INSTANCE_FQDN"
        mkdir -p artifacts
        echo "VM_FQDN=$DEPLOYMENT_INSTANCE_FQDN" > artifacts/deployment.env
        echo "VM_USER=$DEPLOYMENT_INSTANCE_USER" >> artifacts/deployment.env
      fi

  artifacts:
    when: always
    paths:
      - artifacts/deployment.env
    reports:
      dotenv: artifacts/deployment.env

##############################################

server_installation:
  extends: .remote_execution_template
  stage: deploy
  rules:
    - if: '$CI_EXEC_DEPLOY == "true"'
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
  script:
    - |
      ansible-playbook "$CI_PROJECT_DIR/ci/ci-code/deploy/server_installation.yaml" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$ORCHESTRATOR_INSTANCE_PRIVATE_SSH_KEY"
  artifacts:
    paths:
      - "artifacts/server_installation.log"
    when: always
    access: developer

##############################################

platform_deployment:
  extends: .remote_execution_template
  stage: deploy
  needs:
    - server_installation
    - job: prepare_deployment
      artifacts: true
  script:
    - |
      if [ -z "$VM_FQDN" ]; then
        echo "ERROR: VM_FQDN is empty. No deployment target."
        exit 1
      fi
    - |
      ansible-playbook "$CI_PROJECT_DIR/ci/ci-code/deploy/deploy_platform.yaml" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$ORCHESTRATOR_INSTANCE_PRIVATE_SSH_KEY"

    - echo "Kaapana Platform Deployed Successfully"
    - echo "Access the platform at https://$VM_FQDN"
    - |
      echo "<html>
      <body>
      <h1>Kaapana Platform Deployed</h1>
      <p>Access it here: <a href=\"https://$VM_FQDN\">https://$VM_FQDN</a></p>
      </body>
      </html>" > artifacts/deployment.html
  rules:
    - if: '$CI_EXEC_DEPLOY == "true"'
      when: on_success
    - when: never
  artifacts:
    paths:
      - "artifacts/deployment.log"
      - "artifacts/system_check.log"
      - "artifacts/deployment.html"
    when: always
    expose_as: "Kaapana Deployment Report"

##############################################
# INTEGRATION TESTS
##############################################
setup_integration_tests:
  extends: .remote_execution_template
  stage: test
  tags:
    - deploy-runner
  needs:
    - job: prepare_deployment
      artifacts: true
    - platform_deployment
  variables:
    VENV_NAME: "$CI_PROJECT_DIR/venv"
    INTEGRATION_TESTS: "$CI_PROJECT_DIR/ci/ci-code/integration_tests"

  rules:
    - if: '$CI_EXEC_INTEGRATION_TESTS == "true" && $CI_EXEC_DEPLOY == "true"'
      when: on_success
    - when: never
  script:
    - |
      ansible-playbook "$CI_PROJECT_DIR/ci/ci-code/integration_tests/remote_execution/setup_integration_tests.yaml" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$ORCHESTRATOR_INSTANCE_PRIVATE_SSH_KEY"
  artifacts:
    reports:
      dotenv:
        - artifacts/integration_test_setup.env
    access: developer

##############################################
# Local pytest execution template
##############################################
.integration_test_local:
  extends: .remote_execution_template
  stage: test
  rules:
    - if: '$CI_EXEC_INTEGRATION_TESTS == "true" && $CI_EXEC_DEPLOY == "true"'
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
    - job: setup_integration_tests
      artifacts: true
    - platform_deployment
  variables:
    VENV_NAME: "$CI_PROJECT_DIR/venv"
    PYTEST_ARGS: "--client-secret $CLIENT_SECRET --host $VM_FQDN --allowed-ports 22,80,443 --download-directory /home/ubuntu/downloaded_test_data"
  script:
    - |
      source artifacts/deployment.env
      source "$VENV_NAME/bin/activate"
      python3 -m pytest -n "${PYTEST_WORKERS:-auto}" -s "$CI_PROJECT_DIR/$PYTEST_FILE" $PYTEST_ARGS \
        --junitxml="$ARTIFACTS_DIR/$JUNIT_FILE" | tee "$ARTIFACTS_DIR/$LOG_FILE"
  artifacts:
    paths:
      - "$ARTIFACTS_DIR/$JUNIT_FILE"
      - "$ARTIFACTS_DIR/$LOG_FILE"
    reports:
      junit: ["$ARTIFACTS_DIR/$JUNIT_FILE"]

##############################################

scan_ports:
  extends: .integration_test_local
  variables:
    PYTEST_FILE: "ci/ci-code/integration_tests/tests/test_scan_ports.py"
    JUNIT_FILE: "scan_ports.xml"
    LOG_FILE: "scan_ports.log"

first_login:
  extends: .integration_test_local
  variables:
    PYTEST_FILE: "ci/ci-code/integration_tests/tests/test_first_login.py"
    JUNIT_FILE: "first_login.xml"
    LOG_FILE: "first_login.log"

install_extensions:
  extends: .integration_test_local
  needs:
    - job: prepare_deployment
      artifacts: true
    - job: setup_integration_tests
      artifacts: true
    - first_login
    - platform_deployment
    - playwright_ui_tests
  variables:
    PYTEST_FILE: "ci/ci-code/integration_tests/tests/test_install_extensions.py"
    JUNIT_FILE: "install_extensions.xml"
    LOG_FILE: "install_extensions.log"
    PYTEST_WORKERS: "4"
  retry: 2

send_data:
  extends: .integration_test_local
  needs:
    - job: prepare_deployment
      artifacts: true
    - job: setup_integration_tests
      artifacts: true
    - first_login
    - install_extensions
  variables:
    PYTEST_FILE: "ci/ci-code/integration_tests/tests/test_send_data.py"
    JUNIT_FILE: "send_data.xml"
    LOG_FILE: "send_data.log"
    PYTEST_WORKERS: "4"
  retry: 2

run_workflows:
  extends: .integration_test_local
  timeout: 2 hours
  allow_failure: true
  needs:
    - job: prepare_deployment
      artifacts: true
    - job: setup_integration_tests
      artifacts: true
    - first_login
    - send_data
    - install_extensions
  variables:
    PYTEST_FILE: "ci/ci-code/integration_tests/tests/test_run_workflows.py"
    JUNIT_FILE: "run_workflow.xml"
    LOG_FILE: "run_workflow.log"
    PYTEST_WORKERS: "4"

playwright_ui_tests:
  extends: .remote_execution_template
  stage: test
  rules:
    - if: '$CI_EXEC_INTEGRATION_TESTS == "true" && $CI_EXEC_DEPLOY == "true"'
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
    - platform_deployment
    - first_login
  script:
    - source artifacts/deployment.env
    - cd "$CI_PROJECT_DIR/tests/ui"
    - npm ci
    - npx playwright install --with-deps chromium
    - |
      KAAPANA_TEST_INSTANCE_UI="https://$VM_FQDN" \
        npx playwright test \
          --project auth-setup \
          --project project-management \
          --workers 1
  artifacts:
    when: always
    paths:
      - tests/ui/playwright-report/
      - tests/ui/test-results/
    expose_as: "Playwright UI Report"
    reports:
      junit: tests/ui/test-results/junit.xml

# #############################################
# ############## CLEAN ########################
# #############################################
destroy_deployment:
  stage: clean
  interruptible: false
  timeout: 6 hours
  needs:
    - job: prepare_deployment
      artifacts: true
  rules:
    # Never destroy externally-provided VMs
    - if: '$CI_EXEC_DEPLOY == "true" && $DEPLOYMENT_INSTANCE_FQDN != ""'
      when: never
    # Opt-in delayed destruction (e.g. keep VM alive to inspect after success)
    - if: '$CI_EXEC_DEPLOY == "true" && $CI_EXEC_DESTROY_DELAYED == "true"'
      when: delayed
      start_in: 4 hours
    # Default: always destroy (on success and on failure)
    - if: '$CI_EXEC_DEPLOY == "true"'
      when: always
    - when: never
  tags:
    - deploy-runner
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  before_script:
    - VENV_PATH=$(eval echo "$ORCHESTRATOR_INSTANCE_PYTHON_VENV")
    - source "$VENV_PATH/bin/activate"
  script:
    - bash "$CI_PROJECT_DIR/ci/ci-code/clean/wait_and_destroy.sh"

if_ci_failing:
  stage: clean
  tags:
    - deploy-runner
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  # Every job of the earlier stages must be listed here (optional: true keeps
  # reduced pipeline shapes valid): with needs, when: on_failure triggers on
  # failures among the needed jobs only. artifacts: true marks the jobs whose
  # logs feed the issue report — everything else is explicitly excluded so this
  # job never downloads secrets (integration-test dotenv) or bulky reports.
  # When adding a job to the pipeline, add it here too.
  needs:
    - { job: build_ci_image, optional: true, artifacts: false }
    - { job: unit_tests, optional: true, artifacts: false }
    - { job: task_api_tests, optional: true, artifacts: false }
    - { job: kaapana_extensions_tests, optional: true, artifacts: false }
    - { job: workflow_api_tests, optional: true, artifacts: false }
    - { job: extensions_api_tests, optional: true, artifacts: false }
    - { job: kaapana_backend_tests, optional: true, artifacts: false }
    - { job: access_information_interface_tests, optional: true, artifacts: false }
    - { job: keycloak_setup_tests, optional: true, artifacts: false }
    - { job: build_documentation, optional: true, artifacts: false }
    - { job: check_readthedocs, optional: true, artifacts: false }
    - { job: build_packages, optional: true, artifacts: true }
    - { job: security, optional: true, artifacts: false }
    - { job: prepare_deployment, optional: true, artifacts: false }
    - { job: server_installation, optional: true, artifacts: true }
    - { job: platform_deployment, optional: true, artifacts: true }
    - { job: setup_integration_tests, optional: true, artifacts: false }
    - { job: scan_ports, optional: true, artifacts: true }
    - { job: first_login, optional: true, artifacts: true }
    - { job: install_extensions, optional: true, artifacts: true }
    - { job: send_data, optional: true, artifacts: true }
    - { job: run_workflows, optional: true, artifacts: true }
    - { job: playwright_ui_tests, optional: true, artifacts: false }
  before_script:
    - VENV_PATH=$(eval echo "$ORCHESTRATOR_INSTANCE_PYTHON_VENV")
    - source "$VENV_PATH/bin/activate"
  script:
    - mkdir -p "$ARTIFACTS_DIR"
    # build.log is delivered outside artifacts/ — move it into the dir the
    # ticket script scans for *.log files
    - '[[ -f "$CI_PROJECT_DIR/build/build.log" ]] && cp "$CI_PROJECT_DIR/build/build.log" "$ARTIFACTS_DIR/" || true'
    - cd "$CI_PROJECT_DIR/ci/ci-code/clean"
    - python3 create_ticket_if_ci_failed.py
    - python3 notify_slack.py
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_failure

