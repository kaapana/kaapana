repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        entry: ci/ci-code/lint/helm_lint.sh validate
        language: python
        require_serial: true
        files: (^|/)(Chart\.yaml|requirements\.yaml|values\.yaml|templates/.*)$
  - repo: local
    hooks:
      - id: ui-lint
        name: ESLint
        entry: ci/ci-code/lint/ui_lint.sh validate
        language: system
        files: \.(js|mjs|cjs|jsx|ts|mts|tsx|vue)$
        require_serial: true
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: ci/ci-code/lint/prettier_lint.sh format
        language: system
        files: \.(js|mjs|cjs|jsx|ts|mts|tsx|vue|md|json|ya?ml)$
        require_serial: true
        stages: [manual]
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
