# Install with:
#   pip install pre-commit && pre-commit install
# Keep rev in sync with RUFF_VERSION in ci/ci-code/lint/ruff_lint.sh.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # ruff also formats Python fences in Markdown and the CI job checks them
        types_or: [python, pyi, jupyter, markdown]

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint, kubeconform, kube-linter
        entry: ci/ci-code/lint/helm_lint.sh
        language: python
        require_serial: true
        files: (^|/)(Chart\.yaml|requirements\.yaml|values\.yaml|templates/.*)$
  - repo: local
    hooks:
      - id: ui-lint
        name: ESLint/Prettier
        entry: ci/ci-code/lint/ui_lint.sh
        language: system
        files: \.(ts|mts|tsx|vue)$
        require_serial: true
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
