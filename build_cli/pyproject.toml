[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaapana_build_cli"
version = "0.1.0"
description = "CLI tool for building the Kaapana platform (containers, Helm charts, offline installer)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Kaapana Team"}
]
dependencies = [
    "alive-progress==3.2.0",
    "GitPython==3.1.42",
    "inquirerpy==0.3.4",
    "Jinja2==3.1.6",
    "pyyaml==6.0.2",
    "semver==3.0.4",
    "treelib==1.8.0",
    "requests==2.32.4",
    "urllib3==2.5.0",
    "httpx==0.28.1",
    "rich==14.2.0",
    "networkx==3.5",
    "pydantic==2.12.5",
    "python-dotenv>=1.0.0,<2",
    "typer==0.20.0",
]

[project.scripts]
kaapana-build = "build_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["build_cli*"]

[tool.setuptools.package-data]
build_cli = [
    "configs/*.yaml",
    "configs/*.json",
    "configs/.trivyignore.yaml",
]
