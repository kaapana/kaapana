default:
  tags:
    - deploy-shared
  interruptible: true

stages:
  - deploy
  - test

workflow:
  rules:
    - when: always

platform_deployment:
  stage: deploy
  script:
    - source /home/$USER/venv/bin/activate
    - ansible-playbook $REPO_DIR/ci-code/deploy/deploy_platform.yaml
    - ip_address=$(hostname -I | awk '{print $1}') || ip_address=""
    - echo "ip_address=$ip_address" > prepare.env
    - echo "ARTIFACTS_DIR=${ARTIFACTS_DIR:-/tmp/kaapana_artifacts}" >> prepare.env
    - echo "KAAPANA_DIR=${KAAPANA_DIR:-/home/ubuntu/builds/$CI_COMMIT_SHORT_SHA}" >> prepare.env
    - echo "VERSION_TAG=${VERSION_TAG:-}" >> prepare.env
    - echo "DEPLOYMENT_INSTANCE_NAME=${DEPLOYMENT_INSTANCE_NAME:-}" >> prepare.env
  artifacts: ### Save environment such that upcoming tasks can depend on this task and have all variables available
    reports:
      dotenv: prepare.env
  retry: 1

#############################################
############## TESTS ########################
#############################################
first_login:
  stage: test
  script:
    - source /home/$USER/venv/bin/activate
    # Get client secret from helm and save to prepare.env
    - echo "CLIENT_SECRET=$(helm get values kaapana-admin-chart -o json | jq -r .global.oidc_client_secret)" >> prepare.env
    # Run UI tests using docker compose (mimic Ansible logic)
    - export KAAPANA_URL="https://$ip_address"
    - export TEST_FILE="tests/test_first_login.py"
    - export LOG_FILE="$ARTIFACTS_DIR/first_login.log"
    - cd $REPO_DIR/ci-code/test/jobs/ui_tests
    - touch "$LOG_FILE"
    - docker compose up --build --exit-code-from tests --force-recreate || true
    - docker rm -f ui_tests_tests_1 ui_tests_selenium_1 || true
    - docker compose logs > "$ARTIFACTS_DIR/ui-tests.log" || true
    # Fail if UI tests failed
    - docker compose ps | grep tests | grep -q "Exit 0" || exit 1
  artifacts:
    reports:
      dotenv: prepare.env
  rules:
    - if: $TEST_STAGE == "true"
      when: on_success
    - when: never

send_testdata:
  stage: test
  script:
    - source /home/$USER/venv/bin/activate 
    - ansible-playbook $REPO_DIR/ci-code/test/jobs/testdata/prepare_data.yaml --extra-vars "ansible_groupname=$DEPLOYMENT_INSTANCE_NAME"
  needs:
    - first_login
  allow_failure: false
  rules:
    - if: $TEST_STAGE == "true"
      when: on_success
    - when: never
  retry: 2

install_extensions:
  stage: test
  script:
    - source /home/$USER/venv/bin/activate
    - cd $REPO_DIR/ci-code/test/src
    - python3 install_extensions.py --host "$ip_address" --install-all --timeout 3000 > "$ARTIFACTS_DIR/install_extensions.log" 2>&1 || (cat "$ARTIFACTS_DIR/install_extensions.log" && exit 1)
  needs:
    - first_login
  allow_failure: false
  rules:
    - if: $TEST_STAGE == "true"
      when: on_success
    - when: never
  retry: 2

integration_tests:
  stage: test
  script:
    - python3 -m virtualenv $KAAPANA_DIR/ci/.ci
    - source $KAAPANA_DIR/ci/.ci/bin/activate
    - python3 -m pip install -r $KAAPANA_DIR/ci/ci-code/test/src/requirements.txt
    - export test_files=$( find ${KAAPANA_DIR}/data-processing -wholename *ci-config/*.yaml)
    - pytest $KAAPANA_DIR/ci/ci-code/test/src/test_workflows.py --files ${test_files} --host ${ip_address} --junitxml=workflow_test_report.xml -n 4 -s --log-cli-level=INFO
  artifacts:
    when: always
    paths:
    - workflow_test_report.xml
    reports:
      junit: 
        - workflow_test_report.xml
  needs:
    - first_login
    - send_testdata
    - install_extensions
  allow_failure: true
  rules:
    - if: $TEST_STAGE == "true"
      when: on_success
    - when: never

port_scan:
  stage: test
  script:
    - source /home/$USER/venv/bin/activate 
    - python3 $REPO_DIR/ci-code/test/src/scan_ports.py
  variables:
    ALLOWED_PORTS: "22,80,443"
