---
- name: Delete VM on Harvester
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    vm_fqdn: "{{ lookup('env', 'VM_FQDN') }}"
    vm_name: "{{ vm_fqdn.split('.')[0] }}"
    harvester_namespace: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_HARVESTER_NAMESPACE') }}"
    harvester_kubeconfig: "{{ lookup('env', 'HARVESTER_KUBECONFIG') }}"

  tasks:

    - name: Check if VM exists
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      register: vm_check
      failed_when: false
      changed_when: false

    - name: Extract PVC names from VM spec before deletion
      when:
        - vm_check.resources is defined
        - vm_check.resources | length > 0
      ansible.builtin.set_fact:
        vm_pvcs: >-
          {{
            vm_check.resources[0].spec.template.spec.volumes
            | selectattr('persistentVolumeClaim', 'defined')
            | map(attribute='persistentVolumeClaim.claimName')
            | list
          }}

    - name: Show discovered PVCs
      when: vm_pvcs is defined
      ansible.builtin.debug:
        var: vm_pvcs

    - name: Delete VM
      when:
        - vm_check.resources is defined
        - vm_check.resources | length > 0
      kubernetes.core.k8s:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
        state: absent

    - name: Wait until VM is deleted
      when:
        - vm_check.resources is defined
        - vm_check.resources | length > 0
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      register: delete_check
      until: delete_check.resources | length == 0
      retries: 60
      delay: 10
      failed_when: false
      changed_when: false

    - name: Delete PVCs attached to VM
      when:
        - vm_pvcs is defined
        - vm_pvcs | length > 0
      kubernetes.core.k8s:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
        state: absent
      loop: "{{ vm_pvcs }}"
      ignore_errors: true

    - name: Wait until PVCs are deleted
      when:
        - vm_pvcs is defined
        - vm_pvcs | length > 0
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      register: pvc_delete_check
      until: pvc_delete_check.resources | length == 0
      retries: 30
      delay: 5
      failed_when: false
      changed_when: false
      loop: "{{ vm_pvcs }}"

    - name: Display result
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} and attached PVCs deleted (or did not exist)"