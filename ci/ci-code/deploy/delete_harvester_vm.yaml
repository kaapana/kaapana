---
- name: Delete VM on Harvester
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    vm_fqdn: "{{ lookup('env', 'VM_FQDN') }}"
    vm_dns_domain: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_DOMAIN') }}"
    _vm_name_env: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_VM_NAME') }}"
    _max_name_len: "{{ 57 - 1 - (vm_dns_domain | length) }}"
    # Prefer VM_FQDN (what prepare_deployment actually created). 
    # Fall back to the env-derived name with the same truncation as provisioning
    # VM_FQDN is only written on successful provisioning, and teardown must also work when prepare_deployment failed halfway.
    vm_name: "{{ vm_fqdn.split('.')[0] if vm_fqdn else (_vm_name_env[:(_max_name_len | int)] | regex_replace('-+$', '')) }}"
    harvester_namespace: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_HARVESTER_NAMESPACE') }}"
    harvester_kubeconfig: "{{ lookup('env', 'HARVESTER_KUBECONFIG') }}"

  tasks:

    - name: Fail if vm_name is empty
      ansible.builtin.assert:
        that: vm_name | length > 0
        fail_msg: "vm_name is empty — neither VM_FQDN nor DEPLOYMENT_INSTANCE_VM_NAME is set"

    - name: Check if VM exists
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      register: vm_check
      failed_when: false
      changed_when: false

    - name: Extract PVC names from VM spec before deletion
      when:
        - vm_check.resources is defined
        - vm_check.resources | length > 0
      ansible.builtin.set_fact:
        vm_pvcs: >-
          {{
            vm_check.resources[0].spec.template.spec.volumes
            | selectattr('persistentVolumeClaim', 'defined')
            | map(attribute='persistentVolumeClaim.claimName')
            | list
          }}

    - name: Show discovered PVCs
      when: vm_pvcs is defined
      ansible.builtin.debug:
        var: vm_pvcs

    # wait=true polls the resource itself for full removal, instead of a
    # hand-rolled k8s_info/until loop — a failed poll no longer crashes the
    # play, it just fails this task with a clear timeout message.
    - name: Delete VM and wait for full removal
      when:
        - vm_check.resources is defined
        - vm_check.resources | length > 0
      kubernetes.core.k8s:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
        state: absent
        wait: true
        wait_timeout: 600
        wait_sleep: 10

    - name: Delete PVCs attached to VM and wait for full removal
      when:
        - vm_pvcs is defined
        - vm_pvcs | length > 0
      kubernetes.core.k8s:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
        state: absent
        wait: true
        wait_timeout: 150
        wait_sleep: 5
      register: pvc_delete
      failed_when: false
      loop: "{{ vm_pvcs }}"

    # PVCs can be stuck in Terminating behind a finalizer (e.g. pvc-protection
    # not yet released by the VM teardown). Clear the finalizers on whichever
    # PVCs timed out above, then retry the delete.
    - name: Strip finalizers from PVCs still stuck in Terminating
      when: item.failed | default(false)
      kubernetes.core.k8s:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item.item }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
        state: patched
        merge_type: merge
        definition:
          metadata:
            finalizers: []
      loop: "{{ pvc_delete.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    # No failed_when: false here — if a PVC is still around after finalizers
    # are cleared, that's a real problem and the play should fail loudly.
    - name: Force-delete PVCs after clearing finalizers
      when: item.failed | default(false)
      kubernetes.core.k8s:
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item.item }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
        state: absent
        wait: true
        wait_timeout: 120
      loop: "{{ pvc_delete.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Display result
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} and attached PVCs deleted (or did not exist)"