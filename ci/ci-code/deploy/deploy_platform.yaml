---
# Deploy Kaapana platform (runs locally on the deploy VM)
# Uses kaapanactl.sh deploy for deployment
- name: Deploy Kaapana platform
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    registry_user: "{{ lookup('ansible.builtin.env', 'REGISTRY_USER') }}"
    registry_token: "{{ lookup('ansible.builtin.env', 'REGISTRY_TOKEN') }}"
    registry_url: "{{ lookup('ansible.builtin.env', 'REGISTRY_URL') }}"
    artifacts_dir: "{{ lookup('ansible.builtin.env', 'ARTIFACTS_DIR') }}"
    kaapana_dir: "{{ lookup('ansible.builtin.env', 'KAAPANA_DIR') }}"
    version_tag: "{{ lookup('ansible.builtin.env', 'VERSION_TAG') }}"
    http_proxy: "{{ lookup('ansible.builtin.env', 'HTTP_PROXY', default='') }}"
    https_proxy: "{{ lookup('ansible.builtin.env', 'HTTPS_PROXY', default='') }}"

  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ https_proxy }}"
    TERM: xterm

  tasks:
    - name: Get node IP address
      ansible.builtin.shell: hostname -I | awk '{print $1}'
      register: node_ip
      changed_when: false

    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Deploying Kaapana Platform
          ==========================
          Node IP: {{ node_ip.stdout }}
          Registry: {{ registry_url }}
          Version: {{ version_tag }}
          Kaapana Dir: {{ kaapana_dir }}

    - name: Verify microk8s is running
      ansible.builtin.command: microk8s status --wait-ready
      register: microk8s_status
      retries: 30
      delay: 10
      until: microk8s_status.rc == 0

    - name: Check kubernetes API is healthy
      ansible.builtin.command: microk8s kubectl cluster-info
      register: cluster_info
      retries: 10
      delay: 5
      until: cluster_info.rc == 0

    - name: Check helm can access kubernetes
      ansible.builtin.command: helm ls -A
      register: helm_check
      retries: 10
      delay: 5
      until: helm_check.rc == 0

    # Undeploy existing platform if present
    - name: Check for existing deployment
      ansible.builtin.command: helm ls -n admin -q
      register: existing_deployments
      changed_when: false
      failed_when: false

    - name: Undeploy existing platform
      when: existing_deployments.stdout | length > 0
      block:
        - name: Run kaapanactl.sh undeploy
          ansible.builtin.command:
            cmd: "{{ kaapana_dir }}/kaapanactl.sh deploy --undeploy --quiet"
            chdir: "{{ kaapana_dir }}"
          register: undeploy_result
          ignore_errors: yes

        - name: Save undeploy output
          ansible.builtin.copy:
            content: |
              Undeployment Output
              ===================
              STDOUT:
              {{ undeploy_result.stdout | default('') }}
              
              STDERR:
              {{ undeploy_result.stderr | default('') }}
              
              Return Code: {{ undeploy_result.rc }}
            dest: "{{ artifacts_dir }}/undeploy.log"

        - name: Fail if undeploy failed
          ansible.builtin.fail:
            msg: "Undeployment failed"
          when: undeploy_result.rc != 0

    # Clean filesystem
    - name: Delete kaapana data directories
      become: yes
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /home/kaapana/

    - name: Deploy the platform using kaapanactl.sh
      ansible.builtin.command:
        cmd: >
          {{ kaapana_dir }}/kaapanactl.sh deploy
          --quiet
          --chart {{ registry_url }}/kaapana-admin-chart:{{ version_tag }}
          --username {{ registry_user }}
          --password {{ registry_token }}
          --domain {{ node_ip.stdout }}
        chdir: "{{ kaapana_dir }}"
      register: deploy_result
      ignore_errors: yes

    - name: Save deployment output
      ansible.builtin.copy:
        content: |
          Deployment Output
          =================
          Command: kaapanactl.sh deploy --quiet --chart {{ registry_url }}/kaapana-platform-chart:{{ version_tag }} --domain {{ node_ip.stdout }}
          
          STDOUT:
          {{ deploy_result.stdout | default('') }}
          
          STDERR:
          {{ deploy_result.stderr | default('') }}
          
          Return Code: {{ deploy_result.rc }}
        dest: "{{ artifacts_dir }}/deployment.log"

    - name: Fail if deployment failed
      ansible.builtin.fail:
        msg: "Deployment failed with return code {{ deploy_result.rc }}"
      when: deploy_result.rc != 0

    - name: Wait for all deployments to be healthy
      ansible.builtin.command:
        cmd: "{{ kaapana_dir }}/kaapanactl.sh deploy --check-system"
        chdir: "{{ kaapana_dir }}"
      register: system_check
      retries: 60
      delay: 10
      until: system_check.rc == 0

    - name: Save system check output
      ansible.builtin.copy:
        content: |
          System Health Check
          ===================
          {{ system_check.stdout }}
        dest: "{{ artifacts_dir }}/system_check.log"

    - name: Display deployment success
      ansible.builtin.debug:
        msg: |
          ========================================
          Kaapana Platform Deployed Successfully!
          ========================================
          Access URL: https://{{ node_ip.stdout }}
          ========================================
