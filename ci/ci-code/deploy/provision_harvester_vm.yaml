---
- name: Provision VM on Harvester
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  vars:
    # VM configuration - all from environment variables
    vm_name: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_VM_NAME', default=undef()) }}"
    vm_image_name: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_IMAGE_ID', default=undef()) }}"
    vm_storage_class: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_STORAGE_CLASS', default=undef()) }}"
    vm_network: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_NETWORK', default=undef()) }}"
    vm_ssh_keypair: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_SSH_KEYPAIR', default=undef()) }}"
    vm_user: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_USER', default=undef()) }}"
    vm_dns_domain: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_DOMAIN', default=undef()) }}"
    vm_cpu_cores: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_CPU', default=undef()) }}"
    vm_cpu_sockets: 1
    vm_cpu_threads: 1
    vm_cpu_max_sockets: 1
    vm_memory_guest: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_MEMORY', default=undef()) }}"
    vm_memory_max: "{{ vm_memory_guest }}"
    vm_disk_size: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_DISK', default=undef()) }}"
    # Resolved lazily, so it follows the truncation vm_name may undergo below.
    vm_manifest_path: "/tmp/{{ vm_name }}-vm.yml"
    vm_ready_timeout: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_READY_TIMEOUT', default=600) | int }}"
    vm_ready_interval: 5
    vm_dns_timeout: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_DNS_TIMEOUT', default=300) | int }}"
    vm_dns_interval: 10
    # The only states that still resolve on their own. Everything else is a
    # verdict and ends the wait, including a state not listed below.
    vm_transient_states: ['', 'Provisioning', 'Starting']
    # Explains a verdict; not the list the wait breaks on.
    vm_failure_hints:
      ErrorUnschedulable: >-
        No node could accept the VM. Either the cluster is out of capacity, or a
        requested volume cannot be bound.
      WaitingForVolumeBinding: >-
        The disk PVC never bound. Check the storage class and its free capacity.
      ErrorPvcNotFound: >-
        The disk PVC vanished after the VM started referencing it.
      DataVolumeError: >-
        Importing the VM image into the disk failed.
      ErrImagePull: >-
        KubeVirt could not pull its own virt-launcher container image. A
        cluster-side problem, unrelated to the requested VM image.
      ImagePullBackOff: >-
        KubeVirt could not pull its own virt-launcher container image. A
        cluster-side problem, unrelated to the requested VM image.
      CrashLoopBackOff: >-
        The VM boots and dies repeatedly.
      Stopped: >-
        The VM was created but never started. A resource quota rejecting the
        launcher pod leaves it here, and Harvester sets runStrategy to Halted,
        so it will not come up on its own either.

    # Harvester connection
    harvester_namespace: "{{ lookup('env', 'DEPLOYMENT_INSTANCE_HARVESTER_NAMESPACE', default=undef()) }}"
    harvester_kubeconfig: "{{ lookup('env', 'HARVESTER_KUBECONFIG', default=undef()) }}"
    artifacts_dir: "{{ lookup('env', 'ARTIFACTS_DIR', default=undef()) }}"

    # Optional behavior
    force_recreate: "{{ force_recreate | default(false) | bool }}"

  pre_tasks:
  - name: Print all resolved VM variables
    ansible.builtin.debug:
      msg:
        - "vm_name={{ vm_name }}"
        - "vm_image_name={{ vm_image_name }}"
        - "vm_storage_class={{ vm_storage_class }}"
        - "vm_network={{ vm_network }}"
        - "vm_ssh_keypair={{ vm_ssh_keypair }}"
        - "vm_user={{ vm_user }}"
        - "vm_dns_domain={{ vm_dns_domain }}"
        - "vm_cpu_cores={{ vm_cpu_cores }}"
        - "vm_memory_guest={{ vm_memory_guest }}"
        - "vm_disk_size={{ vm_disk_size }}"
        - "harvester_namespace={{ harvester_namespace }}"
        - "harvester_kubeconfig={{ harvester_kubeconfig }}"
        - "artifacts_dir={{ artifacts_dir }}"

  # dcmsend imposes a 57-character limit on the peerhost (FQDN) field.
  # Truncate vm_name here, before any resources are created, so the
  # resulting FQDN (vm_name.vm_dns_domain) stays within that limit.
  - name: Truncate vm_name so FQDN stays within 57 characters
    ansible.builtin.set_fact:
      vm_name: "{{ vm_name[: 57 - 1 - (vm_dns_domain | length)] | regex_replace('-+$', '') }}"
      _vm_name_truncated: true
    when: (vm_name | length) > (57 - 1 - (vm_dns_domain | length))

  - name: Warn that vm_name was truncated to satisfy FQDN limit
    ansible.builtin.debug:
      msg: "WARNING: vm_name was truncated; FQDN will be {{ vm_name }}.{{ vm_dns_domain }} ({{ (vm_name + '.' + vm_dns_domain) | length }} chars)"
    when: _vm_name_truncated | default(false)

  - name: Fetch image by label selector
    kubernetes.core.k8s_info:
      api_version: harvesterhci.io/v1beta1
      kind: VirtualMachineImage
      namespace: "{{ harvester_namespace }}"
      kubeconfig: "{{ harvester_kubeconfig }}"
      label_selectors:
        - "harvesterhci.io/imageDisplayName={{ vm_image_name }}"
    register: image_query

  - name: Fail if no image found
    ansible.builtin.fail:
      msg: "No image found for {{ vm_image_name }}"
    when: image_query.resources | length == 0

  - name: Set image
    ansible.builtin.set_fact:
      image_resource: "{{ image_query.resources[0] }}"
      vm_image_id: "{{ image_query.resources[0].metadata.name }}"

  - name: Print resolved image
    ansible.builtin.debug:
      msg:
        - "ID: {{ vm_image_id }}"
        - "DisplayName: {{ image_resource.spec.displayName }}"
        - "StorageClass: {{ image_resource.spec.targetStorageClassName }}"
        - "URL: {{ image_resource.spec.url }}"

  - name: Get KeyPair
    kubernetes.core.k8s_info:
      api_version: harvesterhci.io/v1beta1
      kind: KeyPair
      name: "{{ vm_ssh_keypair }}"
      namespace: "{{ harvester_namespace }}"
      kubeconfig: "{{ harvester_kubeconfig }}"
    register: keypair_info
    failed_when: false
    changed_when: false
  
  - name: Fail if KeyPair not found
    ansible.builtin.fail:
      msg: >
        KeyPair '{{ vm_ssh_keypair }}' not found in namespace '{{ harvester_namespace }}'.
        Available KeyPairs are empty or name does not match.
    when: >
      keypair_info.resources is not defined
      or keypair_info.resources | length == 0

  - name: Extract public key from Harvester KeyPair
    ansible.builtin.set_fact:
      ssh_public_key: "{{ keypair_info.resources[0].spec.publicKey }}"

  - name: Generate unique PVC suffix
    ansible.builtin.set_fact:
      pvc_suffix: "{{ lookup('password', '/dev/null chars=ascii_lowercase,digits length=5') }}"

  - name: Create cloud-init secret with SSH key
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: "{{ vm_name }}-cloudinit"
          namespace: "{{ harvester_namespace }}"
        type: Opaque
        stringData:
          userdata: |
            #cloud-config
            package_update: true
            packages:
              - qemu-guest-agent
            ssh_authorized_keys:
              - "{{ ssh_public_key }}"
            runcmd:
              - systemctl enable --now qemu-guest-agent.service
          networkdata: ""
      kubeconfig: "{{ harvester_kubeconfig }}"
    register: secret_result

  - name: Render VM manifest from Jinja template
    ansible.builtin.template:
      src: templates/vm.yml.j2
      dest: "{{ vm_manifest_path }}"
      mode: '0644'

  - name: Apply VM manifest
    kubernetes.core.k8s:
      state: present
      definition: "{{ lookup('file', vm_manifest_path) | from_yaml }}"
      kubeconfig: "{{ harvester_kubeconfig }}"
    register: vm_apply_result

  - name: Extract VM UID
    ansible.builtin.set_fact:
      vm_uid: "{{ vm_apply_result.result.metadata.uid }}"

  - name: Wait for PVC to be created
    kubernetes.core.k8s_info:
      api_version: v1
      kind: PersistentVolumeClaim
      name: "{{ vm_name }}-disk-0-{{ pvc_suffix }}"
      namespace: "{{ harvester_namespace }}"
      kubeconfig: "{{ harvester_kubeconfig }}"
    register: pvc_check
    until: pvc_check.resources | length > 0
    retries: 30
    delay: 2
    changed_when: false

  - name: Link disk PVC to VM via ownerReferences
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: "{{ vm_name }}-disk-0-{{ pvc_suffix }}"
          namespace: "{{ harvester_namespace }}"
          ownerReferences:
            - apiVersion: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ vm_name }}"
              uid: "{{ vm_uid }}"
              blockOwnerDeletion: true
      kubeconfig: "{{ harvester_kubeconfig }}"
    register: pvc_ownership_result

  - name: Verify PVC has ownerReferences
    kubernetes.core.k8s_info:
      api_version: v1
      kind: PersistentVolumeClaim
      name: "{{ vm_name }}-disk-0-{{ pvc_suffix }}"
      namespace: "{{ harvester_namespace }}"
      kubeconfig: "{{ harvester_kubeconfig }}"
    register: pvc_verify

  - name: Debug PVC ownership
    ansible.builtin.debug:
      msg: "PVC ownerReferences: {{ pvc_verify.resources[0].metadata.get('ownerReferences', []) }}"

  - name: Link cloud-init secret to VM via ownerReferences
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: "{{ vm_name }}-cloudinit"
          namespace: "{{ harvester_namespace }}"
          ownerReferences:
            - apiVersion: kubevirt.io/v1
              kind: VirtualMachine
              name: "{{ vm_name }}"
              uid: "{{ vm_uid }}"
              blockOwnerDeletion: true
        type: Opaque
        stringData:
          userdata: |
            #cloud-config
            package_update: true
            packages:
              - qemu-guest-agent
            ssh_authorized_keys:
              - "{{ ssh_public_key }}"
            runcmd:
              - systemctl enable --now qemu-guest-agent.service
          networkdata: ""
      kubeconfig: "{{ harvester_kubeconfig }}"

  - name: Debug VM apply result
    ansible.builtin.debug:
      msg:
        - "VM applied successfully"
        - "Name: {{ vm_name }}"
        - "Namespace: {{ harvester_namespace }}"

  - name: Wait for the VM to reach a settled state
    kubernetes.core.k8s_info:
      api_version: kubevirt.io/v1
      kind: VirtualMachine
      name: "{{ vm_name }}"
      namespace: "{{ harvester_namespace }}"
      kubeconfig: "{{ harvester_kubeconfig }}"
    register: vm_info
    vars:
      _status: "{{ (vm_info.resources | first | default({})).get('status', {}).get('printableStatus', '') }}"
    until: _status not in vm_transient_states
    retries: "{{ ((vm_ready_timeout | int) / (vm_ready_interval | int)) | round(0, 'ceil') | int }}"
    delay: "{{ vm_ready_interval }}"
    changed_when: false

  - name: Remember the settled VM status
    ansible.builtin.set_fact:
      vm_printable_status: "{{ (vm_info.resources | first | default({})).get('status', {}).get('printableStatus', '') }}"

  # The VM status names the category, the instance conditions name the cause:
  # ErrorUnschedulable covers both exhausted capacity and an unbindable volume,
  # and only the scheduler's own message tells them apart.
  - name: Collect the conditions of the VM instance
    kubernetes.core.k8s_info:
      api_version: kubevirt.io/v1
      kind: VirtualMachineInstance
      name: "{{ vm_name }}"
      namespace: "{{ harvester_namespace }}"
      kubeconfig: "{{ harvester_kubeconfig }}"
    register: vmi_info
    when: vm_printable_status != 'Running'
    # The instance may not exist yet; a missing diagnosis must not replace the
    # actual failure below.
    failed_when: false
    changed_when: false

  - name: Fail with the provisioning cause
    vars:
      # A quota rejection never creates a VMI, so its cause lives here instead.
      _vm_quota: >-
        {{ (vm_info.resources | first | default({})).get('metadata', {}).get('annotations', {})
           .get('harvesterhci.io/insufficient-resource-quota', '') }}
      _vmi_conditions: >-
        {{ (vmi_info.resources | default([]) | first | default({})).get('status', {}).get('conditions', [])
           | selectattr('status', 'equalto', 'False')
           | selectattr('message', 'defined')
           | map(attribute='message') | join(' | ') }}
    ansible.builtin.fail:
      msg: >-
        VM {{ vm_name }} did not reach Running in namespace {{ harvester_namespace }}.
        Status: {{ vm_printable_status | default('none reported', true) }}.
        {{ vm_failure_hints.get(vm_printable_status, 'Unexpected state, inspect the VM directly.') }}
        {% if _vm_quota %}Quota: {{ _vm_quota }}{% endif %}
        {% if _vmi_conditions %}Instance conditions: {{ _vmi_conditions }}{% endif %}
    when: vm_printable_status != 'Running'

  - name: Wait for DNS to resolve
    ansible.builtin.command: getent hosts {{ vm_name }}.{{ vm_dns_domain }}
    register: dns_result
    until: dns_result.rc == 0
    retries: "{{ ((vm_dns_timeout | int) / (vm_dns_interval | int)) | round(0, 'ceil') | int }}"
    delay: "{{ vm_dns_interval }}"
    changed_when: false
    failed_when: false

  - name: Fail if the FQDN never resolved
    ansible.builtin.fail:
      msg: >-
        VM {{ vm_name }} is running, but {{ vm_name }}.{{ vm_dns_domain }} did not
        resolve within {{ vm_dns_timeout }}s. The VM itself came up, so this is name
        resolution, not provisioning: check the record in {{ vm_dns_domain }}.
    when: dns_result.rc != 0

  - name: Set VM FQDN fact
    ansible.builtin.set_fact:
      vm_fqdn: "{{ vm_name }}.{{ vm_dns_domain }}"

  - name: Clean up local manifest
    ansible.builtin.file:
      path: "{{ vm_manifest_path }}"
      state: absent

  post_tasks:
    - name: Write deployment env file
      ansible.builtin.copy:
        content: |
          VM_FQDN={{ vm_fqdn }}
          VM_USER={{ vm_user }}
        dest: "{{ artifacts_dir }}/deployment.env"
        mode: '0644'
