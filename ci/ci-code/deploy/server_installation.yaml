---
- name: Install Kaapana Server
  hosts: all
  gather_facts: false
  become: false

  environment:
    http_proxy: "{{ lookup('ansible.builtin.env', 'HTTP_PROXY') }}"
    https_proxy: "{{ lookup('ansible.builtin.env', 'HTTPS_PROXY') }}"

  vars:
    ansible_python_interpreter: /usr/bin/python3
    kaapana_dir: "{{ lookup('env', 'CI_PROJECT_DIR') }}"
    artifacts_dir: "{{ lookup('env', 'ARTIFACTS_DIR') }}"
  tasks:
    - name: Wait for SSH on the deployment target
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Gather facts
      ansible.builtin.setup:

    - name: Increase inotify watchers
      become: yes
      ansible.builtin.command: 
        cmd: sysctl -w fs.inotify.max_user_watches=10000

    - name: Increase inotify watchers
      become: yes
      ansible.builtin.command: 
        cmd: sysctl -w fs.inotify.max_user_instances=10000


    - name: Copy server installation script
      ansible.builtin.copy:
        src: "{{ kaapana_dir }}/kaapanactl.sh"
        dest: "{{ ansible_facts['env']['HOME'] }}/kaapanactl.sh"
        mode: "0755"

    - name: Install the server once the VM has booted
      block:
        - name: Wait for cloud-init to finish
          become: yes
          ansible.builtin.shell: |
            command -v cloud-init > /dev/null || exit 0
            timeout 600 cloud-init status --wait > /dev/null
            rc=$?
            cloud-init status --long
            exit $rc
          args:
            executable: /bin/bash
          register: cloud_init_wait
          changed_when: false
          failed_when: cloud_init_wait.rc not in [0, 2]

        - name: Wait for snapd to finish seeding
          become: yes
          ansible.builtin.shell: |
            command -v snap > /dev/null || exit 0
            timeout 600 snap wait system seed.loaded
            rc=$?
            [ $rc -eq 0 ] || timeout 60 snap changes
            exit $rc
          args:
            executable: /bin/bash
          changed_when: false

        - name: Wait for the system to finish booting
          ansible.builtin.shell: timeout 600 systemctl is-system-running --wait
          register: system_state
          changed_when: false
          failed_when: false

        - name: Show the system state before the installation
          ansible.builtin.debug:
            msg: "cloud-init rc={{ cloud_init_wait.rc }}, system state={{ system_state.stdout | default('') }}"

        - name: Execute server installation script
          ansible.builtin.shell: |
            set -o pipefail
            ./kaapanactl.sh install --quiet 2>&1 | tee server_installation.log
          args:
            chdir: "{{ ansible_facts['env']['HOME'] }}"
            executable: /bin/bash
          environment:
            DOCKER_IO_USER: "{{ lookup('ansible.builtin.env', 'DOCKER_IO_USER') }}"
            DOCKER_IO_PASSWORD: "{{ lookup('ansible.builtin.env', 'DOCKER_IO_PASSWORD') }}"
          register: server_installation_output
          become: yes
          become_flags: '-E'
          ignore_errors: true

        - name: Show script output in CI logs
          ansible.builtin.debug:
            var: server_installation_output.stdout_lines

        - name: Save server installation log
          ansible.builtin.copy:
            content: |
              RETURN CODE: {{ server_installation_output.rc }}

              STDOUT:
              {{ server_installation_output.stdout | default('') }}

              STDERR:
              {{ server_installation_output.stderr | default('') }}
            dest: "{{ artifacts_dir }}/server_installation.log"
          delegate_to: localhost

        - name: Fail if server installation failed
          ansible.builtin.fail:
            msg: "Server installation failed."
          when: server_installation_output.rc != 0

      rescue:
        - name: Collect diagnostics from the deployment target
          become: yes
          ansible.builtin.shell: |
            export PATH=/snap/bin:$PATH
            section() { echo; echo "### $1 ($(date -u +%FT%TZ))"; }
            {
              section "uptime, cpu, memory, disk"
              uptime; nproc; free -m; df -h /var /var/snap 2>&1
              section "cloud-init status"
              cloud-init status --long 2>&1
              section "system state"
              systemctl is-system-running 2>&1
              systemctl --failed --no-pager 2>&1
              section "running apt, dpkg, snap and cloud-init processes"
              ps -eo pid,etimes,cmd | grep -E 'apt|dpkg|unattended|cloud-init|snap' | grep -v grep
              section "snap changes"
              timeout 60 snap changes 2>&1
              section "snap tasks of the last install"
              timeout 60 snap tasks --last=install 2>&1
              section "microk8s service status"
              systemctl status 'snap.microk8s.*' --no-pager --lines=0 2>&1
              section "journal of the microk8s services"
              journalctl -b -u 'snap.microk8s.*' --no-pager 2>&1 | tail -n 500
              section "journal of snapd"
              journalctl -b -u snapd --no-pager 2>&1 | tail -n 300
              section "kernel log"
              journalctl -b -k --no-pager 2>&1 | tail -n 200
              section "apt history"
              cat /var/log/apt/history.log 2>&1
              section "cloud-init output"
              tail -n 200 /var/log/cloud-init-output.log 2>&1
              section "microk8s status"
              timeout 60 microk8s status 2>&1
              timeout 60 microk8s kubectl get pods -A -o wide 2>&1
            } > /tmp/server_installation_diagnostics.txt
            rm -f /tmp/microk8s_inspection.tar.gz
            if command -v microk8s > /dev/null; then
              timeout 300 microk8s inspect > /dev/null 2>&1
              report=$(ls -t /var/snap/microk8s/current/inspection-report-*.tar.gz 2>/dev/null | head -n 1)
              [ -n "$report" ] && cp "$report" /tmp/microk8s_inspection.tar.gz
            fi
            chmod 644 /tmp/server_installation_diagnostics.txt /tmp/microk8s_inspection.tar.gz 2>/dev/null
            exit 0
          args:
            executable: /bin/bash
          ignore_errors: true

        - name: Fetch the diagnostics
          become: yes
          ansible.builtin.fetch:
            src: "/tmp/{{ item }}"
            dest: "{{ artifacts_dir }}/{{ item }}"
            flat: true
            fail_on_missing: false
          loop:
            - server_installation_diagnostics.txt
            - microk8s_inspection.tar.gz
          ignore_errors: true

        - name: Fail with the task that failed
          ansible.builtin.fail:
            msg: "{{ ansible_failed_task.name }} failed."

    - name: Add user to microk8s group
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user | default(ansible_facts['user_id'], true) }}"
        groups: microk8s
        append: true

    - name: Reset SSH connection to apply group changes
      ansible.builtin.meta: reset_connection