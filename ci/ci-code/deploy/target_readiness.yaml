---
- name: Check deployment target readiness
  hosts: all
  gather_facts: false
  become: false

  vars:
    vm_fqdn: "{{ lookup('ansible.builtin.env', 'VM_FQDN') }}"
    artifacts_dir: "{{ lookup('ansible.builtin.env', 'ARTIFACTS_DIR') }}"
    ansible_python_interpreter: /usr/bin/python3
    # NodePorts the platform publishes: http, https, DICOM
    required_ports: "80,443,11112"
    min_disk_gib: 80
    redeploy: "{{ lookup('ansible.builtin.env', 'CI_EXEC_REDEPLOY') }}"
    kaapana_dir: "{{ lookup('ansible.builtin.env', 'CI_PROJECT_DIR') }}"
    advisory: "{{ lookup('ansible.builtin.env', 'CI_EXEC_SERVER_INSTALLATION') }}"
    remote_log: /tmp/target_readiness.log
    remote_json: /tmp/target_readiness.json
    admin_chart: "{{ lookup('ansible.builtin.env', 'DEPLOYMENT_INSTANCE_ADMIN_CHART') }}"
    helm_namespace: "{{ lookup('ansible.builtin.env', 'DEPLOYMENT_INSTANCE_HELM_NAMESPACE') }}"

  tasks:
    - name: Probe the SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 30
      ignore_unreachable: true
      ignore_errors: true
      register: ssh_probe

    - name: Fail when the target cannot be reached over SSH
      ansible.builtin.fail:
        msg: |
          Cannot reach the deployment target over SSH.
            target: {{ vm_fqdn }}
            user:   {{ ansible_user | default('(not set)') }}
          Check DEPLOYMENT_INSTANCE_FQDN / DEPLOYMENT_INSTANCE_USER, that the
          host is up, and that the public key matching
          DEPLOYMENT_INSTANCE_SSH_KEY is in the authorized_keys of that user.
          Ansible reported: {{ ssh_probe.msg | default('unreachable') }}
      when: ssh_probe.unreachable | default(false) or ssh_probe.failed | default(false)

    - name: Run the readiness checks (read-only, no sudo)
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/target_readiness.py
          --domain {{ vm_fqdn | quote }}
          --required-ports {{ required_ports | quote }}
          --min-disk-gib {{ min_disk_gib }}
          --redeploy {{ redeploy | quote }}
          --admin-chart {{ admin_chart | quote }}
          --helm-namespace {{ helm_namespace | quote }}
          --log {{ remote_log | quote }}
          --json {{ remote_json | quote }}
          {{ '--advisory' if advisory else '' }}
          --color
        executable: /usr/bin/python3
      register: readiness
      changed_when: false
      failed_when: readiness.rc not in [0, 1]

    - name: Fetch the readiness table
      ansible.builtin.fetch:
        src: "{{ remote_log }}"
        dest: "{{ artifacts_dir }}/target_readiness.log"
        flat: true
        fail_on_missing: false

    - name: Fetch the readiness checks as JSON
      ansible.builtin.fetch:
        src: "{{ remote_json }}"
        dest: "{{ artifacts_dir }}/target_readiness.json"
        flat: true
        fail_on_missing: false

    - name: Read the platform already deployed on the target
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          export PATH=/snap/bin:/usr/local/bin:$PATH
          helm -n {{ helm_namespace }} ls --short --no-headers \
            | grep -qFx {{ admin_chart | quote }} || exit 0
          helm -n {{ helm_namespace }} get values {{ admin_chart }} -o json \
            | jq -r '.global.platform_prefix // empty'
        executable: /bin/bash
      register: existing_prefix
      changed_when: false
      failed_when: false
      when: not (redeploy | bool)

    - name: Check the platform found on the target
      ansible.builtin.script:
        cmd: >-
          {{ kaapana_dir }}/kaapanactl.sh deploy --check-system
          --platform-prefix {{ existing_prefix.stdout | trim | quote }}
        executable: /bin/bash
      register: platform_check
      changed_when: false
      failed_when: false
      when: existing_prefix.stdout | default('') | trim | length > 0

    # In advisory mode only the rows server_installation cannot fix are still
    # failures, and a platform already deployed here is the one that counts.
    - name: Fail when the target is not ready
      ansible.builtin.fail:
        msg: >-
          {{ vm_fqdn }} is not ready — see the failed rows and their fixes in
          the table below.
          {% if existing_prefix.stdout | default('') | trim | length > 0 %}

          A Kaapana platform is already deployed on this target. Undeploy it
          ('./kaapanactl.sh deploy --undeploy'), or re-run with
          '-i exec_redeploy:bool(true)' to have platform_deployment replace it.
          {% endif %}
          {% if platform_check.stdout | default('') | length > 0 %}

          The platform already deployed on this target reports:

          {{ platform_check.stdout }}
          {% endif %}
      when: readiness.rc != 0
