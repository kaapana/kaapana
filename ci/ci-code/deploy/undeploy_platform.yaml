---
# Removes the platform already deployed on the target, so deploy_platform can
# install a fresh one. Runs only when the pipeline was started with
# exec_redeploy:true.
# In:  a target reachable over ssh with microk8s + helm ready
# Out: artifacts/undeploy.log
- name: Undeploy the Kaapana platform on the target
  hosts: all
  gather_facts: true
  vars:
    vm_fqdn: "{{ lookup('ansible.builtin.env', 'VM_FQDN') }}"
    artifacts_dir: "{{ lookup('ansible.builtin.env', 'ARTIFACTS_DIR') }}"
    kaapana_dir: "{{ lookup('ansible.builtin.env', 'CI_PROJECT_DIR') }}"
    http_proxy: "{{ lookup('ansible.builtin.env', 'HTTP_PROXY') }}"
    https_proxy: "{{ lookup('ansible.builtin.env', 'HTTPS_PROXY') }}"
    ansible_python_interpreter: /usr/bin/python3
    admin_chart: "{{ lookup('ansible.builtin.env', 'DEPLOYMENT_INSTANCE_ADMIN_CHART') }}"
    helm_namespace: "{{ lookup('ansible.builtin.env', 'DEPLOYMENT_INSTANCE_HELM_NAMESPACE') }}"

  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ https_proxy }}"
    TERM: xterm

  tasks:
    - name: Copy kaapanactl.sh to the target
      ansible.builtin.copy:
        src: "{{ kaapana_dir }}/kaapanactl.sh"
        dest: "{{ ansible_facts['env']['HOME'] }}/kaapanactl.sh"
        mode: "0755"

    - name: Look for a platform deployed on the target
      ansible.builtin.shell:
        cmd: |
          helm -n {{ helm_namespace }} ls --short --no-headers \
            | grep -Fx {{ admin_chart | quote }} || true
        executable: /bin/bash
      register: existing_release
      changed_when: false

    - name: Report that there is nothing to undeploy
      ansible.builtin.debug:
        msg: "No {{ admin_chart }} release in namespace {{ helm_namespace }} on {{ vm_fqdn }} — nothing to undeploy."
      when: existing_release.stdout | trim | length == 0

    - name: Undeploy the platform using kaapanactl.sh
      ansible.builtin.command:
        cmd: "{{ ansible_facts['env']['HOME'] }}/kaapanactl.sh deploy --undeploy --quiet"
      register: undeploy_result
      ignore_errors: true
      changed_when: undeploy_result.rc == 0
      when: existing_release.stdout | trim | length > 0

    - name: Display STDOUT
      ansible.builtin.debug:
        var: undeploy_result.stdout_lines
      when: undeploy_result is not skipped

    - name: Display STDERR
      ansible.builtin.debug:
        var: undeploy_result.stderr_lines
      when: undeploy_result is not skipped

    - name: Save undeploy output
      ansible.builtin.copy:
        content: |
          Undeployment Output
          ===================
          Command: {{ ansible_facts['env']['HOME'] }}/kaapanactl.sh deploy --undeploy --quiet

          STDOUT:
          {{ undeploy_result.stdout | default('') }}

          STDERR:
          {{ undeploy_result.stderr | default('') }}

          Return Code: {{ undeploy_result.rc | default('n/a') }}
        dest: "{{ artifacts_dir }}/undeploy.log"
      delegate_to: localhost
      when: undeploy_result is not skipped

    - name: Fail if the undeployment failed
      ansible.builtin.fail:
        msg: |
          Undeploying the platform on {{ vm_fqdn }} failed (rc={{ undeploy_result.rc }}).

          Last lines:
          {{ (undeploy_result.stdout_lines | default([]))[-20:] | join('\n') }}

          Full output: artifacts/undeploy.log
      when:
        - undeploy_result is not skipped
        - undeploy_result.rc != 0

    - name: Verify the release is gone
      ansible.builtin.shell:
        cmd: |
          helm -n {{ helm_namespace }} ls --short --no-headers \
            | grep -Fx {{ admin_chart | quote }} || true
        executable: /bin/bash
      register: remaining_release
      changed_when: false
      when: undeploy_result is not skipped

    - name: Fail when the release survived the undeployment
      ansible.builtin.fail:
        msg: |
          Release {{ admin_chart }} is still in namespace {{ helm_namespace }} on
          {{ vm_fqdn }} after the undeployment.

          Full output: artifacts/undeploy.log
      when:
        - undeploy_result is not skipped
        - remaining_release.stdout | default('') | trim | length > 0
