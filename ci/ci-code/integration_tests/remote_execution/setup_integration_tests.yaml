---
# Extracts the OIDC client secret from the deployed platform and hands it to
# the test jobs via a dotenv artifact. Test dependencies are baked into the
# CI job image — this playbook installs nothing.
- name: Extract integration-test credentials from the deployed platform
  hosts: all
  gather_facts: false
  become: false

  vars:
    artifacts_dir: "{{ lookup('env', 'ARTIFACTS_DIR') }}"
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Fetch client secret from remote VM
      ansible.builtin.shell: |
        helm get values kaapana-admin-chart -o json 2>/dev/null | jq -r .global.oidc_client_secret 2>/dev/null || true
      register: client_secret
      changed_when: false

    - name: Fail if the client secret could not be read
      ansible.builtin.fail:
        msg: "Could not read oidc_client_secret from the deployed kaapana-admin-chart — is the platform deployed?"
      when: client_secret.stdout | trim in ('', 'null')

    - name: Write client_secret to dotenv file
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/integration_test_setup.env"
        content: |
          CLIENT_SECRET={{ client_secret.stdout }}
      become: false
      delegate_to: localhost
