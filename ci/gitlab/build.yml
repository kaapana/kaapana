##############################################
# BUILD
##############################################
build_packages:
  stage: build
  dependencies: []
  tags:
    - build-runner
  environment:
    name: $REGISTRY_ENV
  variables:
    GIT_STRATEGY: clone
    PYTHON_VENV_DIR: ".venv-build"
    RUNNER_SCRIPT_TIMEOUT: 8h
  timeout: 8 hours
  rules:
    # Release tag: publish to kaapana/releases with the deploy-token credentials
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
      when: on_success
      variables:
        REGISTRY_URL: "registry.hzdr.de/kaapana/releases"
        REGISTRY_USER: $RELEASE_REGISTRY_USER
        REGISTRY_TOKEN: $RELEASE_REGISTRY_TOKEN
        REGISTRY_ENV: "HZDR_RELEASES_REGISTRY"
        CI_EXEC_DOCKER_PRUNE: "true"
    - if: '$CI_EXEC_BUILD == "true"'
      when: on_success
    - when: never
  before_script:
    - find $CI_BUILDS_DIR/ -maxdepth 1 -mtime +7 ! -name "$CI_COMMIT_SHORT_SHA" -exec rm -rf -- {} \;
    - python3 -m venv "$PYTHON_VENV_DIR"
    - source "$PYTHON_VENV_DIR/bin/activate"
    - pip install --upgrade pip && pip install -e build_cli/
    - |-
      if [[ $CI_PIPELINE_SOURCE == "merge_request_event" ]]; then
        git checkout -B $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME $CI_COMMIT_SHA
      elif [[ -n "$CI_COMMIT_TAG" ]]; then
        # Tag pipeline: no branch ref; stay detached, git describe resolves the tag
        git checkout $CI_COMMIT_SHA
      else
        git checkout -B $CI_COMMIT_BRANCH $CI_COMMIT_SHA
      fi
    - git status
    - git fetch --tags

  script:
    - |
      if [[ $CI_EXEC_DOCKER_PRUNE == "true" ]]; then
        docker system prune --all --volumes -f
        docker buildx prune --all -f
      fi

    # Scan/check modes should report findings, not abort the build
    - |
      if [[ "$CI_EXEC_BUILD_ARGUMENTS" =~ (-vs|--vulnerability-scan|-cc|--configuration-check) ]]; then
        export EXIT_ON_ERROR="false"
      fi

    # set +x hides the credentials from the job log
    - |
      set +x
      echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
      echo "$DOCKER_IO_PASSWORD" | docker login docker.io -u "$DOCKER_IO_USER" --password-stdin
      export REGISTRY_PW="$REGISTRY_TOKEN"

    # registry.hzdr.de is sometimes unreachable — pre-pull the collabora base image
    # from the internal mirror so the Dockerfile FROM resolves locally.
    - |
      if [[ "$REGISTRY_ENV" == "DKFZ_CONTAINER_REGISTRY" ]]; then
        docker pull registry.git.dkfz.de/mic/personal/group1/kaapana-fallback/collabora-code-patched:23.05.5.4.1
        docker tag  registry.git.dkfz.de/mic/personal/group1/kaapana-fallback/collabora-code-patched:23.05.5.4.1 \
                    registry.hzdr.de/kaapana/public/collabora-code-patched:23.05.5.4.1
      fi

    - kaapana-build --default-registry "$REGISTRY_URL" $CI_EXEC_BUILD_ARGUMENTS

  artifacts:
    name: "build_$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - "$CI_PROJECT_DIR/build/build.log"
      - "$CI_PROJECT_DIR/build/security-reports/"

security:
  stage: build
  needs:
    - job: build_packages
      artifacts: true
  tags:
    - build-runner
  variables:
    PYTHON_VENV_DIR: ".venv-build"
  before_script:
    - python3 -m venv "$PYTHON_VENV_DIR"
    - source "$PYTHON_VENV_DIR/bin/activate"
    - pip install jsonschema requests
  script:
    - CONSOLIDATED="$CI_PROJECT_DIR/security-reports/consolidated_vulnerability_report.json"
    - python3 "$CI_PROJECT_DIR/ci/ci-code/clean/create_vulnerability_report.py"
        "$CONSOLIDATED"
        "$CI_PROJECT_DIR/gl-container-scanning-report.json"
        --output json
    - python3 "$CI_PROJECT_DIR/ci/ci-code/clean/create_vulnerability_report.py"
        "$CONSOLIDATED"
        "$CI_PROJECT_DIR/vulnerability_report.html"
        --output html
    - echo "Access the report at https://kaapana.pages.hzdr.de/-/kaapana/-/jobs/${CI_JOB_ID}/artifacts/vulnerability_report.html"
  artifacts:
    paths:
      - "$CI_PROJECT_DIR/vulnerability_report.html"
    reports:
      container_scanning: "$CI_PROJECT_DIR/gl-container-scanning-report.json"
  allow_failure: true
  rules:
    - if: $CI_EXEC_BUILD == "true" && $CI_EXEC_BUILD_ARGUMENTS =~ /--vulnerability-scan/
      when: on_success
    - when: never
