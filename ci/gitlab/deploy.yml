##############################################
# DEPLOY
##############################################

.rules_deploy:
  rules:
    - if: '$CI_EXEC_DEPLOY == "true"'
      when: on_success
    - when: never

.rules_integration:
  rules:
    - if: '$CI_EXEC_INTEGRATION_TESTS == "true" && $CI_EXEC_DEPLOY == "true"'
      when: on_success
    - when: never

# dcmsend rejects peer hostnames (VM_NAME.DOMAIN) longer than 57 characters.
.truncate_vm_name:
  script:
    - DCMSEND_FQDN_LIMIT=57
    - MAX_VM_NAME_LENGTH=$(( DCMSEND_FQDN_LIMIT - ${#DEPLOYMENT_INSTANCE_DOMAIN} - 1 ))
    - DEPLOYMENT_INSTANCE_VM_NAME="${DEPLOYMENT_INSTANCE_VM_NAME:0:$MAX_VM_NAME_LENGTH}"
    - export DEPLOYMENT_INSTANCE_VM_NAME="$(echo "$DEPLOYMENT_INSTANCE_VM_NAME" | sed 's/-*$//')"
    - echo "Effective DEPLOYMENT_INSTANCE_VM_NAME='$DEPLOYMENT_INSTANCE_VM_NAME'"

.remote_execution_template:
  tags:
    - deploy-runner
  environment:
    name: $REGISTRY_ENV
  before_script:
    - export ARTIFACTS_DIR="$ARTIFACTS_DIR"
    - VENV_PATH=$(eval echo "$ORCHESTRATOR_INSTANCE_PYTHON_VENV")
    - source "$VENV_PATH/bin/activate"
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - mkdir -p $ARTIFACTS_DIR
    - git fetch --tags --unshallow 2>/dev/null || git fetch --tags
    - VERSION_TAG=$(git describe --tags --always --dirty)
    - |
      if [[ "$CI_EXEC_BUILD_ARGUMENTS" =~ (--latest) && "$VERSION_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        BASE_TAG=$(echo "$VERSION_TAG" | sed -E 's/-[0-9]+-g[0-9a-f]+.*//')
        VERSION_TAG="${BASE_TAG}-latest"
      fi
    - export VERSION_TAG

.run_playbook:
  script:
    - |
      ansible-playbook "$CI_PROJECT_DIR/$PLAYBOOK" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$ORCHESTRATOR_INSTANCE_PRIVATE_SSH_KEY"

##############################################

prepare_deployment:
  interruptible: false
  extends: .remote_execution_template
  rules: !reference [.rules_deploy, rules]
  stage: deploy
  variables:
    GIT_STRATEGY: "clone"
  script:
    - find $CI_BUILDS_DIR/ -maxdepth 1 -mtime +7 ! -name "$CI_COMMIT_SHORT_SHA" -exec rm -rf -- {} \;
    - !reference [.truncate_vm_name, script]
    - |
      if [[ "$CI_EXEC_DEPLOY" == "true" && -z "$DEPLOYMENT_INSTANCE_FQDN" ]]; then
        if [[ "$DEPLOYMENT_INSTANCE_PROVISIONER" == "openstack" ]]; then
          ansible-playbook -i localhost, "$CI_PROJECT_DIR/ci/ci-code/deploy/delete_openstack_vm.yaml"
          ansible-playbook -i localhost, "$CI_PROJECT_DIR/ci/ci-code/deploy/provision_openstack_vm.yaml"
        else
          ansible-playbook -i localhost, "$CI_PROJECT_DIR/ci/ci-code/deploy/delete_harvester_vm.yaml"
          ansible-playbook -i localhost, "$CI_PROJECT_DIR/ci/ci-code/deploy/provision_harvester_vm.yaml"
        fi
      else
        if [[ ${#DEPLOYMENT_INSTANCE_FQDN} -gt 57 ]]; then
          echo "ERROR: DEPLOYMENT_INSTANCE_FQDN '${DEPLOYMENT_INSTANCE_FQDN}' is ${#DEPLOYMENT_INSTANCE_FQDN} characters, exceeding the 57-character dcmsend peerhost limit."
          exit 1
        fi
        echo "Skipping VM provisioning and using existing deployment target: $DEPLOYMENT_INSTANCE_FQDN"
        mkdir -p artifacts
        echo "VM_FQDN=$DEPLOYMENT_INSTANCE_FQDN" > artifacts/deployment.env
        echo "VM_USER=$DEPLOYMENT_INSTANCE_USER" >> artifacts/deployment.env
      fi

  artifacts:
    when: always
    paths:
      - artifacts/deployment.env
    reports:
      dotenv: artifacts/deployment.env

##############################################

server_installation:
  extends: .remote_execution_template
  stage: deploy
  rules: !reference [.rules_deploy, rules]
  needs:
    - job: prepare_deployment
      artifacts: true
  variables:
    PLAYBOOK: "ci/ci-code/deploy/server_installation.yaml"
  script:
    - !reference [.run_playbook, script]
  artifacts:
    paths:
      - "artifacts/server_installation.log"
    when: always
    access: developer

##############################################

platform_deployment:
  extends: .remote_execution_template
  stage: deploy
  rules: !reference [.rules_deploy, rules]
  needs:
    - server_installation
    - job: prepare_deployment
      artifacts: true
  variables:
    PLAYBOOK: "ci/ci-code/deploy/deploy_platform.yaml"
  script:
    - |
      if [ -z "$VM_FQDN" ]; then
        echo "ERROR: VM_FQDN is empty. No deployment target."
        exit 1
      fi
    - !reference [.run_playbook, script]
    - echo "Kaapana Platform Deployed Successfully"
    - echo "Access the platform at https://$VM_FQDN"
    - |
      echo "<html>
      <body>
      <h1>Kaapana Platform Deployed</h1>
      <p>Access it here: <a href=\"https://$VM_FQDN\">https://$VM_FQDN</a></p>
      </body>
      </html>" > artifacts/deployment.html
  artifacts:
    paths:
      - "artifacts/deployment.log"
      - "artifacts/system_check.log"
      - "artifacts/deployment.html"
    when: always
    expose_as: "Kaapana Deployment Report"
