##############################################
# TESTS AND DOCS
##############################################
.test_template:
  stage: tests
  tags:
    - tests-runner
  rules:
    - if: '$CI_EXEC_UNIT_TESTS == "true"'
      when: always
    - when: never
  variables:
    KAAPANA_DIR: "$GIT_CLONE_PATH"
    # Jobs run in parallel on the same machine, so each needs its own clone path
    GIT_CLONE_PATH: "$CI_BUILDS_DIR/$CI_COMMIT_SHORT_SHA/$CI_JOB_NAME_SLUG-$CI_JOB_ID"
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  before_script:
    - find $CI_BUILDS_DIR/ -maxdepth 1 -mtime +7 ! -name "$CI_COMMIT_SHORT_SHA" -exec rm -rf -- {} \;
    - PYTHON_VENV_DIR=~/.venvs/$CI_JOB_NAME_SLUG
    - python3 -m venv "$PYTHON_VENV_DIR"
    - source "$PYTHON_VENV_DIR/bin/activate"

##############################################
# Unit Tests
##############################################
platform_tests:
  extends: .test_template
  script:
    - pip install -r $KAAPANA_DIR/tests/requirements.txt
    - pytest $KAAPANA_DIR/tests/ --junitxml=platform_report.xml
  artifacts:
    when: always
    reports:
      junit:
        - platform_report.xml

task_api_tests:
  extends: .test_template
  script:
    - pip install $KAAPANA_DIR/lib/task_api
    - pip install --force-reinstall $KAAPANA_DIR/lib/kaapana_containers
    - pip install pytest
    - pytest $KAAPANA_DIR/lib/task_api/task_api --junitxml=task_api_report.xml
  artifacts:
    when: always
    reports:
      junit:
        - task_api_report.xml

kaapana_extensions_tests:
  extends: .test_template
  script:
    - pip install -e "$KAAPANA_DIR/lib/kaapana_containers[test]"
    - pip install -e "$KAAPANA_DIR/lib/kaapana_extensions[test]"
    - pytest -n auto --asyncio-mode=auto $KAAPANA_DIR/lib/kaapana_containers/tests/ $KAAPANA_DIR/lib/kaapana_extensions/tests/ --junitxml=kaapana_extensions_report.xml
  artifacts:
    when: always
    reports:
      junit:
        - kaapana_extensions_report.xml

workflow_api_tests:
  extends: .test_template
  script:
    - pip install -r $KAAPANA_DIR/services/base/workflow-api/docker/files/tests/unit/requirements.txt
    - pytest $KAAPANA_DIR/services/base/workflow-api/docker/files/tests/unit --junitxml=workflow_api_report.xml
  artifacts:
    when: always
    reports:
      junit:
        - workflow_api_report.xml

extensions_api_tests:
  extends: .test_template
  script:
    - pip install -e "$KAAPANA_DIR/lib/kaapana_containers"
    - pip install -e "$KAAPANA_DIR/lib/kaapana_extensions"
    - pip install -r $KAAPANA_DIR/services/base/extension-manager-service/docker/files/app/tests/requirements.txt
    - pytest $KAAPANA_DIR/services/base/extension-manager-service/docker/files/app --junitxml=extensions_api_report.xml
  artifacts:
    when: always
    reports:
      junit:
        - extensions_api_report.xml

kaapana_backend_tests:
  extends: .test_template
