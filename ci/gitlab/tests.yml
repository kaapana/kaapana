##############################################
# Rego Policy Tests (OPA authorization policies)
##############################################
rego_policy_tests:
  extends: .test_template
  variables:
    OPA_VERSION: "0.70.0"
    AUTH_BACKEND_DIR: "$KAAPANA_DIR/services/kaapana-admin/auth-backend/auth-backend-chart"
  script:
    - export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY"
    - curl -f -S -L -o opa "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
    - chmod +x opa
    - ./opa version
    - ./opa test -b "$AUTH_BACKEND_DIR/files" -f json > opa_test_results.json && OPA_EXIT=0 || OPA_EXIT=$?
    - python3 "$AUTH_BACKEND_DIR/files/test/rego_to_junit.py" opa_test_results.json rego_test_report.xml
    - exit $OPA_EXIT
  artifacts:
    when: always
    reports:
      junit:
        - rego_test_report.xml

##############################################
# Documentation Build
##############################################
build_documentation:
  extends: .test_template
  script:
    - cd $KAAPANA_DIR/docs
    - pip install -r requirements.txt
    - make html 2>&1 | tee "build_documentation_html.log"
    - |
      if [[ $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop" ]]; then
        cd $KAAPANA_DIR/ci/ci-code/build
        bash check_readthedocs.sh
      fi
  artifacts:
    expose_as: "Documentation"
    paths:
      - $KAAPANA_DIR/docs/build/html/
      - "$KAAPANA_DIR/docs/build_documentation_html.log"
