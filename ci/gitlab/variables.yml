variables:
  # Execution control flags
  CI_EXEC_BUILD: $CI_EXEC_BUILD
  CI_EXEC_BUILD_ARGUMENTS: $CI_EXEC_BUILD_ARGUMENTS
  CI_EXEC_DEPLOY: $CI_EXEC_DEPLOY
  CI_EXEC_DESTROY_ON_SUCCESS: $CI_EXEC_DESTROY_ON_SUCCESS
  CI_EXEC_DESTROY_DELAYED: $CI_EXEC_DESTROY_DELAYED
  CI_EXEC_DOCKER_PRUNE: $CI_EXEC_DOCKER_PRUNE
  CI_EXEC_INTEGRATION_TESTS: $CI_EXEC_INTEGRATION_TESTS
  CI_EXEC_PLAYWRIGHT_TEST: $CI_EXEC_PLAYWRIGHT_TEST
  CI_EXEC_UNIT_TESTS: $CI_EXEC_UNIT_TESTS

  # Deployment instance configuration
  DEPLOYMENT_INSTANCE_FQDN: $DEPLOYMENT_INSTANCE_FQDN
  DEPLOYMENT_INSTANCE_PLATFORM_PREFIX: $DEPLOYMENT_INSTANCE_PLATFORM_PREFIX
  DEPLOYMENT_INSTANCE_DOMAIN: $DEPLOYMENT_INSTANCE_DOMAIN
  DEPLOYMENT_INSTANCE_USER: $DEPLOYMENT_INSTANCE_USER
  DEPLOYMENT_INSTANCE_SSH_PORT: $DEPLOYMENT_INSTANCE_SSH_PORT
  DEPLOYMENT_INSTANCE_MEMORY: $DEPLOYMENT_INSTANCE_MEMORY
  DEPLOYMENT_INSTANCE_CPU: $DEPLOYMENT_INSTANCE_CPU
  DEPLOYMENT_INSTANCE_DISK: $DEPLOYMENT_INSTANCE_DISK
  DEPLOYMENT_INSTANCE_HARVESTER_NAMESPACE: $DEPLOYMENT_INSTANCE_HARVESTER_NAMESPACE
  DEPLOYMENT_INSTANCE_IMAGE_ID: $DEPLOYMENT_INSTANCE_IMAGE_ID
  DEPLOYMENT_INSTANCE_NETWORK: $DEPLOYMENT_INSTANCE_NETWORK
  DEPLOYMENT_INSTANCE_PROVISIONER: $DEPLOYMENT_INSTANCE_PROVISIONER
  DEPLOYMENT_INSTANCE_STORAGE_CLASS: $DEPLOYMENT_INSTANCE_STORAGE_CLASS

  # Generated
  DEPLOYMENT_INSTANCE_VM_NAME: "ci-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"

  # Registry and container credentials
  REGISTRY_TOKEN: $REGISTRY_TOKEN
  REGISTRY_URL: $REGISTRY_URL
  REGISTRY_USER: $GITLAB_USER_LOGIN
  DOCKER_IO_USER: $DOCKER_IO_USER
  DOCKER_IO_PASSWORD: $DOCKER_IO_PASSWORD

  # Notification settings
  SLACK_BOT_TOKEN: $SLACK_BOT_TOKEN
  SLACK_CHANNEL_ID: $SLACK_CHANNEL_ID

  # Network and SSH configuration
  HTTP_PROXY: $HTTP_PROXY
  HTTPS_PROXY: $HTTPS_PROXY
  SSH_FILE: $SSH_FILE

  # Orchestrator instance configuration
  ORCHESTRATOR_INSTANCE_HARVESTER_KUBECONFIG: $ORCHESTRATOR_INSTANCE_HARVESTER_KUBECONFIG
  ORCHESTRATOR_INSTANCE_PRIVATE_SSH_KEY: $ORCHESTRATOR_INSTANCE_PRIVATE_SSH_KEY
  ORCHESTRATOR_INSTANCE_PUBLIC_SSH_KEY: $ORCHESTRATOR_INSTANCE_PUBLIC_SSH_KEY
  ORCHESTRATOR_INSTANCE_PYTHON_VENV: $ORCHESTRATOR_INSTANCE_PYTHON_VENV

  # Documentation
  KAAPANA_READTHEDOCS_TOKEN: $KAAPANA_READTHEDOCS_TOKEN

  # Fixed settings
  ANSIBLE_VERBOSITY: 0
  GIT_STRATEGY: "none" # No checkout by default; jobs that need the repo override this
  GIT_CLONE_PATH: "$CI_BUILDS_DIR/$CI_COMMIT_SHORT_SHA"
  ARTIFACTS_DIR: "$CI_PROJECT_DIR/artifacts"
