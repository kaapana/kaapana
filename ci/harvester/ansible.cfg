# Picked up automatically when ansible-playbook runs from this directory, which
# is also what makes `inventory` and the relative playbook paths below resolve.
[defaults]
inventory = inventory.yaml
# The fleet is recreated under stable DNS names, so a cached host key is stale
# after every FORCE_RECREATE and would block an otherwise unattended run.
host_key_checking = False
# Full task names rather than the host-count summary.
display_skipped_hosts = False
stdout_callback = default

[ssh_connection]
# The VMs accept the fleet key only; never fall back to an agent or a password.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
pipelining = True
