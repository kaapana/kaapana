---
- name: Validate required variables
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', item) | default('', true) | length > 0
        fail_msg: "Required variable {{ item }} is missing. Set it as environment variable."
      loop: "{{ required_env_vars }}"
      run_once: true

- name: Create Deploy VMs on Harvester
  hosts: deploy_instances
  gather_facts: false
  connection: local

  vars:
    vm_domain: vms.dkfz.de
    vm_type: "DEPLOY"

  tasks:
    - name: Include VM creation tasks
      import_tasks: tasks/create-vm.yaml

    - name: Collect VM information for registration
      ansible.builtin.set_fact:
        vm_info:
          inventory_hostname: "{{ inventory_hostname }}"
          vm_fqdn: "{{ vm_fqdn }}"
          vm_name: "{{ vm_name }}"

    - name: Add current host to provisioned_vms group
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        ansible_host: "{{ vm_fqdn }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ ssh_private_key }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        groups: "provisioned_vms"

- name: Configure Deploy VMs
  hosts: provisioned_vms
  gather_facts: false
  remote_user: ubuntu
  become: yes

  tasks:
    - name: Include base VM configuration
      import_tasks: tasks/configure-vm-base.yaml

    - name: Install kubectl
      ansible.builtin.include_tasks: target/install-kubectl.yaml
      when: kubectl_check.rc != 0
      vars:
        kubectl_check:
          rc: 1  # Always install kubectl for deploy runners

    - name: Install Helm
      ansible.builtin.include_tasks: target/install-helm.yaml
      when: helm_check.rc != 0
      vars:
        helm_check:
          rc: 1  # Always install Helm for deploy runners

    - name: Copy SSH keys
      block:
        - name: Copy PRIVATE SSH key
          ansible.builtin.copy:
            src: "{{ ssh_private_key }}"
            dest: "/home/{{ ansible_user }}/.ssh/kaapana.pem"
            owner: "{{ ansible_ssh_user }}"
            group: "{{ ansible_ssh_user }}"
            mode: "0600"

        - name: Copy PUBLIC SSH key
          ansible.builtin.copy:
            src: "{{ ssh_public_key }}"
            dest: "/home/{{ ansible_user }}/.ssh/kaapana-pub.pem"
            owner: "{{ ansible_ssh_user }}"
            group: "{{ ansible_ssh_user }}"
            mode: "0644"

    - name: Copy Harvester kubeconfig
      ansible.builtin.copy:
        src: "{{ harvester_kubeconfig }}"
        dest: "/home/{{ ansible_user }}/harvester.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        backup: yes
      become: no

    - name: Configure GitLab Runner (Deploy)
      include_tasks: target/configure-gitlab-runner.yaml
      vars:
        runner_description: "deploy-runner-{{ vm_name }}"
        runner_tags: ["deploy-runner"]
        runner_limit: 4
        runner_concurrency: 4
        runner_global_concurrency: 4

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "DEPLOY instance setup complete!"
          - "Instance: {{ inventory_hostname }} ({{ ansible_host }})"
          - "Runner: deploy-runner-{{ vm_name }}"
          - "=========================================="
