---
# ============================================================================
# Provision and Configure Kaapana Deploy VMs on Harvester
# ============================================================================
#
# Usage:
#   export GITLAB_API_TOKEN=...
#   export GITLAB_PROJECT_ID=...
#   export GITLAB_URL=...
#   export GITLAB_RUNNER_REGISTRATION_TOKEN=...
#   export SSH_PUBLIC_KEY=~/.ssh/kaapana.pub
#   export SSH_PRIVATE_KEY=~/.ssh/kaapana.pem
#   export HARVESTER_KUBECONFIG=~/.kube/harvester.yaml
#
#   ansible-playbook create-deploy-runner-instances.yaml -i inventory.yaml
#   ansible-playbook create-deploy-runner-instances.yaml -i inventory.yaml -e force_recreate=true
#
# ============================================================================

- name: Provision Deploy VMs on Harvester
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', item) | default('', true) | length > 0
        fail_msg: "Required variable {{ item }} is missing. Set it as environment variable."
      loop:
        - GITLAB_API_TOKEN
        - GITLAB_PROJECT_ID
        - GITLAB_URL
        - SSH_PUBLIC_KEY
        - SSH_PRIVATE_KEY
        - HARVESTER_KUBECONFIG
      run_once: true

    - name: Provision Deploy VMs using provision_harvester_vm.yaml
      ansible.builtin.include_tasks:
        file: ../../ci-code/deploy/provision_harvester_vm.yaml
        apply:
          hosts: deploy_instances
        environment:
          DEPLOYMENT_INSTANCE_VM_NAME: "{{ hostvars[inventory_hostname].vm_name }}"
          DEPLOYMENT_INSTANCE_IMAGE_ID: "Ubuntu-22.04"
          DEPLOYMENT_INSTANCE_STORAGE_CLASS: "longhorn"
          DEPLOYMENT_INSTANCE_NETWORK: "kaapana-ci-network"
          DEPLOYMENT_INSTANCE_SSH_KEYPAIR: "kaapana"
          DEPLOYMENT_INSTANCE_OS_USER: "ubuntu"
          DEPLOYMENT_INSTANCE_DOMAIN: "vms.dkfz.de"
          DEPLOYMENT_INSTANCE_CPU: "{{ hostvars[inventory_hostname].cpu_cores | default(8) }}"
          DEPLOYMENT_INSTANCE_MEMORY: "{{ hostvars[inventory_hostname].memory_guest | default('16Gi') }}"
          DEPLOYMENT_INSTANCE_DISK: "{{ hostvars[inventory_hostname].disk_size | default('128Gi') }}"
          DEPLOYMENT_INSTANCE_HARVESTER_NAMESPACE: "{{ harvester_namespace }}"
          ORCHESTRATOR_INSTANCE_HARVESTER_KUBECONFIG: "{{ harvester_kubeconfig }}"
          ORCHESTRATOR_INSTANCE_PRIVATE_SSH_KEY: "{{ ssh_private_key }}"
          ARTIFACTS_DIR: "."
      vars:
        force_recreate: "{{ force_recreate | default(false) | bool }}"
      run_once: true

    - name: Add provisioned VMs to group
      ansible.builtin.add_host:
        name: "{{ hostvars[item].vm_name }}"
        ansible_host: "{{ hostvars[item].vm_fqdn }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ ssh_private_key }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        groups: "provisioned_deploy_vms"
      loop: "{{ groups['deploy_instances'] }}"
      run_once: true

- name: Configure Deploy VMs
  hosts: provisioned_deploy_vms
  gather_facts: false
  remote_user: ubuntu
  become: yes

  tasks:
    - name: Include base VM configuration
      import_tasks: tasks/configure-vm-base.yaml

    - name: Install kubectl
      ansible.builtin.include_tasks: target/install-kubectl.yaml
      when: kubectl_check.rc != 0
      vars:
        kubectl_check:
          rc: 1  # Always install kubectl for deploy runners

    - name: Install Helm
      ansible.builtin.include_tasks: target/install-helm.yaml
      when: helm_check.rc != 0
      vars:
        helm_check:
          rc: 1  # Always install Helm for deploy runners

    - name: Copy SSH keys
      block:
        - name: Copy PRIVATE SSH key
          ansible.builtin.copy:
            src: "{{ ssh_private_key }}"
            dest: "/home/{{ ansible_user }}/.ssh/kaapana.pem"
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            mode: "0600"

        - name: Copy PUBLIC SSH key
          ansible.builtin.copy:
            src: "{{ ssh_public_key }}"
            dest: "/home/{{ ansible_user }}/.ssh/kaapana-pub.pem"
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            mode: "0644"

    - name: Copy Harvester kubeconfig
      ansible.builtin.copy:
        src: "{{ harvester_kubeconfig }}"
        dest: "/home/{{ ansible_user }}/harvester.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        backup: yes
      become: no

    - name: Configure GitLab Runner (Deploy)
      include_tasks: target/configure-gitlab-runner.yaml
      vars:
        runner_description: "deploy-runner-{{ vm_name }}"
        runner_tags: ["deploy-runner"]
        runner_limit: 4
        runner_concurrency: 4
        runner_global_concurrency: 4

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "DEPLOY instance setup complete!"
          - "Instance: {{ inventory_hostname }} ({{ ansible_host }})"
          - "Runner: deploy-runner-{{ vm_name }}"
          - "=========================================="
