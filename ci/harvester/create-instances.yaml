---
# Validate required variables are set
- name: Validate required variables
  hosts: localhost
  gather_facts: false
  connection: local
  
  vars:
    mandatory_vars:
      - gitlab_api_token
      - gitlab_project_id
      - gitlab_url
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  
  pre_tasks:
    - name: Validate mandatory variables are defined and non-empty
      ansible.builtin.assert:
        that:
          - lookup('vars', item) is defined
          - lookup('vars', item) | string | length > 0
        fail_msg: "Mandatory variable '{{ item }}' is missing or empty"
      loop: "{{ mandatory_vars }}"

  tasks:
    - name: Upload CI variables to GitLab (if enabled)
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ playbook_dir }}/control/{{ ci_upload_script }}"
          - "--api-token"
          - "{{ gitlab_api_token }}"
          - "--project-id"
          - "{{ gitlab_project_id }}"
          - "--gitlab-host"
          - "{{ gitlab_url }}"
          - "--ci-vars-json"
          - "{{ ci_variables | to_json }}"
      args:
        chdir: "{{ playbook_dir }}"
      
- name: Create VMs on Harvester
  hosts: build_instances:deploy_instances
  gather_facts: false
  connection: local
  
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  
  tasks:
    - name: Check if VM already exists
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ harvester_kubeconfig }} -n {{ harvester_namespace }} get vm {{ vm_name }}
      register: vm_check
      failed_when: false
      changed_when: false
      
    - name: Delete and recreate VM if force_recreate is true
      when: force_recreate | default(false) | bool
      block:
        - name: Delete the VM
          when: vm_check.rc == 0
          ansible.builtin.command:
            cmd: kubectl --kubeconfig {{ harvester_kubeconfig }} -n {{ harvester_namespace }} delete vm {{ vm_name }}

        - name: Delete PVCs belonging to the VM (if present)
          when: vm_check.rc == 0
          ansible.builtin.shell: |
            set -e
            PVCs=$(kubectl --kubeconfig {{ harvester_kubeconfig }} -n {{ harvester_namespace }} get pvc -o name | grep "{{ vm_name }}" || true)
            if [ -n "$PVCs" ]; then
              kubectl --kubeconfig {{ harvester_kubeconfig }} -n {{ harvester_namespace }} delete $PVCs
            fi
          args:
            executable: /bin/bash

        - name: Delete secrets and configmaps related to cloud-init or VM (best-effort)
          when: vm_check.rc == 0
          ansible.builtin.shell: |
            set -e
            # Delete secrets that include the vm name
            SECRETS=$(kubectl --kubeconfig {{ harvester_kubeconfig }} -n {{ harvester_namespace }} get secret -o name {{ vm_name }}-cloudinit || true)
            if [ -n "$SECRETS" ]; then
              kubectl --kubeconfig {{ harvester_kubeconfig }} -n {{ harvester_namespace }} delete $SECRETS
            fi
          args:
            executable: /bin/bash

        - name: Wait for VM to be fully deleted
          when: vm_check.rc == 0
          ansible.builtin.command:
            cmd: kubectl --kubeconfig {{ harvester_kubeconfig }} -n {{ harvester_namespace }} get vm {{ vm_name }}
          register: delete_check
          until: delete_check.rc != 0
          retries: 60
          delay: 10
          failed_when: false
          changed_when: false

    - name: Create VM
      when: force_recreate | default(false) | bool or vm_check.rc != 0
      block:
        - name: Debug SSH public key path
          ansible.builtin.debug:
            msg: "SSH public key path: '{{ ssh_public_key }}' (from env: '{{ lookup('env', 'SSH_PUBLIC_KEY') }}')"

        - name: Read SSH public key content
          ansible.builtin.slurp:
            src: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"
          register: public_key_content

        - name: Create Helm values file for VM
          ansible.builtin.copy:
            content: |
              global:
                vmName: {{ vm_name }}
                namespace: {{ harvester_namespace }}
                cpuCores: {{ cpu_cores }}
                memoryGuest: {{ memory_guest }}
                diskSize: {{ disk_size }}
                publicKey: "{{ public_key_content['content'] | b64decode | trim }}"
            dest: "/tmp/{{ vm_name }}-values.yaml"

        - name: Render Helm chart to YAML
          ansible.builtin.command:
            cmd: >
              helm template {{ vm_name }}
              ./vm-templates/ubuntu24
              --namespace {{ harvester_namespace }}
              --values /tmp/{{ vm_name }}-values.yaml
          register: helm_output

        - name: Save rendered YAML
          ansible.builtin.copy:
            content: "{{ helm_output.stdout }}"
            dest: "/tmp/{{ vm_name }}-rendered.yaml"

        - name: Apply rendered YAML to Harvester
          ansible.builtin.command:
            cmd: kubectl --kubeconfig {{ harvester_kubeconfig }} apply -f /tmp/{{ vm_name }}-rendered.yaml

    - name: Get VM IP address
      vars:
        get_ip_cmd: "kubectl --kubeconfig {{ harvester_kubeconfig }} -n {{ harvester_namespace }} get vmi {{ vm_name }} -o jsonpath='{.status.interfaces[0].ipAddress}'"
      register: ip_result
      until: ip_result.stdout is defined and ip_result.stdout != ''
      retries: 60
      delay: 10
      ansible.builtin.command:
        cmd: "{{ get_ip_cmd }}"

    - name: Set VM IP address fact
      ansible.builtin.set_fact:
        vm_ip: "{{ ip_result.stdout }}"

    - name: Wait for SSH to become available
      ansible.builtin.wait_for:
        host: "{{ vm_ip }}"
        port: 22
        timeout: 300
        delay: 10

    - name: Display VM info
      ansible.builtin.debug:
        msg: "{{ instance_type | upper }} instance {{ vm_name }} is running at {{ vm_ip }}"

- name: Configure VMs
  hosts: build_instances:deploy_instances
  gather_facts: true
  remote_user: "{{ ssh_user }}"
  become: no
  
  vars:
    ansible_ssh_private_key_file: "{{ ssh_private_key }}"
    ansible_ssh_host: "{{ vm_ip }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    ansible_python_interpreter: auto_silent
  
  tasks:
    - name: Upgrade system
      apt:
        update_cache: yes
        upgrade: yes
      become: yes

    - name: Install required system packages
      become: yes
      ansible.builtin.apt:
        state: latest
        pkg: "{{ system_packages }}"

    - name: Check if Docker is installed 
      ansible.builtin.command:
        cmd: which docker
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Install Docker
      # build needs docker for building, deploy for some tests (docker compose up)
      when: docker_check.rc != 0
      import_tasks: target/install-docker.yaml

    - name: Check if Helm is installed
      when: instance_type == "build"
      ansible.builtin.command:
        cmd: which helm
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Install Helm
      when: instance_type == "build" and helm_check.rc != 0
      import_tasks: target/install-helm.yaml

    - name: Copy requirements.txt to VM
      ansible.builtin.copy:
        src: target/requirements.txt
        dest: "{{ ansible_facts.env.HOME }}/requirements.txt"
        mode: '0644'

    - name: Install Python requirements in venv
      pip:
        requirements: "{{ ansible_facts.env.HOME }}/requirements.txt"
        virtualenv: "{{ venv_path }}"
        virtualenv_python: python3.12

    - name: Switch to using remote venv Python for remaining tasks
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ venv_path }}/bin/python3"

    - name: Add user path
      become: yes
      ansible.builtin.copy:
        dest: /etc/profile.d/custom-path.sh
        content: "PATH=$PATH:{{ ansible_facts.env.HOME }}/.local/bin:/usr/bin:/bin:/snap/bin:/usr/local/bin"

    - name: Copy CI SSH key
      ansible.builtin.copy:
        src: "{{ ssh_private_key }}"
        dest: "{{ ansible_facts.env.HOME }}/.ssh/kaapana.pem"
        owner: "{{ ansible_ssh_user }}"
        group: "{{ ansible_ssh_user }}"
        mode: '0600'

    - name: Configure GitLab runners
      include_tasks: target/configure-gitlab-runners.yaml

    - name: Display completion message
      ansible.builtin.debug:
        msg: 
          - "=========================================="
          - "{{ instance_type | upper }} instance setup complete!"
          - "Instance: {{ vm_name }} ({{ vm_ip }})"
          - "Runners: shared-{{ vm_name }}, dedicated-{{ vm_name }}"
          - "=========================================="
