---
# ============================================================================
# Provision and Configure Kaapana Tests VMs on Harvester
# ============================================================================
#
# Usage:
#   export GITLAB_API_TOKEN=...
#   export GITLAB_PROJECT_ID=...
#   export GITLAB_URL=...
#   export GITLAB_RUNNER_REGISTRATION_TOKEN=...
#   export SSH_PUBLIC_KEY=~/.ssh/kaapana.pub
#   export SSH_PRIVATE_KEY=~/.ssh/kaapana.pem
#   export HARVESTER_KUBECONFIG=~/.kube/harvester.yaml
#
#   ansible-playbook create-tests-runner-instances.yaml -i inventory.yaml
#   ansible-playbook create-tests-runner-instances.yaml -i inventory.yaml -e force_recreate=true
#
# ============================================================================

- name: Provision Tests VMs on Harvester
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', item) | default('', true) | length > 0
        fail_msg: "Required variable {{ item }} is missing. Set it as environment variable."
      loop:
        - GITLAB_API_TOKEN
        - GITLAB_PROJECT_ID
        - GITLAB_URL
        - SSH_PUBLIC_KEY
        - SSH_PRIVATE_KEY
        - HARVESTER_KUBECONFIG
      run_once: true

    - name: Provision Tests VMs using provision_harvester_vm.yaml
      ansible.builtin.include_tasks: ../../ci-code/deploy/provision_harvester_vm.yaml
      run_once: true

    - name: Add provisioned VMs to group
      ansible.builtin.add_host:
        name: "{{ hostvars[item].vm_name }}"
        ansible_host: "{{ hostvars[item].vm_fqdn }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ ssh_private_key }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        groups: "provisioned_tests_vms"
      loop: "{{ groups['tests_instances'] }}"
      run_once: true

- name: Configure Tests VMs
  hosts: provisioned_tests_vms
  gather_facts: false
  remote_user: ubuntu
  become: yes

  tasks:
    - name: Include base VM configuration
      import_tasks: tasks/configure-vm-base.yaml

    - name: Install Docker
      ansible.builtin.include_tasks: target/install-docker.yaml
      when: docker_check.rc != 0
      vars:
        docker_check:
          rc: 1  # Always install Docker for tests runners

    - name: Install Helm
      ansible.builtin.include_tasks: target/install-helm.yaml
      when: helm_check.rc != 0
      vars:
        helm_check:
          rc: 1  # Always install Helm for tests runners

    - name: Configure GitLab Runner (Tests)
      include_tasks: target/configure-gitlab-runner.yaml
      vars:
        runner_description: "tests-runner-{{ vm_name }}"
        runner_tags: ["tests-runner"]
        runner_limit: 4
        runner_concurrency: 4
        runner_global_concurrency: 4

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "TESTS instance setup complete!"
          - "Instance: {{ inventory_hostname }} ({{ ansible_host }})"
          - "Runner: tests-runner-{{ vm_name }}"
          - "=========================================="
