all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars:
    ci_env_file: "{{ inventory_dir }}/.env"
    ci_env_from_file: >-
      {{
        dict(
          lookup('file', ci_env_file, errors='ignore').splitlines()
          | map('trim')
          | reject('match', '^(#|$)')
          | map('regex_replace', '^(?:export[ \t]+)?([A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*(.*)$', '\1=\2')
          | map('regex_replace', '=[\x22\x27](.*)[\x22\x27]$', '=\1')
          | map('split', '=', 1)
        )
      }}
    ci_env: "{{ ci_env_from_file }}"

    harvester_namespace: "{{ lookup('env', 'HARVESTER_NAMESPACE') | default(ci_env.HARVESTER_NAMESPACE | default(''), true) }}"
    vm_dns_domain: "{{ lookup('env', 'VM_DNS_DOMAIN') | default(ci_env.VM_DNS_DOMAIN | default(''), true) }}"
    vm_user: "{{ lookup('env', 'VM_USER') | default(ci_env.VM_USER | default(''), true) }}"
    venv_path: "/home/{{ vm_user }}/venv"

    gitlab_api_token: "{{ lookup('env', 'GITLAB_API_TOKEN') | default(ci_env.GITLAB_API_TOKEN | default(''), true) }}"
    gitlab_project_id: "{{ lookup('env', 'GITLAB_PROJECT_ID') | default(ci_env.GITLAB_PROJECT_ID | default(''), true) }}"
    gitlab_url: "{{ lookup('env', 'GITLAB_URL') | default(ci_env.GITLAB_URL | default(''), true) }}"
    ssh_private_key: "{{ (lookup('env', 'SSH_PRIVATE_KEY') | default(ci_env.SSH_PRIVATE_KEY | default(''), true)) | expanduser }}"
    harvester_kubeconfig: "{{ (lookup('env', 'HARVESTER_KUBECONFIG') | default(ci_env.HARVESTER_KUBECONFIG | default(''), true)) | expanduser }}"
    ansible_ssh_private_key_file: "{{ ssh_private_key }}"

    # Lets a new VM be inspected before it takes jobs from the live fleet.
    runners_paused: "{{ lookup('env', 'RUNNERS_PAUSED') | default('false', true) | bool }}"

    # One metrics server per gitlab-runner process, not per runner entry
    runner_metrics_port: 9252

    runner_defaults:
      executor: docker
      limit: 1
      request_concurrency: 1
      docker_image: "registry.hzdr.de/kaapana/ci-base:latest"
      maximum_timeout: 7200 # 2 hours
      docker_volumes: ["/cache"]
      docker_services_privileged: false
      docker_allowed_privileged_services: []

    runner_roles:
      build:
        tags: ["build"]
        maximum_timeout: 14400 # 4 hours
        limit: 2
        request_concurrency: 2
        docker_volumes: ["/cache", "/builds"]
        docker_services_privileged: true
        docker_allowed_privileged_services: ["docker.io/library/docker:*"]

      security:
        tags: ["security"]
        maximum_timeout: 14400 # 4 hours
        docker_volumes: ["/cache", "/builds"]
        docker_services_privileged: true
        docker_allowed_privileged_services: ["docker.io/library/docker:*"]

      tests:
        tags: ["tests"]
        # preflight, lint and unit-tests all carry this tag: ~35 jobs per
        # pipeline, each under a 5m timeout, so the queue and not the job is
        # what the stage waits on.
        limit: 8
        request_concurrency: 8
        docker_volumes: ["/cache", "/builds"]
        docker_services_privileged: true
        docker_allowed_privileged_services: ["docker.io/library/docker:*"]

      deploy:
        tags: ["deploy"]
        # Integration tests run on this tag and each job holds a deployment VM.
        limit: 2
        request_concurrency: 2
        # --test-data-cache-dir /data in integration-tests.yml; without the
        # mount every job re-downloads the test data.
        docker_volumes: ["/cache", "/data:/data"]

      universal:
        tags:
          [
            "universal",
            "build",
            "tests",            
            "deploy",
            "security",
          ]
        maximum_timeout: 14400 # 4 hours
        limit: 8
        request_concurrency: 8
        docker_volumes: ["/cache", "/builds", "/data:/data"]
        docker_services_privileged: true
        docker_allowed_privileged_services: ["docker.io/library/docker:*"]

  children:
    ci_instances:
      hosts:
        kaapana-ci-01:
          vm_name: kaapana-ci-01
          cpu_cores: 64
          memory_guest: "128Gi"
          disk_size: "256Gi"
          runners: [universal]
        
        kaapana-ci-02:
          vm_name: kaapana-ci-02
          cpu_cores: 64
          memory_guest: "128Gi"
          disk_size: "256Gi"
          runners: [universal]
        
        kaapana-ci-03:
          vm_name: kaapana-ci-03
          cpu_cores: 64
          memory_guest: "128Gi"
          disk_size: "256Gi"
          runners: [universal]
