all:
  vars:
    # -----------------------------------------
    # 🔹 CONSTANTS
    # -----------------------------------------
    harvester_namespace: "kaapana-ci"
    venv_path: "/home/ubuntu/venv"
    ansible_python_interpreter: "auto_silent"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    
    # -----------------------------------------
    # 🔹 REQUIRED ENVIRONMENT VARIABLES
    # -----------------------------------------
    gitlab_api_token: "{{ lookup('env', 'GITLAB_API_TOKEN') }}"
    gitlab_project_id: "{{ lookup('env', 'GITLAB_PROJECT_ID') }}"
    gitlab_url: "{{ lookup('env', 'GITLAB_URL') }}"
    harvester_kubeconfig: "{{ lookup('env', 'HARVESTER_KUBECONFIG') }}"
    ssh_public_key: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"
    ssh_private_key: "{{ lookup('env', 'SSH_PRIVATE_KEY') }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_PRIVATE_KEY') }}"
    
    # -----------------------------------------
    # 🔹 ENV VARIABLE VALIDATION LIST
    # -----------------------------------------
    required_env_vars:
      - GITLAB_API_TOKEN
      - GITLAB_PROJECT_ID
      - GITLAB_URL
      - SSH_PUBLIC_KEY
      - SSH_PRIVATE_KEY
      - HARVESTER_KUBECONFIG
  
  children:
    tests_instances:
      hosts:
        tests-01:
          vm_name: kaapana-tests-01
          cpu_cores: 8
          memory_guest: "16Gi"
          disk_size: "128Gi"

    build_instances:
      hosts:
        build-01:
          vm_name: kaapana-build-01
          cpu_cores: 32
          memory_guest: "256Gi"
          disk_size: "512Gi"
        # build-02:
        #   vm_name: kaapana-build-02
        #   cpu_cores: 32
        #   memory_guest: "256Gi"
        #   disk_size: "512Gi"

    deploy_instances:
      hosts:
        deploy-01:
          vm_name: kaapana-deploy-01
          cpu_cores: 8
          memory_guest: "16Gi"
          disk_size: "128Gi"
