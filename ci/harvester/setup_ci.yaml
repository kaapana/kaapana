---
# Provision the CI runner fleet on Harvester.
#
# The fleet is declared in inventory.yaml under ci_instances: one entry per
# VM, each listing the runner roles it hosts.
#
# Settings are read from .env next to this file, so nothing needs exporting.
# Run from this directory: ansible.cfg here supplies the inventory and turns
# off host-key checking, which a recreated VM would otherwise trip.
#
# Rebuild the entire fleet from scratch — VMs destroyed, recreated, and every
# runner re-registered:
#
#   ansible-playbook setup_ci.yaml -e force_recreate=true
#
# Converge in place, creating only what is missing:
#
#   ansible-playbook setup_ci.yaml
#
# Tear down named VMs and unregister their runners (no recreate):
#
#   ansible-playbook setup_ci.yaml -e fleet_state=absent -e ci_hosts=kaapana-ci-01
#
# Options (-e, or the equivalent environment variable; -e wins):
#   -e ci_hosts=kaapana-ci-01  CI_HOSTS         act on these hosts only
#   -e force_recreate=true     FORCE_RECREATE   destroy and rebuild the VMs
#   -e fleet_state=absent      FLEET_STATE      teardown mode (needs CI_HOSTS)
#   -e runners_paused=true     RUNNERS_PAUSED   register the runners paused
#
# The options, the settings read from .env, and the day-to-day workflow are
# documented in README.md.

- name: Provision CI runner VMs on Harvester
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vm_image_name: "ubuntu24"
    vm_storage_class: "px-fa-direct-access"
    vm_network: "harvester-public/dkfz-net"
    vm_ssh_keypair: "kaapana"
    # -e wins over the environment, so either spelling works:
    #   -e force_recreate=true        FORCE_RECREATE=true
    #   -e ci_hosts=kaapana-ci-01     CI_HOSTS=kaapana-ci-01
    # Kept unconverted: -e outranks this definition anyway, so the coercion
    # that matters is the `| bool` at each point of use.
    force_recreate: "{{ lookup('env', 'FORCE_RECREATE') | default('false', true) }}"
    fleet_state: "{{ lookup('env', 'FLEET_STATE') | default('present', true) }}"
    ci_hosts: "{{ lookup('env', 'CI_HOSTS') | default('', true) }}"
    ci_hosts_filter: "{{ ci_hosts | split(',') | map('trim') | select | list }}"

    # gitlab_* , ssh_private_key and harvester_kubeconfig come from the
    # inventory, which reads harvester/.env — see ci_env there.
    required_settings:
      gitlab_api_token: "{{ gitlab_api_token }}"
      gitlab_project_id: "{{ gitlab_project_id }}"
      gitlab_url: "{{ gitlab_url }}"
      ssh_private_key: "{{ ssh_private_key }}"
      harvester_kubeconfig: "{{ harvester_kubeconfig }}"
      harvester_namespace: "{{ harvester_namespace }}"
      vm_dns_domain: "{{ vm_dns_domain }}"
      vm_user: "{{ vm_user }}"

  tasks:
    - name: Validate that every required setting is present
      ansible.builtin.assert:
        that:
          - item.value | default('', true) | length > 0
        fail_msg: >-
          {{ item.key }} is not set. Add it to {{ ci_env_file }}
          (see .env.example) or export it.
      loop: "{{ required_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      run_once: true

    - name: Require an explicit host list to tear down
      ansible.builtin.assert:
        that:
          - fleet_state != "absent" or ci_hosts_filter | length > 0
        fail_msg: "fleet_state=absent needs CI_HOSTS. Name the hosts to remove."
      run_once: true

    - name: Select the fleet hosts to act on
      ansible.builtin.set_fact:
        fleet_hosts: >-
          {{
            groups['ci_instances'] | default([])
            | select('in', ci_hosts_filter if ci_hosts_filter else groups['ci_instances'] | default([]))
            | list
          }}

    - name: Fail if CI_HOSTS names hosts that are not in the inventory
      ansible.builtin.assert:
        that:
          - ci_hosts_filter | difference(groups['ci_instances'] | default([])) | length == 0
        fail_msg: >-
          CI_HOSTS refers to unknown hosts:
          {{ ci_hosts_filter | difference(groups['ci_instances'] | default([])) | join(', ') }}

    - name: Build list of VMs to provision
      ansible.builtin.set_fact:
        vms_to_provision: >-
          {{
            fleet_hosts | map('extract', hostvars)
            | selectattr('vm_name', 'defined') | list
          }}

    - name: Fail if no VM is selected
      ansible.builtin.assert:
        that:
          - vms_to_provision | length > 0
        fail_msg: "No VMs selected. Declare hosts under ci_instances in the inventory."

    # runner_roles comes from the inventory's all.vars, which the implicit
    # localhost does not inherit — read it off the target host instead.
    - name: Validate that every VM lists known runner roles
      ansible.builtin.assert:
        that:
          - item.runners | default([]) | length > 0
          - item.runners | default([]) | difference(item.runner_roles.keys() | list) | length == 0
        fail_msg: >-
          {{ item.vm_name }} declares no runners, or unknown roles
          ({{ item.runners | default([]) | difference(item.runner_roles.keys() | list) | join(', ') }}).
          Known roles: {{ item.runner_roles.keys() | join(', ') }}
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"

    # Teardown: unregister runners, delete the VMs, drop stale SSH host keys.
    # Play 2/3 (inventory + configure) are skipped below via fleet_state.
    - name: Tear down the selected VMs
      block:
        - name: Delete the GitLab runner entries
          community.general.gitlab_runner:
            api_url: "{{ gitlab_url }}"
            api_token: "{{ gitlab_api_token }}"
            description: "{{ item.0.vm_name }}-{{ item.1 }}"
            state: absent
            project: "{{ gitlab_project_id }}"
          loop: "{{ vms_to_provision | subelements('runners', skip_missing=True) }}"
          loop_control:
            label: "{{ item.0.vm_name }}-{{ item.1 }}"

        - name: Delete the VirtualMachine
          kubernetes.core.k8s:
            state: absent
            api_version: kubevirt.io/v1
            kind: VirtualMachine
            name: "{{ item.vm_name }}"
            namespace: "{{ harvester_namespace }}"
            kubeconfig: "{{ harvester_kubeconfig }}"
          loop: "{{ vms_to_provision }}"
          loop_control:
            label: "{{ item.vm_name }}"

        - name: Wait for the VirtualMachine to be gone
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: VirtualMachine
            name: "{{ item.vm_name }}"
            namespace: "{{ harvester_namespace }}"
            kubeconfig: "{{ harvester_kubeconfig }}"
          loop: "{{ vms_to_provision }}"
          loop_control:
            label: "{{ item.vm_name }}"
          register: vm_gone
          until: vm_gone.resources | length == 0
          retries: 60
          delay: 5
          changed_when: false

        - name: Drop the stale SSH host key
          ansible.builtin.command: ssh-keygen -R {{ item.vm_name }}.{{ vm_dns_domain }}
          loop: "{{ vms_to_provision }}"
          loop_control:
            label: "{{ item.vm_name }}"
          changed_when: false
          failed_when: false
      when: fleet_state == "absent"

    - name: Check if VM already exists
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ item.vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"
      register: vm_exists_check
      # Deliberately allowed to fail the run. A missing VM already comes back
      # as an empty resources list, so the only thing a swallowed error can
      # mean is "could not tell" — and downstream that reads as "absent",
      # which reprovisions a live VM onto a blank disk.
      until: vm_exists_check is succeeded
      retries: 3
      delay: 5
      changed_when: false
      when: fleet_state != "absent"

    - name: Build list of existing VM names
      ansible.builtin.set_fact:
        existing_vm_names: >-
          {{
            vm_exists_check.results
            | rejectattr('resources', 'equalto', [])
            | map(attribute='resources.0.metadata.name')
            | list
          }}
      when: fleet_state != "absent"

    - name: Filter to only new VMs (skip existing unless force_recreate)
      ansible.builtin.set_fact:
        vms_to_create: >-
          {{
            vms_to_provision
            | rejectattr('vm_name', 'in', existing_vm_names)
            | list
          }}
      when: not (force_recreate | bool) and fleet_state != "absent"

    - name: Filter to all VMs (force recreate)
      ansible.builtin.set_fact:
        vms_to_create: "{{ vms_to_provision }}"
      when: force_recreate | bool and fleet_state != "absent"

    - name: Display the fleet
      ansible.builtin.debug:
        msg: >-
          {{
            item.vm_name + ": " + (item.runners | default([]) | join(', ') or 'none')
            + (" [create]" if item.vm_name in (vms_to_create | map(attribute='vm_name') | list) else " [exists]")
          }}
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when: fleet_state != "absent"

    - name: Delete existing VMs (force recreate mode)
      kubernetes.core.k8s:
        state: absent
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ item.vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when: force_recreate | bool and fleet_state != "absent"

    - name: Wait for VMs to be deleted
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ item.vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"
      register: vm_deletion_check
      until: vm_deletion_check.resources | length == 0
      retries: 30
      delay: 5
      changed_when: false
      when: force_recreate | bool and fleet_state != "absent"

    # Deleting the VM is supposed to cascade to its disk and cloud-init secret
    # through their ownerReferences, but that GC is asynchronous and only
    # reaches objects whose ownerReference still resolves — a disk left behind
    # by an interrupted run has one pointing at a VM that was never removed.
    # Because the disk name carries a random suffix, such a leftover never
    # collides with the new disk and would sit there holding its full size
    # forever. Sweeping by name is what makes "from scratch" mean it.
    - name: List disks in the namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      register: pvc_sweep
      changed_when: false
      when: force_recreate | bool and fleet_state != "absent"

    - name: Delete every disk belonging to the targeted VMs
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
        wait: true
        wait_timeout: 300
      # Anchored on the targeted VM names only: the namespace also holds the
      # short-lived deployment VMs that pipelines provision, and those are not
      # this playbook's to delete.
      loop: >-
        {{
          pvc_sweep.resources | default([])
          | map(attribute='metadata.name')
          | select('match', '^(' ~ (vms_to_provision | map(attribute='vm_name') | join('|')) ~ ')-disk-0-')
          | list
        }}
      when: force_recreate | bool and fleet_state != "absent"

    - name: Delete the cloud-init secret of each targeted VM
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item.vm_name }}-cloudinit"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
        wait: true
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when: force_recreate | bool and fleet_state != "absent"

    - name: Provision each VM
      ansible.builtin.include_tasks: tasks/provision-single-vm.yaml
      loop: "{{ vms_to_create }}"
      loop_control:
        loop_var: vm_config
        label: "{{ vm_config.vm_name }}"
      when: vms_to_create | length > 0 and fleet_state != "absent"

- name: Add all VMs to inventory (new and existing)
  hosts: localhost
  gather_facts: false
  vars:
    # Play vars do not cross plays, but the when: below needs the option —
    # same definition as in play 1.
    fleet_state: "{{ lookup('env', 'FLEET_STATE') | default('present', true) }}"
  tasks:
    - name: Register VM in inventory
      ansible.builtin.add_host:
        name: "{{ item.vm_name }}"
        ansible_host: "{{ item.vm_name }}.{{ vm_dns_domain }}"
        ansible_user: "{{ vm_user }}"
        ansible_ssh_private_key_file: "{{ ssh_private_key }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        groups: "provisioned_vms"
        vm_name: "{{ item.vm_name }}"
        runners: "{{ item.runners | default([]) }}"
        runner_overrides: "{{ item.runner_overrides | default({}) }}"
      loop: "{{ vms_to_provision }}"
      loop_control:
        loop_var: item
        label: "{{ item.vm_name }}"
      when: fleet_state != "absent"

- name: Configure all provisioned VMs
  hosts: provisioned_vms
  gather_facts: false
  remote_user: "{{ vm_user }}"
  become: yes
  tasks:
    # From the control node: running it on the target would need the very SSH
    # connection it is waiting for.
    - name: Wait for SSH to be available
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 10
        timeout: 600
      delegate_to: localhost
      become: no

    - name: Configure VM base (venv, python requirements)
      ansible.builtin.include_tasks: tasks/configure-vm-base.yaml

    - name: Install Docker
      ansible.builtin.include_tasks: tasks/install-docker.yaml

    - name: Install kubectl
      ansible.builtin.include_tasks: tasks/install-kubectl.yaml

    - name: Install Helm
      ansible.builtin.include_tasks: tasks/install-helm.yaml

    - name: Install monitoring agents
      ansible.builtin.include_tasks: tasks/install-monitoring.yaml

    - name: Configure GitLab Runners
      ansible.builtin.include_tasks: tasks/configure-gitlab-runner.yaml
      when: runners | default([]) | length > 0

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "CI runner setup complete!"
          - "VM: {{ inventory_hostname }} ({{ ansible_host }})"
          - "Runners: {{ resolved_runners | default([]) | map(attribute='description') | join(', ') }}"
          - "Concurrent job slots: {{ runner_global_concurrency | default(0) }}"
          - "=========================================="
