---
# Provision the CI runner fleet on Harvester.
#
# The fleet is declared in inventory.yaml under ci_instances: one entry per
# VM, each listing the runner roles it hosts. The default fleet is a single
# VM carrying all four roles.
#
# Usage:
#   export GITLAB_API_TOKEN=...
#   export GITLAB_PROJECT_ID=...
#   export GITLAB_URL=...
#   export SSH_PUBLIC_KEY=~/.ssh/kaapana.pub
#   export SSH_PRIVATE_KEY=~/.ssh/kaapana.pem
#   export HARVESTER_KUBECONFIG=~/.kube/harvester.yaml
#   ansible-playbook -i ci/harvester/inventory.yaml ci/harvester/setup_ci.yaml
#
# Optional:
#   export CI_HOSTS=ci-02        # comma-separated; act on these hosts only
#   export FORCE_RECREATE=true   # delete and recreate the targeted VMs
#   export RUNNERS_PAUSED=true   # register runners paused (unpause after checking)

- name: Provision CI runner VMs on Harvester
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    harvester_namespace: "kaapana-ci"
    vm_image_name: "ubuntu24"
    vm_storage_class: "px-fa-direct-access"
    vm_network: "harvester-public/dkfz-net"
    vm_ssh_keypair: "kaapana"
    vm_user: "ubuntu"
    vm_dns_domain: "vms.dkfz.de"
    force_recreate: "{{ lookup('env', 'FORCE_RECREATE') | default('false') | bool }}"
    ci_hosts_filter: "{{ lookup('env', 'CI_HOSTS') | default('', true) | split(',') | map('trim') | select | list }}"

    gitlab_api_token: "{{ lookup('env', 'GITLAB_API_TOKEN') }}"
    gitlab_project_id: "{{ lookup('env', 'GITLAB_PROJECT_ID') }}"
    gitlab_url: "{{ lookup('env', 'GITLAB_URL') }}"
    ssh_public_key: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"
    ssh_private_key: "{{ lookup('env', 'SSH_PRIVATE_KEY') }}"
    harvester_kubeconfig: "{{ lookup('env', 'HARVESTER_KUBECONFIG') }}"

    required_env_vars:
      - GITLAB_API_TOKEN
      - GITLAB_PROJECT_ID
      - GITLAB_URL
      - SSH_PUBLIC_KEY
      - SSH_PRIVATE_KEY
      - HARVESTER_KUBECONFIG

  tasks:
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', item) | default('', true) | length > 0
        fail_msg: "Required variable {{ item }} is missing. Set it as environment variable."
      loop: "{{ required_env_vars }}"
      run_once: true

    - name: Select the fleet hosts to act on
      ansible.builtin.set_fact:
        fleet_hosts: >-
          {{
            groups['ci_instances'] | default([])
            | select('in', ci_hosts_filter if ci_hosts_filter else groups['ci_instances'] | default([]))
            | list
          }}

    - name: Fail if CI_HOSTS names hosts that are not in the inventory
      ansible.builtin.assert:
        that:
          - ci_hosts_filter | difference(groups['ci_instances'] | default([])) | length == 0
        fail_msg: >-
          CI_HOSTS refers to unknown hosts:
          {{ ci_hosts_filter | difference(groups['ci_instances'] | default([])) | join(', ') }}

    - name: Build list of VMs to provision
      ansible.builtin.set_fact:
        vms_to_provision: >-
          {{
            fleet_hosts | map('extract', hostvars)
            | selectattr('vm_name', 'defined') | list
          }}

    - name: Fail if no VM is selected
      ansible.builtin.assert:
        that:
          - vms_to_provision | length > 0
        fail_msg: "No VMs selected. Declare hosts under ci_instances in the inventory."

    # runner_roles comes from the inventory's all.vars, which the implicit
    # localhost does not inherit — read it off the target host instead.
    - name: Validate that every VM lists known runner roles
      ansible.builtin.assert:
        that:
          - item.runners | default([]) | length > 0
          - item.runners | default([]) | difference(item.runner_roles.keys() | list) | length == 0
        fail_msg: >-
          {{ item.vm_name }} declares no runners, or unknown roles
          ({{ item.runners | default([]) | difference(item.runner_roles.keys() | list) | join(', ') }}).
          Known roles: {{ item.runner_roles.keys() | join(', ') }}
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"

    - name: Check if VM already exists
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ item.vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"
      register: vm_exists_check
      failed_when: false
      changed_when: false

    - name: Build list of existing VM names
      ansible.builtin.set_fact:
        existing_vm_names: >-
          {{
            vm_exists_check.results
            | selectattr('resources', 'defined')
            | rejectattr('resources', 'equalto', [])
            | map(attribute='resources.0.metadata.name')
            | list
          }}

    - name: Filter to only new VMs (skip existing unless force_recreate)
      ansible.builtin.set_fact:
        vms_to_create: >-
          {{
            vms_to_provision
            | rejectattr('vm_name', 'in', existing_vm_names)
            | list
          }}
      when: not force_recreate

    - name: Filter to all VMs (force recreate)
      ansible.builtin.set_fact:
        vms_to_create: "{{ vms_to_provision }}"
      when: force_recreate

    - name: Display the fleet
      ansible.builtin.debug:
        msg: >-
          {{
            item.vm_name + ": " + (item.runners | join(', '))
            + (" [create]" if item.vm_name in (vms_to_create | map(attribute='vm_name') | list) else " [exists]")
          }}
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"

    - name: Delete existing VMs (force recreate mode)
      kubernetes.core.k8s:
        state: absent
        kind: VirtualMachine
        name: "{{ item.vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when: force_recreate

    - name: Wait for VMs to be deleted
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ item.vm_name }}"
        namespace: "{{ harvester_namespace }}"
        kubeconfig: "{{ harvester_kubeconfig }}"
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.vm_name }}"
      register: vm_deletion_check
      until: vm_deletion_check.resources | length == 0
      retries: 30
      delay: 5
      changed_when: false
      when: force_recreate

    - name: Provision each VM
      ansible.builtin.include_tasks: tasks/provision-single-vm.yaml
      loop: "{{ vms_to_create }}"
      loop_control:
        loop_var: vm_config
        label: "{{ vm_config.vm_name }}"
      when: vms_to_create | length > 0

- name: Add all VMs to inventory (new and existing)
  hosts: localhost
  gather_facts: false
  vars:
    vm_dns_domain: "vms.dkfz.de"
    vm_user: "ubuntu"
    ssh_private_key: "~/.ssh/kaapana.pem"
  tasks:
    - name: Register VM in inventory
      ansible.builtin.add_host:
        name: "{{ item.vm_name }}"
        ansible_host: "{{ item.vm_name }}.{{ vm_dns_domain }}"
        ansible_user: "{{ vm_user }}"
        ansible_ssh_private_key_file: "{{ ssh_private_key }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        groups: "provisioned_vms"
        vm_name: "{{ item.vm_name }}"
        runners: "{{ item.runners }}"
        runner_overrides: "{{ item.runner_overrides | default({}) }}"
      loop: "{{ vms_to_provision }}"
      loop_control:
        loop_var: item
        label: "{{ item.vm_name }}"

- name: Configure all provisioned VMs
  hosts: provisioned_vms
  gather_facts: false
  remote_user: ubuntu
  become: yes
  tasks:
    # From the control node: running this on the target would need the very
    # SSH it is waiting for, so a freshly booted VM came back UNREACHABLE.
    - name: Wait for SSH to be available
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 10
        timeout: 600
      delegate_to: localhost
      become: no

    - name: Configure VM base (venv, python requirements)
      ansible.builtin.include_tasks: tasks/configure-vm-base.yaml

    - name: Install Docker
      ansible.builtin.include_tasks: tasks/install-docker.yaml

    - name: Install kubectl
      ansible.builtin.include_tasks: tasks/install-kubectl.yaml

    - name: Install Helm
      ansible.builtin.include_tasks: tasks/install-helm.yaml

    - name: Configure GitLab Runners
      ansible.builtin.include_tasks: tasks/configure-gitlab-runner.yaml

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "CI runner setup complete!"
          - "VM: {{ inventory_hostname }} ({{ ansible_host }})"
          - "Runners: {{ resolved_runners | map(attribute='description') | join(', ') }}"
          - "Concurrent job slots: {{ runner_global_concurrency }}"
          - "=========================================="
