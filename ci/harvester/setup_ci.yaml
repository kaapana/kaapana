---
# Provision ALL CI runner VMs on Harvester (tests, build, security, deploy) —
# imports the four group playbooks below and runs them in sequence. Each one
# is also independently runnable and only ever touches its own group's
# VM(s), so running one never risks touching another group's already-running
# VM. Prefer the standalone files when you only need to add/reconfigure one
# group:
#   ansible-playbook -i ci/harvester/inventory.yaml ci/harvester/setup_tests.yaml
#   ansible-playbook -i ci/harvester/inventory.yaml ci/harvester/setup_build.yaml
#   ansible-playbook -i ci/harvester/inventory.yaml ci/harvester/setup_security.yaml
#   ansible-playbook -i ci/harvester/inventory.yaml ci/harvester/setup_deploy.yaml
#
# Usage (all four):
#   export GITLAB_API_TOKEN=...
#   export GITLAB_PROJECT_ID=...
#   export GITLAB_URL=...
#   export SSH_PUBLIC_KEY=~/.ssh/kaapana.pub
#   export SSH_PRIVATE_KEY=~/.ssh/kaapana.pem
#   export HARVESTER_KUBECONFIG=~/.kube/harvester.yaml
#   ansible-playbook -i ci/harvester/inventory.yaml ci/harvester/setup_ci.yaml
#
# Optional:
#   export FORCE_RECREATE=true  # Delete and recreate existing VMs (every group)

- ansible.builtin.import_playbook: setup_tests.yaml
- ansible.builtin.import_playbook: setup_build.yaml
- ansible.builtin.import_playbook: setup_security.yaml
- ansible.builtin.import_playbook: setup_deploy.yaml
