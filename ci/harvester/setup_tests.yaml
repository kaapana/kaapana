---
# Provision the tests-runner CI VM(s) on Harvester.
# Usage:
#   export GITLAB_API_TOKEN=...
#   export GITLAB_PROJECT_ID=...
#   export GITLAB_URL=...
#   export SSH_PUBLIC_KEY=~/.ssh/kaapana.pub
#   export SSH_PRIVATE_KEY=~/.ssh/kaapana.pem
#   export HARVESTER_KUBECONFIG=~/.kube/harvester.yaml
#   ansible-playbook -i ci/harvester/inventory.yaml ci/harvester/setup_tests.yaml
#
# Optional:
#   export FORCE_RECREATE=true  # Delete and recreate this group's VM(s)

- ansible.builtin.import_playbook: setup_group.yaml
  vars:
    instance_group: tests_instances
