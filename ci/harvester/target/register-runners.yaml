---
## Register GitLab runners based on instance_type (build or deploy)
## Creates two runners per VM: one shared (high concurrency) and one dedicated (single job)
## Runner names are derived from vm_name (e.g., kaapana-build-01 → shared-kaapana-build-01, dedicated-kaapana-build-01)

# Set runner names and tags based on vm_name
- name: Set runner configuration
  ansible.builtin.set_fact:
    shared_runner_name: "shared-{{ vm_name }}"
    shared_runner_tag: "{{ 'build-shared' if instance_type == 'build' else 'deploy-shared' }}"
    dedicated_runner_name: "dedicated-{{ vm_name }}"
    dedicated_runner_tag: "{{ 'build-dedicated' if instance_type == 'build' else 'deploy-dedicated' }}"
    # Use instance-specific or fall back to default limits
    shared_limit: "{{ runner_shared_limit | default(deploy_runner_shared_limit) | default(5) }}"
    shared_request_concurrency: "{{ runner_shared_request_concurrency | default(deploy_runner_shared_request_concurrency) | default(4) }}"
    dedicated_limit: "{{ runner_dedicated_limit | default(deploy_runner_dedicated_limit) | default(1) }}"
    dedicated_request_concurrency: "{{ runner_dedicated_request_concurrency | default(deploy_runner_dedicated_request_concurrency) | default(4) }}"

- name: Display runner configuration
  ansible.builtin.debug:
    msg: |
      VM: {{ vm_name }}
      Shared runner: {{ shared_runner_name }} (tag: {{ shared_runner_tag }})
      Dedicated runner: {{ dedicated_runner_name }} (tag: {{ dedicated_runner_tag }})

# Register shared runner via GitLab API
- name: Register shared runner via GitLab API
  ansible.builtin.uri:
    url: "{{ gitlab_url }}/api/v4/user/runners"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_token }}"
    body_format: json
    body:
      runner_type: project_type
      project_id: "{{ gitlab_project_id }}"
      description: "{{ shared_runner_name }}"
      tag_list:
        - "{{ shared_runner_tag }}"
    status_code: [200, 201]
  register: shared_runner_api
  delegate_to: localhost
  until: shared_runner_api is succeeded

- name: Register shared runner with CLI
  ansible.builtin.command:
    cmd: >
      gitlab-runner register
      --non-interactive
      --url "{{ gitlab_url }}"
      --token "{{ shared_runner_api.json.token }}"
      --name "{{ shared_runner_name }}"
      --executor shell
      --builds-dir {{ ansible_facts.env.HOME }}/builds
      --cache-dir {{ ansible_facts.env.HOME }}/cache
  register: register_shared_result
  until: register_shared_result.rc == 0

# Register dedicated runner via GitLab API
- name: Register dedicated runner via GitLab API
  ansible.builtin.uri:
    url: "{{ gitlab_url }}/api/v4/user/runners"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_token }}"
    body_format: json
    body:
      runner_type: project_type
      project_id: "{{ gitlab_project_id }}"
      description: "{{ dedicated_runner_name }}"
      tag_list:
        - "{{ dedicated_runner_tag }}"
    status_code: [200, 201]
  register: dedicated_runner_api
  delegate_to: localhost
  until: dedicated_runner_api is succeeded
  when: instance_type == 'build'

- name: Register dedicated runner with CLI
  ansible.builtin.command:
    cmd: >
      gitlab-runner register
      --non-interactive
      --url "{{ gitlab_url }}"
      --token "{{ dedicated_runner_api.json.token }}"
      --name "{{ dedicated_runner_name }}"
      --executor shell
      --builds-dir {{ ansible_facts.env.HOME }}/builds
      --cache-dir {{ ansible_facts.env.HOME }}/cache
  register: register_dedicated_result
  until: register_dedicated_result.rc == 0

# Update config.toml with limit, request_concurrency, and custom_build_dir settings
- name: Copy runner settings script to remote
  ansible.builtin.copy:
    src: "$REPO_DIR/ci-code/register_runner_settings.py"
    dest: /tmp/register_runner_settings.py
    mode: '0755'

- name: Run runner settings script
  ansible.builtin.command:
    cmd: >-
      python3 /tmp/register_runner_settings.py
      --config "{{ runner_config_path }}"
      --shared-name "{{ shared_runner_name }}"
      --shared-limit {{ shared_limit }}
      --shared-request-concurrency {{ shared_request_concurrency }}
      --dedicated-name "{{ dedicated_runner_name }}"
      --dedicated-limit {{ dedicated_limit }}
      --dedicated-request-concurrency {{ dedicated_request_concurrency }}
      --vm-name "{{ vm_name }}"
  register: update_config_result
  failed_when: update_config_result.rc != 0
