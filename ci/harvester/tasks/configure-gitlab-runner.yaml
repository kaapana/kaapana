---
## Configure GitLab runners on VM
## The runner agent is a docker container.
## Config location: ~/.gitlab-runner/config.toml on the host, bind-mounted into
## the container at /etc/gitlab-runner.

- name: Set variables
  ansible.builtin.set_fact:
    runner_user: "{{ ansible_user }}"
    runner_home: "/home/{{ ansible_user }}"
    runner_config_dir: "/home/{{ ansible_user }}/.gitlab-runner"
    runner_config_path: "/home/{{ ansible_user }}/.gitlab-runner/config.toml"
    gitlab_token: "{{ gitlab_api_token }}"
    runner_description: "{{ runner_description | default(inventory_hostname) }}"
    runner_tags: "{{ runner_tags | default(['ci-runner']) }}"
    runner_limit: "{{ runner_limit | default(4) }}"
    runner_concurrency: "{{ runner_concurrency | default(4) }}"
    runner_executor: "{{ runner_executor | default('docker') }}"
    runner_docker_image: "{{ runner_docker_image | default('python:3.12') }}"
    runner_docker_volumes: "{{ runner_docker_volumes | default(['/cache']) }}"
    runner_docker_services_privileged: "{{ runner_docker_services_privileged | default(false) }}"
    runner_docker_allowed_privileged_services: "{{ runner_docker_allowed_privileged_services | default([]) }}"
    runner_agent_image: "{{ runner_agent_image | default('gitlab/gitlab-runner:v17.11.0') }}"
    runner_container_name: "{{ runner_container_name | default('gitlab-runner') }}"
  become: no

- name: Set global concurrency fact if not defined
  ansible.builtin.set_fact:
    runner_global_concurrency: "{{ runner_global_concurrency | default(runner_limit) }}"

################################################
# Migration: drop any host-installed runner left from the apt/systemd setup.
# Harmless on a fresh VM; converts an existing one on re-provision.
################################################
- name: Remove host-installed GitLab Runner
  become: yes
  block:
    - name: Stop and disable user-mode gitlab-runner service
      ansible.builtin.command: systemctl --user disable --now gitlab-runner
      become_user: "{{ ansible_user }}"
      failed_when: false
      changed_when: false

    - name: Stop and disable system-wide gitlab-runner service
      ansible.builtin.systemd:
        name: gitlab-runner
        state: stopped
        enabled: no
      failed_when: false

    - name: Remove gitlab-runner apt package
      ansible.builtin.apt:
        name: gitlab-runner
        state: absent
        purge: yes

    - name: Remove user-mode unit file
      ansible.builtin.file:
        path: "{{ runner_home }}/.config/systemd/user/gitlab-runner.service"
        state: absent

################################################
# GitLab-side runner entry
################################################
- name: Ensure runner config directory exists
  ansible.builtin.file:
    path: "{{ runner_config_dir }}"
    state: directory
    mode: "0700"
  become: no

- name: Delete existing GitLab runner (remote)
  community.general.gitlab_runner:
    api_url: "{{ gitlab_url }}"
    api_token: "{{ gitlab_api_token }}"
    description: "{{ runner_description }}"
    state: absent
    project: "{{ gitlab_project_id }}"
  become: no

- name: Create GitLab runner entry (remote)
  community.general.gitlab_runner:
    api_url: "{{ gitlab_url }}"
    api_token: "{{ gitlab_api_token }}"
    description: "{{ runner_description }}"
    state: present
    active: true
    tag_list: "{{ runner_tags }}"
    run_untagged: false
    locked: false
    maximum_timeout: 7200
    project: "{{ gitlab_project_id }}"
  register: new_runner
  become: no

################################################
# Register into the bind-mounted config
################################################
# register appends a [[runners]] block rather than replacing one, so a stale
# config would leave the agent polling GitLab twice under one token.
- name: Remove existing config.toml
  ansible.builtin.file:
    path: "{{ runner_config_path }}"
    state: absent
  become: no

- name: Pull runner agent image
  community.docker.docker_image:
    name: "{{ runner_agent_image }}"
    source: pull
  become: no

# Interleave each value with its flag: --docker-volumes A --docker-volumes B ...
- name: Reset register flag accumulators
  ansible.builtin.set_fact:
    runner_volume_flags: []
    runner_privsvc_flags: []
  become: no

- name: Build --docker-volumes flags
  ansible.builtin.set_fact:
    runner_volume_flags: "{{ runner_volume_flags + ['--docker-volumes', item] }}"
  loop: "{{ runner_docker_volumes }}"
  when: runner_executor == 'docker'
  become: no

- name: Build --docker-allowed-privileged-services flags
  ansible.builtin.set_fact:
    runner_privsvc_flags: "{{ runner_privsvc_flags + ['--docker-allowed-privileged-services', item] }}"
  loop: "{{ runner_docker_allowed_privileged_services }}"
  when: runner_executor == 'docker'
  become: no

# Booleans need the --flag=value form: with a space the runner warns
# "parameters after this may be ignored" and may drop the flags that follow.
- name: Register runner
  ansible.builtin.command:
    argv: >-
      {{
        ['docker', 'run', '--rm',
         '-v', runner_config_dir ~ ':/etc/gitlab-runner',
         runner_agent_image,
         'register', '--non-interactive',
         '--url', gitlab_url,
         '--token', new_runner.runner.token,
         '--name', runner_description,
         '--executor', runner_executor]
        + (['--docker-image', runner_docker_image,
            '--docker-pull-policy', 'if-not-present']
           if runner_executor == 'docker' else ['--shell', 'bash'])
        + runner_volume_flags
        + (['--docker-services_privileged=true']
           if (runner_executor == 'docker' and runner_docker_services_privileged | bool) else [])
        + runner_privsvc_flags
      }}
  register: register_local
  changed_when: "'Runner registered successfully' in register_local.stdout"
  become: no

- name: Copy config.py to runner home
  ansible.builtin.copy:
    src: config.py
    dest: "{{ runner_home }}/config.py"
    mode: "0755"

- name: Update runner configuration (config.toml)
  ansible.builtin.command: >
    {{ venv_path }}/bin/python3 config.py
    --runner-home {{ runner_home }}
    --token {{ new_runner.runner.token }}
    --custom-build-dir True
    --limit {{ runner_limit }}
    --request-concurrency {{ runner_concurrency }}
    --global-concurrent {{ runner_global_concurrency }}
    --config-path {{ runner_config_path }}

################################################
# Run the agent
################################################
# The socket lets the agent create job containers as siblings on the host
# daemon. Bind mounts in config.toml therefore resolve against host paths,
# exactly as they did when the runner was a host package.
- name: Run GitLab Runner container
  community.docker.docker_container:
    name: "{{ runner_container_name }}"
    image: "{{ runner_agent_image }}"
    state: started
    recreate: yes
    restart_policy: always
    volumes:
      - "{{ runner_config_dir }}:/etc/gitlab-runner"
      - "/var/run/docker.sock:/var/run/docker.sock"
  become: no

- name: Verify runner connectivity
  ansible.builtin.command: docker exec {{ runner_container_name }} gitlab-runner verify
  register: runner_verify
  changed_when: false
  failed_when: false
  become: no

- name: Show runner verification
  ansible.builtin.debug:
    var: runner_verify.stdout_lines
