---
- name: Remove helm plugins
  become: no
  shell: /snap/bin/helm plugin list | awk 'NR>1 {print $1}' | xargs -r -I {} /snap/bin/helm plugin uninstall {} || true
  args:
    executable: /bin/bash

- name: Uninstall existing Helm
  become: yes
  shell: snap remove helm || true
  args:
    executable: /bin/bash

- name: Wait for snapd to finish initial seeding
  # A freshly booted VM's snapd is still seeding its initial snaps; snap
  # install can fail with "unable to contact snap store" until that's done.
  become: yes
  command: snap wait system seed.loaded
  changed_when: false

- name: Install Helm
  become: yes
  command: snap install helm --classic --channel=latest/stable
  register: helm_install
  until: helm_install.rc == 0
  retries: 5
  delay: 15

- name: Check helm push installed
  become: no
  command: /snap/bin/helm push --help

- name: install helm kubeval
  become: no
  command: /snap/bin/helm plugin install --verify=false https://github.com/instrumenta/helm-kubeval
