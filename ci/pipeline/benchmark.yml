# Stage: test — ingestion-pipeline benchmark against the deployed platform
# In:  deployment.env dotenv (VM_FQDN, VERSION_TAG); the live platform, once
#      integration tests are done generating traffic against it
# Out: tagged JSON results as GitLab job artifacts only — no package
#      registry, no runner-local persistence. Retention/access is whatever
#      this job's artifacts: block + the project's CI/CD settings say.
##############################################
# BENCHMARK
##############################################
benchmark_platform:
  extends: .remote_execution_template
  stage: test
  allow_failure: true
  timeout: 3 hours
  rules:
    - if: '$CI_EXEC_BENCHMARKING == "true" && $CI_EXEC_DEPLOY == "true"'
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
    - platform_deployment
    # Not a hard dependency (rules-gated: only present when
    # CI_EXEC_INTEGRATION_TESTS == "true") — but without first_login the
    # platform's "kaapana" user still has its default password, not "admin",
    # and login below will fail. Run integration tests alongside this until
    # there's a benchmark-only path that sets the password itself.
    - { job: first_login, optional: true }
    # Wait out both test-traffic generators so they don't skew DAG timing.
    - { job: run_workflows, optional: true }
    - { job: playwright_ui_tests, optional: true }
  script:
    - git clone "https://oauth2:${BENCHMARK_DATA_REPO_TOKEN}@${BENCHMARK_DATA_REPO_URL#https://}" "$BENCHMARK_DATA_REPO_DIR" || git -C "$BENCHMARK_DATA_REPO_DIR" pull
    - git -C "$BENCHMARK_DATA_REPO_DIR" lfs pull
    - export BENCHMARK_DATA_DIR="$BENCHMARK_DATA_REPO_DIR/image_modalities"
    # Not baked into $CI_BASE_IMAGE yet (dcmtk is; typer/matplotlib/numpy
    # aren't) — installs in seconds, revisit if this job's runtime matters.
    - pip install -e "$CI_PROJECT_DIR/utils/platform-benchmark"
    # Own subdirectory, not $ARTIFACTS_DIR directly — that path is shared
    # with prepare_deployment's deployment.env (pulled in via needs:
    # artifacts), and expose_as below can't use a wildcard to filter it
    # back out to just the JSON results.
    - mkdir -p "$ARTIFACTS_DIR/benchmark"
    - |
      for i in $(seq 1 "$BENCHMARK_RUNS"); do
        tag="${VERSION_TAG}-r${i}"
        # --password: fixed by first_login's set_new_password default (see
        # ci/ci-code/integration_tests/integration_tests/login.py) — same
        # assumption the pytest integration tests already make.
        benchmark --results-dir "$ARTIFACTS_DIR/benchmark" ingestion-pipeline \
          --host "https://$VM_FQDN" --username kaapana --password admin \
          --mode "$BENCHMARK_MODE" --data-dir "$BENCHMARK_DATA_DIR" \
          --tag "$tag" --force
      done
  artifacts:
    when: always
    paths:
      - "$ARTIFACTS_DIR/benchmark/"
    expose_as: "Benchmark Results"
