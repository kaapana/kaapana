# Stage: build — platform images + charts, and their security scan
# In:  the job's own checkout; REGISTRY_* credentials
# Out: images + charts in the registry, tagged git describe of this commit
#      (the ONLY handover to deploy); build.log artifact; security-reports/
#      (vuln scan, misconfig, SBOMs) as persistent artifacts;
#      vulnerability_report.html; GitLab container-scanning report
##############################################
# BUILD
##############################################
# Shared by build_packages and security_scan: both run kaapana-build, whose
# version tag comes from git describe — full clone + tags keep it deterministic.
.build_cli_env:
  tags:
    - build-runner
  image: $CI_BASE_IMAGE
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0" # full history — the global depth 1 would shallow the clone and break git describe
  before_script:
    # DOCKER_AUTH_CONFIG shadows CLI logins, unset it so build/scan pushes use their logins
    - unset DOCKER_AUTH_CONFIG
    - pip install -e build_cli/
    - |-
      if [[ $CI_PIPELINE_SOURCE == "merge_request_event" ]]; then
        git checkout -B $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME $CI_COMMIT_SHA
      elif [[ -n "$CI_COMMIT_TAG" ]]; then
        # Tag pipeline: no branch ref; stay detached, git describe resolves the tag
        git checkout $CI_COMMIT_SHA
      else
        git checkout -B $CI_COMMIT_BRANCH $CI_COMMIT_SHA
      fi
    - git status
    - git fetch --tags

build_packages:
  extends: .build_cli_env
  stage: build
  dependencies: []
  # Docker CLI talks to the host daemon (socket mount on the build runner):
  # warm layer cache across pipelines, login state dies with the container.
  variables:
    RUNNER_SCRIPT_TIMEOUT: 8h
  timeout: 8 hours
  rules:
    # Release tag pipeline → publish to the release registry. Works only
    # because no REGISTRY_* project variables exist — they would outrank
    # rules:variables (broke the 0.7.0 release).
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
      when: on_success
      variables:
        REGISTRY_URL: $RELEASE_REGISTRY_URL
        REGISTRY_USER: $RELEASE_REGISTRY_USER
        REGISTRY_TOKEN: $RELEASE_REGISTRY_TOKEN
        CI_EXEC_DOCKER_PRUNE: "true"
    - if: '$CI_EXEC_BUILD == "true"'
      when: on_success
    - when: never
  script:
    - |
      [[ $CI_EXEC_DOCKER_PRUNE == "true" ]] && docker system prune --all --volumes -f

    # Docker logins (set +x to hide credentials from job log)
    - |
      set +x
      echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
      if [[ -n "$DOCKER_IO_USER" ]]; then
        echo "$DOCKER_IO_PASSWORD" | docker login docker.io -u "$DOCKER_IO_USER" --password-stdin
      fi
      export REGISTRY_PW="$REGISTRY_TOKEN"

    # Run build, capturing exit code so artifacts are always collected
    - kaapana-build --default-registry "$REGISTRY_URL" $CI_EXEC_BUILD_ARGUMENTS

  # No docker logout needed: login state dies with the job container.

  artifacts:
    name: "build_$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - "$CI_PROJECT_DIR/build/build.log"

##############################################
# SECURITY
##############################################
# Trivy scan + report of the tag this commit resolves to.
# In:  registry state — either just pushed by build_packages in this same
#      pipeline, or pushed by an earlier one (CI_EXEC_BUILD=false: standalone
#      rescan of an already-built tag); REGISTRY_* credentials via
#      .build_cli_env above.
# Out: security-reports/ (vuln scan, misconfig, SBOMs) as persistent
#      artifacts; vulnerability_report.html; GitLab container-scanning report
security_scan:
  extends: .build_cli_env
  stage: build
  timeout: 4 hours
  needs:
    # optional: true — lets this run standalone (CI_EXEC_BUILD=false) against
    # a tag an earlier pipeline already pushed; still ordered after
    # build_packages when both run in the same pipeline.
    - job: build_packages
      artifacts: false
      optional: true
  rules:
    # No dependency on CI_EXEC_BUILD: this scans whatever git describe
    # resolves on the current checkout, whether or not this pipeline is the
    # one that built it.
    - if: '$CI_EXEC_SECURITY_SCAN == "true"'
      when: on_success
    - when: never
  # Trivy DB persisted across runs on this runner: GIT_STRATEGY: clone wipes
  # the checkout every job, so without this every run cold-pulls the ~1GB db
  # from the upstream OCI registry. With runner_concurrency: 2 on the build
  # runner (ci/harvester/inventory.yaml), two cold pulls landing at once was
  # hitting TooManyRequests. Trivy itself skips the download once the cached
  # copy is fresh, so this reduces most runs to a metadata check.
  cache:
    key: trivy-db
    paths:
      - "$CI_PROJECT_DIR/security-reports/.trivy_cache/"
  script:
    - pip install jsonschema
    # kaapana-build logs in client-side; trivy reads the docker config.
    - |
      set +x
      set +e
      export REGISTRY_PW="$REGISTRY_TOKEN"
      kaapana-build --scan-only $CI_EXEC_SECURITY_SCAN_ARGUMENTS --default-registry "$REGISTRY_URL"
      export SCAN_EXIT_CODE=$?
    - CONSOLIDATED="$CI_PROJECT_DIR/security-reports/consolidated_vulnerability_report.json"
    - python3 "$CI_PROJECT_DIR/ci/ci-code/clean/create_vulnerability_report.py"
        "$CONSOLIDATED"
        "$CI_PROJECT_DIR/gl-container-scanning-report.json"
        --output json
    - python3 "$CI_PROJECT_DIR/ci/ci-code/clean/create_vulnerability_report.py"
        "$CONSOLIDATED"
        "$CI_PROJECT_DIR/vulnerability_report.html"
        --output html
    - echo "Access the report at https://kaapana.pages.hzdr.de/-/kaapana/-/jobs/${CI_JOB_ID}/artifacts/vulnerability_report.html"
    - exit $SCAN_EXIT_CODE
  artifacts:
    name: "security_$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: never
    paths:
      - "$CI_PROJECT_DIR/security-reports/"
      - "$CI_PROJECT_DIR/vulnerability_report.html"
    reports:
      container_scanning: "$CI_PROJECT_DIR/gl-container-scanning-report.json"
    exclude:
      # Trivy DB cache lives inside the reports dir — not a report
      - "$CI_PROJECT_DIR/security-reports/.trivy_cache/**/*"
      - "$CI_PROJECT_DIR/security-reports/.trivy_worker_*/**/*"
