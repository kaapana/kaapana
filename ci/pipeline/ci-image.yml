spec:
  inputs:
    runner_tag:
      type: string
    builder_image:
      type: string
      description: never ci-base, or a tag bump could not bootstrap itself
    rebuild_paths:
      type: array
      default:
        - ci/images/**/*
        - ci/harvester/tasks/requirements.txt
        - ci/ci-code/integration_tests/pyproject.toml
---
# Out: $CI_BASE_IMAGE in the CI registry, used by all other jobs from the NEXT
#      pipeline on — jobs of this pipeline still run the previous tag.
##############################################
# CI IMAGE
##############################################
# Rebuilds the CI job image when its inputs change (bootstrap from an empty
# registry is a manual build+push, see README section 5). Land image changes
# with a CI_IMAGES_TAG bump — jobs pull the new tag on first use.
build_ci_image:
  stage: tests
  tags:
    - $[[ inputs.runner_tag ]]
  image: $[[ inputs.builder_image ]]
  rules:
    # changes: only has a diff basis on push/MR pipelines — it evaluates to
    # true on schedule/web/api/trigger and would rebuild every run
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop")
      changes: $[[ inputs.rebuild_paths ]]
      when: on_success
    - when: never
  script:
    - |
      set +x
      # # DOCKER_AUTH_CONFIG shadows CLI logins, unset it so build/scan pushes use their logins
      unset DOCKER_AUTH_CONFIG
      echo "$CI_REGISTRY_TOKEN" | docker login "$CI_REGISTRY_URL" -u "$CI_REGISTRY_USER" --password-stdin
    # context is ci/, not the repo root (no .dockerignore exists)
    - docker build --build-arg http_proxy="$HTTP_PROXY" --build-arg https_proxy="$HTTPS_PROXY"
        -f ci/images/ci-base/Dockerfile -t "$CI_BASE_IMAGE" ci
    - docker push "$CI_BASE_IMAGE"
  after_script:
    # don't leave docker login sessions on the shared runner
    - docker logout "$CI_REGISTRY_URL" || true
