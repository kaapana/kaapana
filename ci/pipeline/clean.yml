spec:
  inputs:
    exec_deploy:
      type: boolean
    exec_destroy_delayed:
      type: boolean
    runner_tag:
      type: string
---
# Stage: clean — VM teardown + failure notification
# In:  deployment.env dotenv (VM_FQDN); job statuses via needs;
#      HARVESTER_KUBECONFIG (File-type CI variable)
# Out: VM + PVCs deleted; on develop failures a GitLab issue + Slack message
#      (after a failing run the kept VM is left to the sweep, see maintenance.yml)
# #############################################
# ############## CLEAN ########################
# #############################################
destroy_deployment:
  stage: clean
  interruptible: false
  timeout: 1 hour
  # The needs list is the teardown barrier: with `when: always` this starts
  # once every listed job is terminal. Jobs that use the deployment VM must be
  # listed here (optional: true keeps reduced pipeline shapes valid).
  needs:
    - job: prepare_deployment
      artifacts: true
    - { job: server_installation, optional: true, artifacts: false }
    - { job: platform_deployment, optional: true, artifacts: false }
    - { job: setup_integration_tests, optional: true, artifacts: false }
    - { job: scan_ports, optional: true, artifacts: false }
    - { job: first_login, optional: true, artifacts: false }
    - { job: install_extensions, optional: true, artifacts: false }
    - { job: send_data, optional: true, artifacts: false }
    - { job: run_workflows, optional: true, artifacts: false }
    - { job: playwright_ui_tests, optional: true, artifacts: false }
  rules:
    # Never destroy externally-provided VMs
    - if: '$DEPLOYMENT_INSTANCE_FQDN != ""'
      when: never
    # Opt-in delayed destruction (e.g. keep VM alive to inspect after success).
    # A failing run skips this job, and the sweep collects the VM instead.
    - if: '"$[[ inputs.exec_deploy ]]" == "true" && "$[[ inputs.exec_destroy_delayed ]]" == "true"'
      when: delayed
      start_in: 4 hours
    # Default: always destroy (on success and on failure)
    - if: '"$[[ inputs.exec_deploy ]]" == "true"'
      when: always
    - when: never
  tags:
    - $[[ inputs.runner_tag ]]
  image: $CI_BASE_IMAGE
  script:
    - ansible-playbook -i localhost, "$CI_PROJECT_DIR/ci/ci-code/deploy/delete_harvester_vm.yaml"

if_ci_failing:
  stage: clean
  tags:
    - $[[ inputs.runner_tag ]]
  image: $CI_BASE_IMAGE
  dependencies:
    - preflight_target
    - build_packages
    - server_installation
    - platform_deployment
    - scan_ports
    - first_login
    - install_extensions
    - send_data
    - run_workflows
    - sweep_deployment_vms
  script:
    - mkdir -p "$ARTIFACTS_DIR"
    # move build.log into the dir the ticket script scans for *.log
    - '[[ -f "$CI_PROJECT_DIR/build/build.log" ]] && cp "$CI_PROJECT_DIR/build/build.log" "$ARTIFACTS_DIR/" || true'
    - cd "$CI_PROJECT_DIR/ci/ci-code/clean"
    - python3 create_ticket_if_ci_failed.py
    - python3 notify_slack.py
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $DEPLOYMENT_INSTANCE_FQDN == ""
      when: on_failure

