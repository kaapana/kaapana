spec:
  inputs:
    exec_deploy:
    exec_server_installation:
    exec_redeploy:
    build_arguments:
    runner_tag:
    playbook_dir:
      default: ci/ci-code/deploy
    max_fqdn_length:
      type: number
      default: 57
      description: dcmsend rejects longer peerhosts
---
# Out: artifacts/deployment.env (dotenv: VM_FQDN, VM_USER, VERSION_TAG), the
#      single source of "where is the test system" for every later stage.
#      server_installation (sudo) and target_readiness (no sudo) exclude each
#      other, selected by CI_EXEC_SERVER_INSTALLATION.
##############################################
# DEPLOY
##############################################

.remote_execution_template:
  tags:
    - $[[ inputs.runner_tag ]]
  # Everything these jobs need is baked into the CI image. VM_FQDN / VM_USER /
  # VERSION_TAG arrive via the deployment.env dotenv from prepare_deployment.
  image: $CI_BASE_IMAGE
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"
    CI_EXEC_REDEPLOY: "$[[ inputs.exec_redeploy ]]" # read by the playbooks
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    # ssh refuses group/world-readable keys; File variables arrive too open
    - chmod 600 "$CI_SSH_PRIVATE_KEY"

##############################################

prepare_deployment:
  # Clone repo + Optional: Provision VM
  interruptible: false
  extends: .remote_execution_template
  rules:
    - if: '"$[[ inputs.exec_deploy ]]" == "true"'
      when: on_success
    - when: never
  stage: deploy
  variables:
    GIT_STRATEGY: "clone"
    GIT_DEPTH: "0" # full history + tags for git describe — global depth 1 would shallow the clone
  script:
    # Resolve the version this pipeline deploys, once, for every later job.
    # Must equal what build_packages pushed — same git describe formula.
    - git fetch --tags
    - VERSION_TAG=$(git describe --tags --always)
    - |
      if [[ "$[[ inputs.build_arguments ]]" =~ (--latest) && "$VERSION_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        BASE_TAG=$(echo "$VERSION_TAG" | sed -E 's/-[0-9]+-g[0-9a-f]+.*//')
        VERSION_TAG="${BASE_TAG}-latest"
      fi
    - echo "Resolved VERSION_TAG=$VERSION_TAG"

    # Fail fast if the chart was never pushed — before any VM is created.
    - |
      set +x
      helm registry login "${REGISTRY_URL%%/*}" -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN" >/dev/null 2>&1
      if ! helm show chart "oci://$REGISTRY_URL/kaapana-admin-chart" --version "$VERSION_TAG" >/dev/null; then
        echo "ERROR: kaapana-admin-chart '$VERSION_TAG' not found in $REGISTRY_URL — was this commit built and pushed?"
        exit 1
      fi

    - mkdir -p artifacts
    - |
      if [[ -z "$DEPLOYMENT_INSTANCE_FQDN" ]]; then
        ansible-playbook -i localhost, "$CI_PROJECT_DIR/$[[ inputs.playbook_dir ]]/provision_harvester_vm.yaml"
      else
        # dcmsend rejects peerhosts > 57 chars — fail now, not mid-tests
        if [[ ${#DEPLOYMENT_INSTANCE_FQDN} -gt $[[ inputs.max_fqdn_length ]] ]]; then
          echo "ERROR: DEPLOYMENT_INSTANCE_FQDN '${DEPLOYMENT_INSTANCE_FQDN}' is ${#DEPLOYMENT_INSTANCE_FQDN} characters, exceeding the $[[ inputs.max_fqdn_length ]]-character dcmsend peerhost limit."
          exit 1
        fi
        echo "Skipping VM provisioning and using existing deployment target: $DEPLOYMENT_INSTANCE_FQDN"
        echo "VM_FQDN=$DEPLOYMENT_INSTANCE_FQDN" > artifacts/deployment.env
        echo "VM_USER=$DEPLOYMENT_INSTANCE_USER" >> artifacts/deployment.env
      fi
    - echo "VERSION_TAG=$VERSION_TAG" >> artifacts/deployment.env

  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - artifacts/deployment.env
    reports:
      dotenv: artifacts/deployment.env

##############################################

server_installation:
  extends: .remote_execution_template
  stage: deploy
  # The only job needing sudo on the target. CI_EXEC_SERVER_INSTALLATION=false
  # skips it for already-prepared targets (e.g. local workstations).
  rules:
    - if: '"$[[ inputs.exec_deploy ]]" == "true" && "$[[ inputs.exec_server_installation ]]" == "true"'
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
  script:
    - |
      ansible-playbook "$CI_PROJECT_DIR/$[[ inputs.playbook_dir ]]/server_installation.yaml" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$CI_SSH_PRIVATE_KEY"
  artifacts:
    expire_in: 2 weeks
    paths:
      - "artifacts/server_installation.log"
      - "artifacts/target_readiness.json"
      - "artifacts/target_readiness.log"
    when: always
    access: developer

##############################################

target_readiness:
  extends: .remote_execution_template
  stage: deploy
  # Runs when server_installation is skipped. Read-only, needs no root on the
  # target. Only for a provisioned Harvester VM: a target given by FQDN exists
  # before the pipeline starts and was already checked by preflight_target.
  rules:
    - if: '"$[[ inputs.exec_deploy ]]" == "true" && "$[[ inputs.exec_server_installation ]]" != "true" && $DEPLOYMENT_INSTANCE_FQDN == ""'
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
  script:
    - |
      if [ -z "$VM_FQDN" ]; then
        echo "ERROR: VM_FQDN is empty. No deployment target."
        exit 1
      fi
    - |
      ansible-playbook "$CI_PROJECT_DIR/$[[ inputs.playbook_dir ]]/target_readiness.yaml" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$CI_SSH_PRIVATE_KEY"
  artifacts:
    expire_in: 2 weeks
    paths:
      - "artifacts/target_readiness.json"
      - "artifacts/target_readiness.log"
    when: always
    expose_as: "Kaapana Target Readiness"

##############################################

platform_deployment:
  extends: .remote_execution_template
  stage: deploy
  needs:
    - job: server_installation
      optional: true
    - job: target_readiness
      optional: true
    - job: preflight_target
      optional: true
    - job: prepare_deployment
      artifacts: true
  script:
    - |
      if [ -z "$VM_FQDN" ]; then
        echo "ERROR: VM_FQDN is empty. No deployment target."
        exit 1
      fi
    - |
      ansible-playbook "$CI_PROJECT_DIR/$[[ inputs.playbook_dir ]]/deploy_platform.yaml" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$CI_SSH_PRIVATE_KEY"

    - echo "Kaapana Platform Deployed Successfully"
    - echo "Access the platform at https://$VM_FQDN"
    - |
      echo "<html>
      <body>
      <h1>Kaapana Platform Deployed</h1>
      <p>Access it here: <a href=\"https://$VM_FQDN\">https://$VM_FQDN</a></p>
      </body>
      </html>" > artifacts/deployment.html
  rules:
    - if: '"$[[ inputs.exec_deploy ]]" == "true"'
      when: on_success
    - when: never
  artifacts:
    expire_in: 2 weeks
    paths:
      - "artifacts/deployment.log"
      - "artifacts/undeploy.log"
      - "artifacts/system_check.log"
      - "artifacts/system_check.json"
      - "artifacts/deployment.html"
    when: always
    expose_as: "Kaapana Deployment Report"
