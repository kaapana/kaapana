spec:
  inputs:
    exec_integration_tests:
      type: boolean
    exec_deploy:
      type: boolean
    runner_tag:
      type: string
    tests_dir:
      type: string
      default: ci/ci-code/integration_tests
    allowed_ports:
      type: string
      default: 22,80,443
---
# Out: platform state mutations passed along the first_login →
#      install_extensions → send_data → run_workflows chain, on top of the
#      JUnit and log artifacts.
##############################################
# INTEGRATION TESTS
##############################################
setup_integration_tests:
  extends: .remote_execution_template
  stage: test
  tags:
    - $[[ inputs.runner_tag ]]
  needs:
    - job: prepare_deployment
      artifacts: true
    - platform_deployment
  rules:
    - if: '"$[[ inputs.exec_integration_tests ]]" == "true" && "$[[ inputs.exec_deploy ]]" == "true"'
      when: on_success
    - when: never
  script:
    - |
      ansible-playbook "$CI_PROJECT_DIR/$[[ inputs.tests_dir ]]/remote_execution/setup_integration_tests.yaml" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$CI_SSH_PRIVATE_KEY"
  artifacts:
    expire_in: 2 weeks
    reports:
      dotenv:
        - artifacts/integration_test_setup.env
    access: developer

##############################################
# Local pytest execution template
##############################################
.integration_test_local:
  extends: .remote_execution_template
  stage: test
  rules:
    - if: '"$[[ inputs.exec_integration_tests ]]" == "true" && "$[[ inputs.exec_deploy ]]" == "true"'
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
    - job: setup_integration_tests
      artifacts: true
    - platform_deployment
  variables:
    PYTEST_ARGS: "--client-secret $CLIENT_SECRET --host $VM_FQDN --allowed-ports $[[ inputs.allowed_ports ]] --download-directory $CI_PROJECT_DIR/downloaded_test_data"
  script:
    # deps are baked into the job image; this only registers the repo's
    # current test code
    - pip install --no-deps -e "$CI_PROJECT_DIR/$[[ inputs.tests_dir ]]"
    - |
      python3 -m pytest -n "${PYTEST_WORKERS:-auto}" --dist "${PYTEST_DIST:-load}" \
        -s "$CI_PROJECT_DIR/$PYTEST_FILE" $PYTEST_ARGS \
        --junitxml="$ARTIFACTS_DIR/$JUNIT_FILE" | tee "$ARTIFACTS_DIR/$LOG_FILE"
  artifacts:
    expire_in: 2 weeks
    paths:
      - "$ARTIFACTS_DIR/$JUNIT_FILE"
      - "$ARTIFACTS_DIR/$LOG_FILE"
    reports:
      junit: ["$ARTIFACTS_DIR/$JUNIT_FILE"]

##############################################

scan_ports:
  extends: .integration_test_local
  variables:
    PYTEST_FILE: "$[[ inputs.tests_dir ]]/tests/test_scan_ports.py"
    JUNIT_FILE: "scan_ports.xml"
    LOG_FILE: "scan_ports.log"

first_login:
  extends: .integration_test_local
  variables:
    PYTEST_FILE: "$[[ inputs.tests_dir ]]/tests/test_first_login.py"
    JUNIT_FILE: "first_login.xml"
    LOG_FILE: "first_login.log"

install_extensions:
  extends: .integration_test_local
  needs:
    - job: prepare_deployment
      artifacts: true
    - job: setup_integration_tests
      artifacts: true
    - first_login
    - platform_deployment
    - playwright_ui_tests
  variables:
    PYTEST_FILE: "$[[ inputs.tests_dir ]]/tests/test_install_extensions.py"
    JUNIT_FILE: "install_extensions.xml"
    LOG_FILE: "install_extensions.log"
    PYTEST_WORKERS: "4"
  retry: 2

send_data:
  extends: .integration_test_local
  needs:
    - job: prepare_deployment
      artifacts: true
    - job: setup_integration_tests
      artifacts: true
    - first_login
    - install_extensions
  variables:
    PYTEST_FILE: "$[[ inputs.tests_dir ]]/tests/test_send_data.py"
    JUNIT_FILE: "send_data.xml"
    LOG_FILE: "send_data.log"
    PYTEST_WORKERS: "4"
  retry: 2

run_workflows:
  extends: .integration_test_local
  timeout: 2 hours
  allow_failure: true
  needs:
    - job: prepare_deployment
      artifacts: true
    - job: setup_integration_tests
      artifacts: true
    - first_login
    - send_data
    - install_extensions
  variables:
    PYTEST_FILE: "$[[ inputs.tests_dir ]]/tests/test_run_workflows.py"
    JUNIT_FILE: "run_workflow.xml"
    LOG_FILE: "run_workflow.log"
    PYTEST_WORKERS: "4"
    PYTEST_DIST: "loadgroup"

playwright_ui_tests:
  extends: .remote_execution_template
  stage: test
  rules:
    - if: '"$[[ inputs.exec_integration_tests ]]" == "true" && "$[[ inputs.exec_deploy ]]" == "true"'
      when: on_success
    - when: never
  needs:
    - job: prepare_deployment
      artifacts: true
    - platform_deployment
    - first_login
  script:
    - cd "$CI_PROJECT_DIR/tests/ui"
    - npm ci
    # chromium system libs are in the image; only the browser binary matching
    # the npm-pinned playwright version is fetched here
    - npx playwright install chromium
    - |
      KAAPANA_TEST_INSTANCE_UI="https://$VM_FQDN" \
        npx playwright test \
          --project auth-setup \
          --project project-management \
          --workers 1
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - tests/ui/playwright-report/
      - tests/ui/test-results/
    expose_as: "Playwright UI Report"
    reports:
      junit: tests/ui/test-results/junit.xml
