# Stage: test — integration + UI tests against the live platform
# In:  VM_FQDN / VM_USER (deployment.env dotenv, else DEPLOYMENT_INSTANCE_*);
#      CLIENT_SECRET dotenv from
#      setup_integration_tests; the live platform over HTTPS/DICOM
# Out: JUnit/log/report artifacts; platform state mutations passed along the
#      first_login → install_extensions → send_data → run_workflows chain
##############################################
# INTEGRATION TESTS
##############################################
setup_integration_tests:
  extends: .remote_execution_template
  stage: test
  tags:
    - deploy-runner
  needs:
    - job: prepare_deployment
      artifacts: true
      optional: true
    - job: platform_deployment
      optional: true
  rules:
    - if: '$CI_EXEC_INTEGRATION_TESTS == "true"'
      when: on_success
    - when: never
  script:
    - |
      if [[ -z "$VM_FQDN" ]]; then
        echo "ERROR: no deployment target. prepare_deployment did not run, so set DEPLOYMENT_INSTANCE_FQDN (and DEPLOYMENT_INSTANCE_USER) to the already-deployed platform."
        exit 1
      fi
    - |
      ansible-playbook "$CI_PROJECT_DIR/ci/ci-code/integration_tests/remote_execution/setup_integration_tests.yaml" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$CI_SSH_PRIVATE_KEY"
  artifacts:
    reports:
      dotenv:
        - artifacts/integration_test_setup.env
    access: developer

##############################################
# Local pytest execution template
##############################################
.integration_test_local:
  extends: .remote_execution_template
  stage: test
  rules:
    - if: '$CI_EXEC_INTEGRATION_TESTS == "true"'
      when: on_success
    - when: never
  needs:
    - job: setup_integration_tests
      artifacts: true
    - job: prepare_deployment
      artifacts: true
      optional: true
    - job: platform_deployment
      optional: true
  variables:
    PYTEST_ARGS: "--client-secret $CLIENT_SECRET --allowed-ports 22,80,443 --download-directory $CI_PROJECT_DIR/downloaded_test_data --test-data-cache-dir /data"
  script:
    # deps are baked into the job image; this only registers the repo's
    # current test code
    - pip install --no-deps -e "$CI_PROJECT_DIR/ci/ci-code/integration_tests"
    - |
      python3 -m pytest -n "${PYTEST_WORKERS:-auto}" --dist "${PYTEST_DIST:-load}" \
        -s "$CI_PROJECT_DIR/$PYTEST_FILE" --host "$VM_FQDN" $PYTEST_ARGS \
        --junitxml="$ARTIFACTS_DIR/$JUNIT_FILE" | tee "$ARTIFACTS_DIR/$LOG_FILE"
  artifacts:
    paths:
      - "$ARTIFACTS_DIR/$JUNIT_FILE"
      - "$ARTIFACTS_DIR/$LOG_FILE"
    reports:
      junit: ["$ARTIFACTS_DIR/$JUNIT_FILE"]

##############################################

scan_ports:
  extends: .integration_test_local
  rules:
    - if: $CI_EXEC_INTEGRATION_TEST_JOBS !~ /(^|,)\s*scan_ports\s*(,|$)/
      when: never
    - !reference [.integration_test_local, rules]
  variables:
    PYTEST_FILE: "ci/ci-code/integration_tests/tests/test_scan_ports.py"
    JUNIT_FILE: "scan_ports.xml"
    LOG_FILE: "scan_ports.log"

first_login:
  extends: .integration_test_local
  rules:
    - if: $CI_EXEC_INTEGRATION_TEST_JOBS !~ /(^|,)\s*first_login\s*(,|$)/
      when: never
    - !reference [.integration_test_local, rules]
  variables:
    PYTEST_FILE: "ci/ci-code/integration_tests/tests/test_first_login.py"
    JUNIT_FILE: "first_login.xml"
    LOG_FILE: "first_login.log"

install_extensions:
  extends: .integration_test_local
  rules:
    - if: $CI_EXEC_INTEGRATION_TEST_JOBS !~ /(^|,)\s*install_extensions\s*(,|$)/
      when: never
    - !reference [.integration_test_local, rules]
  needs:
    - job: prepare_deployment
      artifacts: true
      optional: true
    - job: setup_integration_tests
      artifacts: true
    - job: platform_deployment
      optional: true
    - job: first_login
      optional: true
    - job: playwright_ui_tests
      optional: true
  variables:
    PYTEST_FILE: "ci/ci-code/integration_tests/tests/test_install_extensions.py"
    JUNIT_FILE: "install_extensions.xml"
    LOG_FILE: "install_extensions.log"
    PYTEST_WORKERS: "4"
  retry: 2

send_data:
  extends: .integration_test_local
  rules:
    - if: $CI_EXEC_INTEGRATION_TEST_JOBS !~ /(^|,)\s*send_data\s*(,|$)/
      when: never
    - !reference [.integration_test_local, rules]
  needs:
    - job: prepare_deployment
      artifacts: true
      optional: true
    - job: setup_integration_tests
      artifacts: true
    - job: first_login
      optional: true
    - job: install_extensions
      optional: true
  variables:
    PYTEST_FILE: "ci/ci-code/integration_tests/tests/test_send_data.py"
    JUNIT_FILE: "send_data.xml"
    LOG_FILE: "send_data.log"
    PYTEST_WORKERS: "0"
  retry: 2

run_workflows:
  extends: .integration_test_local
  timeout: 2 hours
  allow_failure: true
  rules:
    - if: $CI_EXEC_INTEGRATION_TEST_JOBS !~ /(^|,)\s*run_workflows\s*(,|$)/
      when: never
    - !reference [.integration_test_local, rules]
  needs:
    - job: prepare_deployment
      artifacts: true
      optional: true
    - job: setup_integration_tests
      artifacts: true
    - job: first_login
      optional: true
    - job: send_data
      optional: true
    - job: install_extensions
      optional: true
  variables:
    PYTEST_FILE: "ci/ci-code/integration_tests/tests/test_run_workflows.py"
    JUNIT_FILE: "run_workflow.xml"
    LOG_FILE: "run_workflow.log"
    PYTEST_WORKERS: "4"
    PYTEST_DIST: "loadgroup"

playwright_ui_tests:
  extends: .remote_execution_template
  stage: test
  rules:
    - if: $CI_EXEC_INTEGRATION_TEST_JOBS !~ /(^|,)\s*playwright_ui_tests\s*(,|$)/
      when: never
    - !reference [.integration_test_local, rules]
  needs:
    - job: prepare_deployment
      artifacts: true
      optional: true
    - job: platform_deployment
      optional: true
    - job: first_login
      optional: true
  script:
    - cd "$CI_PROJECT_DIR/tests/ui"
    - npm ci
    # chromium system libs are in the image; only the browser binary matching
    # the npm-pinned playwright version is fetched here
    - npx playwright install chromium
    - |
      KAAPANA_TEST_INSTANCE_UI="https://$VM_FQDN" \
        npx playwright test \
          --project auth-setup \
          --project project-management \
          --workers 1
  artifacts:
    when: always
    paths:
      - tests/ui/playwright-report/
      - tests/ui/test-results/
    expose_as: "Playwright UI Report"
    reports:
      junit: tests/ui/test-results/junit.xml
