spec:
  inputs:
    exec_lint:
      type: boolean
    runner_tag:
      type: string
---
# Stage: tests — one matrix job per linter
# In:  the job's own checkout
# Out: each linter fails on formatting drift or an enforced rule, and
#      publishes its advisory findings to the MR Code Quality widget
##############################################
# Lint: one matrix entry per linter
##############################################
# The same commands run locally; see docs/source/development_guide/code_formatting.rst.
lint:
  stage: tests
  tags:
    - $[[ inputs.runner_tag ]]
  image: $CI_BASE_IMAGE
  rules:
    - if: '"$[[ inputs.exec_lint ]]" == "true" && $LINTER == "ui"'
      when: on_success
      allow_failure: true
    - if: '"$[[ inputs.exec_lint ]]" == "true"'
      when: on_success
    - when: never
  variables:
    # Bump together with the rev in .pre-commit-config.yaml.
    # renovate: datasource=pypi depName=ruff
    RUFF_VERSION: "0.16.4"
  parallel:
    matrix:
      - LINTER:
          - ruff
          - ui
  script:
    - |
      case "$LINTER" in
        ruff)
          grep -q "rev: v$RUFF_VERSION" .pre-commit-config.yaml
          pip install --no-cache-dir "ruff==$RUFF_VERSION"
          ruff check --config ci/ruff-quality.toml --output-format=gitlab --exit-zero . > gl-code-quality-report.json
          ruff check --config ci/ruff-quality.toml --statistics --exit-zero .
          ruff format --check --diff .
          ruff check --output-format=full .
          ;;
        ui)
          ci/ci-code/lint/ui_lint.sh
          ;;
        *)
          echo "unknown LINTER: $LINTER"
          exit 1
          ;;
      esac
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json

##############################################
# Helm lint: helm lint + kubeval of the platform chart tree — blocks the pipeline
##############################################
helm_lint:
  stage: tests
  tags:
    - $[[ inputs.runner_tag ]]
  image: $CI_BASE_IMAGE
  timeout: 15m
  rules:
    - if: '"$[[ inputs.exec_lint ]]" == "true"'
      when: on_success
    - when: never
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  before_script:
    - git fetch --tags
    - pip install -e build_cli/
  script:
    - kaapana-build --lint-only --kaapana-dir "$CI_PROJECT_DIR"
  artifacts:
    when: always
    paths:
      - build/build.log
