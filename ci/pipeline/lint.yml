spec:
  inputs:
    exec_lint:
      type: boolean
    runner_tag:
      type: string
---
# Stage: unittest — one matrix job per linter
# In:  the job's own checkout
# Out: each linter fails on formatting drift or an enforced rule, and
#      publishes its advisory findings to the MR Code Quality widget
##############################################
# Lint: one matrix entry per linter
##############################################
# The same commands run locally; see docs/source/development_guide/code_formatting.rst.
lint:
  stage: unittest
  tags:
    - $[[ inputs.runner_tag ]]
  image: $CI_BASE_IMAGE
  rules:
    - if: '"$[[ inputs.exec_lint ]]" == "true" && $LINTER == "ui"'
      when: on_success
      allow_failure: true
    - if: '"$[[ inputs.exec_lint ]]" == "true" && $LINTER == "helm"'
      when: on_success
      allow_failure: true
      variables:
        GIT_STRATEGY: clone
        GIT_DEPTH: "0"
    - if: '"$[[ inputs.exec_lint ]]" == "true"'
      when: on_success
    - when: never
  variables:
    # Bump together with the rev in .pre-commit-config.yaml.
    # renovate: datasource=pypi depName=ruff
    RUFF_VERSION: "0.16.4"
    HADOLINT_VERSION: "2.15.1"
  parallel:
    matrix:
      - LINTER:
          - ruff
          - ui
          - hadolint
          - helm
  script:
    - ci/ci-code/lint/${LINTER}_lint.sh
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
      junit: helm-reports/*.xml
    paths:
      - gl-code-quality-report.json
      - build/helm-lint/build.log

