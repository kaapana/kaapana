spec:
  inputs:
    exec_lint:
      type: boolean
    runner_tag:
      type: string
---
# Stage: tests — lint report + Code Quality report + helm lint
# In:  the job's own checkout
# Out: `lint` fails on formatting drift or an enforced ruff rule,
#      `helm_lint` on a chart that does not lint or kubeval
##############################################
# RUFF
##############################################
.ruff_template:
  stage: tests
  tags:
    - $[[ inputs.runner_tag ]]
  image: python:3.12
  rules:
    - if: '"$[[ inputs.exec_lint ]]" == "true"'
      when: on_success
    - when: never
  variables:
    # Bump together with the rev in .pre-commit-config.yaml.
    RUFF_VERSION: "0.16.4"
  before_script:
    - 'grep -q "rev: v$RUFF_VERSION" .pre-commit-config.yaml'
    - pip install --no-cache-dir "ruff==$RUFF_VERSION"

##############################################
# Lint: formatting + the enforced rules from ruff.toml — blocks the pipeline
##############################################
lint:
  extends: .ruff_template
  script:
    # check only — run `ruff format .` locally to fix
    - ruff format --check --diff .
    - ruff check --output-format=full .

##############################################
# Code Quality report — advisory, never fails
##############################################
code_quality:
  extends: .ruff_template
  script:
    - ruff check --config ci/ruff-quality.toml --output-format=gitlab --exit-zero . > gl-code-quality-report.json
    # same findings, in the job log
    - ruff check --config ci/ruff-quality.toml --statistics --exit-zero .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    # available in the job's artifacts via API
    paths:
      - gl-code-quality-report.json

##############################################
# Helm lint: helm lint + kubeval of the platform chart tree — blocks the pipeline
##############################################
helm_lint:
  stage: tests
  tags:
    - $[[ inputs.runner_tag ]]
  image: $CI_BASE_IMAGE
  timeout: 15m
  rules:
    - if: '"$[[ inputs.exec_lint ]]" == "true"'
      when: on_success
    - when: never
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  before_script:
    - git fetch --tags
    - pip install -e build_cli/
  script:
    - kaapana-build --lint-only --kaapana-dir "$CI_PROJECT_DIR"
  artifacts:
    when: always
    paths:
      - build/build.log
