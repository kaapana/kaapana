spec:
  inputs:
    exec_lint:
      type: boolean
    runner_tag:
      type: string
---
# Stage: tests — one matrix job per linter + helm lint
# In:  the job's own checkout
# Out: each linter fails on formatting drift or an enforced rule, and
#      publishes its advisory findings to the MR Code Quality widget
##############################################
# Lint: one matrix entry per linter
##############################################
# The same commands run locally; see docs/source/development_guide/code_formatting.rst.
lint:
  stage: tests
  tags:
    - $[[ inputs.runner_tag ]]
  image: $CI_BASE_IMAGE
  rules:
    - if: '"$[[ inputs.exec_lint ]]" == "true" && $LINTER == "ui"'
      when: on_success
      allow_failure: true
    - if: '"$[[ inputs.exec_lint ]]" == "true"'
      when: on_success
    - when: never
  parallel:
    matrix:
      - LINTER:
          - ruff
          - ui
  script:
    - ci/ci-code/lint/${LINTER}_lint.sh
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json

##############################################
# Helm lint: helm lint + kubeval of the platform chart tree — blocks the pipeline
##############################################
helm_lint:
  stage: tests
  tags:
    - $[[ inputs.runner_tag ]]
  image: $CI_BASE_IMAGE
  timeout: 15m
  rules:
    - if: '"$[[ inputs.exec_lint ]]" == "true"'
      when: on_success
    - when: never
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  before_script:
    - git fetch --tags
    - pip install -e build_cli/
  script:
    - kaapana-build --lint-only --kaapana-dir "$CI_PROJECT_DIR"
  artifacts:
    when: always
    paths:
      - build/build.log
