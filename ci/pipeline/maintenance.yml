# Stage: maintenance - housekeeping that belongs to no single pipeline
# In:  HARVESTER_KUBECONFIG and GITLAB_READ_API_TOKEN (project variables)
# Out: artifacts/vm_sweep.log, which is what if_ci_failing collects
##############################################
# MAINTENANCE
##############################################
sweep_deployment_vms:
  stage: maintenance
  # Deletes deployment VMs whose pipeline has ended: the leak GitLab's
  # non-cascading retries leave behind (README section 3).
  needs: []
  interruptible: false
  # A large backlog can outlast this; the next run picks up what is left.
  timeout: 1 hour
  rules:
    - if: '$CI_EXEC_VM_SWEEP == "true"'
      when: always
    - when: never
  tags:
    - deploy-runner
  image: $CI_BASE_IMAGE
  script:
    - mkdir -p "$ARTIFACTS_DIR"
    - |
      set -o pipefail
      ARGS=(--grace-hours "$VM_SWEEP_GRACE_HOURS"
            --max-age-hours "$VM_SWEEP_MAX_AGE_HOURS"
            --keep-hours "$VM_SWEEP_KEEP_HOURS")
      [[ "$VM_SWEEP_APPLY" == "true" ]] && ARGS+=(--apply)
      python3 "$CI_PROJECT_DIR/ci/ci-code/clean/sweep_deployment_vms.py" "${ARGS[@]}" \
        | tee "$ARTIFACTS_DIR/vm_sweep.log"
  artifacts:
    when: always
    paths:
      - artifacts/vm_sweep.log
