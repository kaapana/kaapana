spec:
  inputs:
    exec_build:
      type: boolean
    exec_deploy:
      type: boolean
    exec_server_installation:
      type: boolean
    exec_redeploy:
      type: boolean
    runner_tag:
      type: string
---
# Stage: preflight — cheap checks that need nothing built
# In:  CI/CD variables, and the deployment target when one is given by FQDN
# Out: nothing — the readiness table is in the job log, and a run aimed at a
#      given FQDN is never reported by the clean stage
##############################################
# PREFLIGHT
##############################################
preflight_variables:
  stage: preflight
  tags:
    - $[[ inputs.runner_tag ]]
  image: python:3.12
  variables:
    GIT_STRATEGY: none # no checkout needed
    CI_EXEC_BUILD: "$[[ inputs.exec_build ]]"
    CI_EXEC_DEPLOY: "$[[ inputs.exec_deploy ]]"
  rules:
    - when: always
  script:
    - |
      # print only variable names, not the values (several are secrets)
      missing=""
      errors=""
      checked=""
      require() {
        checked="$checked $1"
        [ -n "${!1:-}" ] || missing="$missing $1"
      }
      require_file() {
        # File-type variable: the value is a file path; the file must
        # exist and not be empty
        checked="$checked $1(File)"
        { [ -n "${!1:-}" ] && [ -s "${!1}" ]; } || missing="$missing $1(File)"
      }
      fail() {
        errors="$errors
        - $1"
      }

      # every job pulls the ci-base image from this registry
      require CI_REGISTRY_URL
      require CI_IMAGES_TAG
      require DOCKER_AUTH_CONFIG
      require CI_REGISTRY_USER
      require CI_REGISTRY_TOKEN
      if [ "${CI_REGISTRY_USER:-}" = "gitlab-ci-token" ]; then
        fail "CI_REGISTRY_USER is 'gitlab-ci-token' — the project variable is missing, so pushes will be denied."
      fi
      # DOCKER_AUTH_CONFIG must contain the registry host, otherwise
      # image pulls fail (see ci/docs/internals.md#registries)
      if [ -n "${DOCKER_AUTH_CONFIG:-}" ] && [ -n "${CI_REGISTRY_URL:-}" ]; then
        registry_host="${CI_REGISTRY_URL%%/*}"
        case "$DOCKER_AUTH_CONFIG" in
          *"$registry_host"*) ;;
          *) fail "DOCKER_AUTH_CONFIG has no entry for '$registry_host' (the CI_REGISTRY_URL host)." ;;
        esac
      fi

      # build and deploy need the registry credentials
      if [ "$CI_EXEC_BUILD" = "true" ] || [ "$CI_EXEC_DEPLOY" = "true" ]; then
        require REGISTRY_URL
        require REGISTRY_USER
        require REGISTRY_TOKEN
      fi
      if [ -n "${DOCKER_IO_USER:-}" ] && [ -z "${DOCKER_IO_PASSWORD:-}" ]; then
        fail "DOCKER_IO_USER is set but DOCKER_IO_PASSWORD is empty — leave both empty to skip the docker.io login."
      fi

      # A git tag like "0.7.1" starts a release pipeline
      # build_packages then publishes to the release registry using RELEASE_REGISTRY_* var.s
      # The tag pattern below is a copy of the one in build.yml
      if [[ "${CI_COMMIT_TAG:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        require RELEASE_REGISTRY_URL
        require RELEASE_REGISTRY_USER
        require RELEASE_REGISTRY_TOKEN
      fi

      # Registry credentials are scoped to this environment; a typo means the
      # jobs get no credentials at all (environment: name: $REGISTRY_ENV).
      if [ "$CI_EXEC_BUILD" = "true" ] || [ "$CI_EXEC_DEPLOY" = "true" ]; then
        require REGISTRY_ENV
      fi

      if [ "$CI_EXEC_DEPLOY" = "true" ]; then
        require_file DEPLOYMENT_INSTANCE_SSH_KEY
        require DEPLOYMENT_INSTANCE_USER
        require DEPLOYMENT_INSTANCE_PLATFORM_PREFIX
        if [ -n "${DEPLOYMENT_INSTANCE_PLATFORM_PREFIX:-}" ]; then
          if ! [[ "$DEPLOYMENT_INSTANCE_PLATFORM_PREFIX" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            fail "DEPLOYMENT_INSTANCE_PLATFORM_PREFIX '$DEPLOYMENT_INSTANCE_PLATFORM_PREFIX' is not a DNS-1123 label (lowercase alphanumerics and hyphens, must start and end alphanumeric)."
          elif [ "${#DEPLOYMENT_INSTANCE_PLATFORM_PREFIX}" -gt 46 ]; then
            fail "DEPLOYMENT_INSTANCE_PLATFORM_PREFIX is ${#DEPLOYMENT_INSTANCE_PLATFORM_PREFIX} characters, over the 46 that keep project namespaces within the 63-character k8s limit."
          fi
        fi
        if [ -z "$DEPLOYMENT_INSTANCE_FQDN" ]; then
          require_file HARVESTER_KUBECONFIG
          require DEPLOYMENT_INSTANCE_DOMAIN
          require DEPLOYMENT_INSTANCE_HARVESTER_NAMESPACE
        fi
        # dcmsend rejects peerhosts longer than 57 chars; prepare_deployment
        # checks this too, but only after the whole build stage has run
        if [ -n "${DEPLOYMENT_INSTANCE_FQDN:-}" ] && [ "${#DEPLOYMENT_INSTANCE_FQDN}" -gt 57 ]; then
          fail "DEPLOYMENT_INSTANCE_FQDN is ${#DEPLOYMENT_INSTANCE_FQDN} characters, over the 57-character dcmsend peerhost limit."
        fi
      fi

      # failures on develop create a GitLab issue and a Slack message
      if [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        require GITLAB_API_TOKEN
        require SLACK_BOT_TOKEN
        require SLACK_CHANNEL_ID
      fi

      # check_readthedocs runs on scheduled develop pipelines only
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        require KAAPANA_READTHEDOCS_TOKEN
      fi

      echo "Checked variables (this pipeline):"
      for v in $checked; do echo "  - $v"; done
      if [ -n "$missing" ] || [ -n "$errors" ]; then
        [ -z "$missing" ] || echo "ERROR: required CI variables are empty or missing: $missing"
        [ -z "$errors" ] || echo "ERROR: $errors"
        echo "Fix them under Settings -> CI/CD -> Variables (see ci/docs/internals.md#registries)."
        exit 1
      fi
      echo "Preflight OK: all required CI variables are set."

##############################################
preflight_target:
  stage: preflight
  tags:
    - $[[ inputs.runner_tag ]]
  image: $CI_BASE_IMAGE
  rules:
    - if: '"$[[ inputs.exec_deploy ]]" == "true" && $DEPLOYMENT_INSTANCE_FQDN != ""'
      when: on_success
    - when: never
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"
    ANSIBLE_FORCE_COLOR: "true"
    VM_FQDN: "$DEPLOYMENT_INSTANCE_FQDN"
    VM_USER: "$DEPLOYMENT_INSTANCE_USER"
    CI_EXEC_REDEPLOY: "$[[ inputs.exec_redeploy ]]"
    CI_EXEC_SERVER_INSTALLATION: "$[[ inputs.exec_server_installation ]]"
  needs:
    - job: preflight_variables
      artifacts: false
  before_script: !reference [.remote_execution_template, before_script]
  script:
    - |
      ansible-playbook "$CI_PROJECT_DIR/ci/ci-code/deploy/target_readiness.yaml" \
        -i "$VM_FQDN," \
        -u "$VM_USER" \
        --private-key "$DEPLOYMENT_INSTANCE_SSH_KEY"
  # the table, in color; after_script runs even when the playbook failed
  after_script:
    - cat "$ARTIFACTS_DIR/target_readiness.log" 2>/dev/null || true
  artifacts:
    expire_in: 2 weeks
    paths:
      - "artifacts/target_readiness.log"
      - "artifacts/target_readiness.json"
    when: always
    access: developer
