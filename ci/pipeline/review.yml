spec:
  inputs:
    exec_mr_review:
      type: boolean
---
# Stage: .post — advisory LLM review of the merge request
# In:  the MR diff and linked issues via the GitLab API; BLABLADOR_API_TOKEN, GITLAB_API_TOKEN
# Out: one MR note, written once per MR with the "AI Review" label or by the manual mr_review_rerun; never fails the pipeline
.mr_review_template:
  stage: .post
  needs: []
  tags:
    - x86_64
  image: python:3.12-slim
  timeout: 20 minutes
  allow_failure: true
  variables:
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    NO_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    no_proxy: ""
  before_script:
    - pip install --no-cache-dir python-gitlab==7.1.0 requests==2.32.5
  script:
    - cd "$CI_PROJECT_DIR/ci/ci-code/review"
    - python3 review_mr.py

mr_review:
  extends: .mr_review_template
  rules:
    - if: '"$[[ inputs.exec_mr_review ]]" == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)AI Review(,|$)/'
      when: on_success
    - when: never

mr_review_rerun:
  extends: .mr_review_template
  variables:
    MR_REVIEW_FORCE: "true"
  rules:
    - if: '"$[[ inputs.exec_mr_review ]]" == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: never
