# Stage: security — trivy scan + report of the tag this commit resolves to
# In:  registry state — either just pushed by build_packages in this same
#      pipeline, or pushed by an earlier one (CI_EXEC_BUILD=false: standalone
#      rescan of an already-built tag); REGISTRY_* credentials via
#      .build_cli_env (defined in build.yml)
# Out: security-reports/ (raw per-container/per-snap scans, misconfig, SBOMs,
#      trivy cache) as persistent artifacts; the dashboard-facing subset —
#      consolidated_vulnerability_scan.json, interactive_report.html,
#      gl-container-scanning-report.json (always), consolidated_misconfiguration_check.json
#      and consolidated_sbom.json (opt-in) — published together to reports/ by
#      ci/ci-code/clean/run_security_scan.sh. That script is the single source
#      of truth for "scan + consolidate + publish"; this job just calls it,
#      and you can run it by hand for a pure-local scan (see ci/README.md).
##############################################
# SECURITY
##############################################
security_scan:
  extends: .build_cli_env
  stage: security
  timeout: 6 hours
  tags:
    - security-runner
  needs:
    - job: build_packages
      artifacts: false
      # If build in the pipeline then wait for build, scan nevertheless;
      optional: true
  rules:
    - if: '$CI_EXEC_SECURITY_SCAN == "true"'
      when: on_success
    - when: never
  # Trivy DB persisted across runs on this runner:
  cache:
    key: trivy-db
    paths:
      - "$CI_PROJECT_DIR/security-reports/.trivy_cache/"
  script:
    - export SCAN_ARGS="$CI_EXEC_SECURITY_SCAN_ARGUMENTS"
    - export REGISTRY_PW="$REGISTRY_TOKEN"
    - bash "$CI_PROJECT_DIR/ci/ci-code/clean/run_security_scan.sh"
  artifacts:
    name: "security_$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: never
    paths:
      - "$CI_PROJECT_DIR/reports/"
    reports:
      container_scanning: "$CI_PROJECT_DIR/reports/gl-container-scanning-report.json"
