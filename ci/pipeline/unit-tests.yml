      junit:
        - admin_init_report.xml

##############################################
# Documentation Build
##############################################
build_documentation:
  stage: tests
  extends: .test_template
  tags:
    - tests-runner
  script:
    - cd $KAAPANA_DIR/docs
    - pip install -r requirements.txt
    - make html 2>&1 | tee "build_documentation_html.log"
  artifacts:
    expose_as: "Documentation"
    paths:
      - $KAAPANA_DIR/docs/build/html/
      - "$KAAPANA_DIR/docs/build_documentation_html.log"

##############################################
# ReadTheDocs Build Check (scheduled pipelines on develop only)
##############################################
check_readthedocs:
  extends: .test_template
  image: $CI_BASE_IMAGE # needs curl + jq
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never
  script:
    - bash $KAAPANA_DIR/ci/ci-code/build/check_readthedocs.sh
