##############################################
# UI e2e Tests (mock-backed Playwright, no platform)
##############################################
# One matrix job per frontend app; each suite starts its app on its own fixed
# port (4300-4309; the registry lives in each app's playwright.config.ts header).
# Jobs run containerized, so ports and browser caches are per-job; chromium is
# fetched on every run.
ui_e2e_tests:
  extends: .test_template
  # Node job: the template's python:3.12 image lacks the node >=20.19 the apps
  # require (engines), and playwright needs a glibc distro for --with-deps.
  image: node:22
  variables:
    # both casings: chromium must reach the app on localhost, not the proxy
    NO_PROXY: "localhost,127.0.0.1"
    no_proxy: "localhost,127.0.0.1"
  parallel:
    matrix:
      - APP:
          - app-ui
          - data-upload-ui
          - extensions-ui
          - data-gallery-ui
          - home-ui
          - results-ui
          - federated-ui
          - workflow-execution-ui
          - workflow-list-ui
  script:
    - APP_DIR="services/base/$APP/docker/files"
    # Apps consuming @kaapana/base-ui (an npm file: link) import its built
    # dist/ — build the library once before the app's own install/build.
    - |
      if grep -q '"@kaapana/base-ui"' "$KAAPANA_DIR/$APP_DIR/package.json"; then
        (cd "$KAAPANA_DIR/services/base/base-ui/docker/files" && npm ci && npm run build)
      fi
    - cd "$KAAPANA_DIR/$APP_DIR"
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run build
    - npx playwright test
  # Relative, like every sibling job's report path: artifact paths are resolved
  # against $CI_PROJECT_DIR (= $KAAPANA_DIR), not against the script's cwd, so
  # the script's cd into the app does not move them.
  artifacts:
    when: always
    paths:
      - "services/*/*/docker/files/test-results/"
    reports:
      junit:
        - "services/**/test-results/junit.xml"

##############################################
# Documentation Build
##############################################
build_documentation:
  stage: tests
  extends: .test_template
  tags:
    - tests-runner
  script:
    - cd $KAAPANA_DIR/docs
    - pip install -r requirements.txt
    - make html 2>&1 | tee "build_documentation_html.log"
  artifacts:
    expose_as: "Documentation"
    paths:
      - $KAAPANA_DIR/docs/build/html/
      - "$KAAPANA_DIR/docs/build_documentation_html.log"

##############################################
# ReadTheDocs Build Check (scheduled pipelines on develop only)
##############################################
check_readthedocs:
  extends: .test_template
  image: $CI_BASE_IMAGE # needs curl + jq
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never
  script:
    - bash $KAAPANA_DIR/ci/ci-code/build/check_readthedocs.sh

##############################################
# npm registry probe (throwaway, gated on CI_EXEC_NPM_PROBE)
##############################################
npm_registry_probe:
  stage: tests
  tags:
    - tests-runner
  image: node:22
  timeout: 20m
  rules:
    - if: $CI_EXEC_NPM_PROBE == "true"
      when: always
    - when: never
  variables:
    KAAPANA_DIR: "$CI_PROJECT_DIR"
  script:
    - env | grep -i proxy || echo "PROBE: no proxy vars"
    - getent hosts registry.npmjs.org || true
    - npm config get registry
    - |
      echo "PROBE: metadata GET"
      curl -sS -o /dev/null -w 'PROBE metadata http=%{http_code} dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
        --max-time 120 https://registry.npmjs.org/vue || echo "PROBE metadata FAILED rc=$?"
    - |
      echo "PROBE: audit POST (bulk advisories)"
      curl -sS -o /dev/null -w 'PROBE audit http=%{http_code} dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
        --max-time 600 -X POST -H 'content-type: application/json' \
        -d '{"vue":["3.4.0"]}' https://registry.npmjs.org/-/npm/v1/security/advisories/bulk || echo "PROBE audit FAILED rc=$?"
    - |
      echo "PROBE: quick-audit POST"
      curl -sS -o /dev/null -w 'PROBE quick http=%{http_code} conn=%{time_connect} total=%{time_total}\n' \
        --max-time 600 -X POST -H 'content-type: application/json' \
        -d '{"name":"p","version":"1.0.0","requires":{},"dependencies":{}}' https://registry.npmjs.org/-/npm/v1/security/audits/quick || echo "PROBE quick FAILED rc=$?"
    - cd "$KAAPANA_DIR/services/base/base-ui/docker/files"
    - date -Is
    - npm ci --loglevel=http 2>&1 | tail -40
    - date -Is
