##############################################
# OPA Policy Tests
##############################################
# The rego files carry no Helm templating, so opa loads the chart's files/ dir
# as a bundle directly. Version and --v0-compatible must track the opa the
# platform runs (services/kaapana-admin/open-policy-agent/docker/Dockerfile and
# auth-backend's opa-build step): the policies are written in v0 syntax, which
# opa 1.x rejects by default. opa emits no JUnit, hence no report artifact.
# curl -f: without it a 404 or a proxy error page is saved as the "binary" and
# only surfaces as an "exec format error" two lines down.
opa_policy_tests:
  extends: .test_template
  script:
    - curl -fL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.18.2/opa_linux_amd64_static
    - chmod +x /usr/local/bin/opa
    - cd $KAAPANA_DIR/services/kaapana-admin/auth-backend/auth-backend-chart
    - opa test --v0-compatible -b files

##############################################
# Access Information Interface Tests
##############################################
access_information_interface_tests:
  extends: .pytest_template
  script:
    - pip install -r $KAAPANA_DIR/services/data-separation/access-information-interface/docker/backend/files/tests/requirements.txt
    - pytest $KAAPANA_DIR/services/data-separation/access-information-interface/docker/backend/files/tests/test_keycloak_helper.py --junitxml=aii_report.xml
        --cov=services/data-separation/access-information-interface/docker/backend/files/app
        --cov-report=term --cov-report=xml:coverage.xml
  artifacts:
    reports:
      junit:
        - aii_report.xml

##############################################
# Keycloak Setup Tests
##############################################
keycloak_setup_tests:
  extends: .pytest_template
  script:
    - pip install -r $KAAPANA_DIR/services/kaapana-admin/keycloak/keycloak-setup/tests/requirements.txt
    - pytest $KAAPANA_DIR/services/kaapana-admin/keycloak/keycloak-setup/tests/ --junitxml=keycloak_setup_report.xml
        --cov=services/kaapana-admin/keycloak/keycloak-setup/docker/files --cov-report=term --cov-report=xml:coverage.xml
  artifacts:
    reports:
      junit:
        - keycloak_setup_report.xml

##############################################
# Documentation Build
##############################################
build_documentation:
  stage: tests
  extends: .test_template
  tags:
    - tests-runner
  script:
    - cd $KAAPANA_DIR/docs
    - pip install -r requirements.txt
    - make html 2>&1 | tee "build_documentation_html.log"
  artifacts:
    expose_as: "Documentation"
    paths:
      - $KAAPANA_DIR/docs/build/html/
      - "$KAAPANA_DIR/docs/build_documentation_html.log"

##############################################
# ReadTheDocs Build Check (scheduled pipelines on develop only)
##############################################
check_readthedocs:
  extends: .test_template
  image: $CI_BASE_IMAGE # needs curl + jq
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never
  script:
    - bash $KAAPANA_DIR/ci/ci-code/build/check_readthedocs.sh
