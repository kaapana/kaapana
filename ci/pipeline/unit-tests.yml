##############################################
# Admin-Init (cert-init) Tests
##############################################
admin_init_tests:
  extends: .test_template
  script:
    - pip install -r $KAAPANA_DIR/services/kaapana-admin/admin-init/tests/requirements.txt
    - pytest $KAAPANA_DIR/services/kaapana-admin/admin-init/tests/ --junitxml=admin_init_report.xml
  artifacts:
