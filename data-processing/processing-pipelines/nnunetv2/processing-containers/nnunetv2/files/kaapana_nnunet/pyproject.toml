[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaapana_nnunet"
version = "0.1.0"
description = "Kaapana integration of nnU-Net"
requires-python = ">=3.10"
dependencies = ["minio>=7.2", "requests", "highdicom==0.28.2"]

[tool.setuptools.packages.find]
include = ["kaapana_nnunet*"]
