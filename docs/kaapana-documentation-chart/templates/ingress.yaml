apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaapana-documentation-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  labels:
    app.kubernetes.io/name: kaapana-documentation
    app.kubernetes.io/component: nginx
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
    kaapana.ai/ui.name: "Documentation"
    kaapana.ai/ui.section: "system"
    kaapana.ai/ui.order: "100"
    kaapana.ai/ui.id: "Documentation"
spec:
  rules:
  - host: 
    http:
      paths:
      - path: /docs/
        pathType: ImplementationSpecific
        backend:
          service:
            name: kaapana-documentation-service
            port:
              number: 80