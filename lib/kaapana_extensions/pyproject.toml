[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaapana-extensions"
version = "0.1.0"
description = "OCI Extension Registry CLI for Kaapana"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "pytest>=7.0.0",
    "requests>=2.31.0",
    "gitpython>=3.1.0",
    "kaapana-containers@git+https://codebase.helmholtz.cloud/kaapana/kaapana.git@feature/2161-build-toolchain#subdirectory=lib/kaapana_containers"
]

[project.scripts]
extensionctl = "kaapana_extensions.cli:app"

[tool.setuptools.packages.find]
where = ["."]
