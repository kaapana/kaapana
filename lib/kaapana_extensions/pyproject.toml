[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaapana-extensions"
version = "0.1.0"
description = "OCI Extension Registry CLI for Kaapana"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "gitpython>=3.1.0",
    "kaapana-containers"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.23",
    "pytest-docker>=3.0",
    "pytest-xdist>=3.0",
]

[project.scripts]
extensionctl = "kaapana_extensions.cli:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker, spins up a local registry:2 container",
]
