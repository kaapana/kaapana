apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-egress
  namespace: {{ .Values.global.admin_namespace }}
spec:
  podSelector: {}  # Applies to all pods in the namespace
  policyTypes:
  - Egress
  egress:
    {{- range .Values.global.internalCidrs }}
    - to:
      - ipBlock:
          cidr: {{ . | quote }}
    {{- end }}
{{- if eq (toString .Values.global.is_microk8s) "false" }}
    # Outside microk8s the internal CIDRs don't necessarily cover the cluster DNS, and the platform's
    # hostname may be served by an external ingress controller.
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
      - protocol: TCP
        port: 443
{{- end }}
