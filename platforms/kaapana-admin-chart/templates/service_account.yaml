{{- $ns := .Values.global.admin_namespace }}

############################
# ServiceAccounts
############################

apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaapana-kube-admin
  namespace: {{ $ns }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaapana-kube-dashboard
  namespace: {{ $ns }}
############################
# Kube-admin access
############################
{{- if not .Values.global.managed_kubernetes }}
---
# Full cluster-admin (self-managed clusters)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-crb-{{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kaapana-kube-admin
    namespace: {{ $ns }}
{{- else }}

{{- range $all_ns := .Values.global.all_managed_namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kaapana-admin-ns
  namespace: {{ $all_ns }}
rules:
# Core API
- apiGroups: [""]
  resources:
    - pods
    - services
    - endpoints
    - secrets
    - configmaps
    - persistentvolumeclaims
    - events
    - serviceaccounts
  verbs: ["get", "list", "watch"]

- apiGroups: [""]
  resources:
    - pods
    - services
    - secrets
    - configmaps
    - persistentvolumeclaims
    - events
    - serviceaccounts
  verbs: ["create", "update", "patch", "delete"]

- apiGroups: [""]
  resources:
    - pods/log
  verbs: ["get"]

# Workloads
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Batch / Helm hooks
- apiGroups: ["batch"]
  resources:
    - jobs
    - cronjobs
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Networking
- apiGroups: ["networking.k8s.io"]
  resources:
    - ingresses
    - networkpolicies
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Autoscaling
- apiGroups: ["autoscaling"]
  resources:
    - horizontalpodautoscalers
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Policy / disruption budgets
- apiGroups: ["policy"]
  resources:
    - poddisruptionbudgets
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# RBAC objects *inside the namespace only*
- apiGroups: ["rbac.authorization.k8s.io"]
  resources:
    - roles
    - rolebindings
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Traefik CRDs (read-only, namespaced)
- apiGroups: ["traefik.io"]
  resources:
    - middlewares
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]


---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaapana-admin-ns
  namespace: {{ $all_ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kaapana-admin-ns
subjects:
- kind: ServiceAccount
  name: kaapana-kube-admin
  namespace: {{ $ns }}

{{- end }}

{{- end }}

############################
# Dashboard RBAC
############################

{{- if not .Values.global.managed_kubernetes }}
---
# ClusterRole for dashboard (self-managed)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kaapana-kube-dashboard-production
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - nonResourceURLs: ["*"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kaapana-kube-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  {{- if .Values.global.dev_mode }}
  name: cluster-admin
  {{- else }}
  name: kaapana-kube-dashboard-production
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: kaapana-kube-dashboard
    namespace: {{ $ns }}

{{- else }}

{{- range $all_ns := .Values.global.all_managed_namespaces }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaapana-kube-dashboard-ns
  namespace: {{ $all_ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kaapana-admin-ns
subjects:
  - kind: ServiceAccount
    name: kaapana-kube-dashboard
    namespace: {{ $ns }}

{{- end }}

{{- end }}