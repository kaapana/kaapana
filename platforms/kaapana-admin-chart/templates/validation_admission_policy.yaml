---
{{- /* global.enable_privileged_pod_admission_policy lets a site keep dev_mode off and still
run a workload that needs a privileged container. Compared as a lower-cased string on
purpose: `default true` would swallow an explicit false (Helm treats false as empty), and
an unset value keeps the policy enforced. */ -}}
{{- if and (not .Values.global.dev_mode) (ne (lower (toString .Values.global.enable_privileged_pod_admission_policy)) "false") }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "forbid-privileged-pods"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods"]
  variables:
    - name: containersWithSecurityContext
      expression: "object.spec.containers.filter(c, has(c.securityContext) && has(c.securityContext.privileged))"
  validations:
    - expression: "variables.containersWithSecurityContext.all(c, c.securityContext.privileged != true)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: "forbid-privileged-pods-binding"
spec:
  policyName: "forbid-privileged-pods"
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
          - "kube-system"
{{- end }}