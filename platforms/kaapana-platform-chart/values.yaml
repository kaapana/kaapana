---
global:
    test: ""

extension_params:
    hostname:
        default: ""
        definition: FQDN of the server
        type: string
        value: ""
    include_reverse_proxy:
        default: false
        definition: "Spawns a separate set of traefik and oauth2-proxy deployments for the platform"
        type: bool
        value: ""
    instance_name:
        default: ""
        definition: "Only valid if multiple instances for the same Kaapana platform are deployed"
        type: string
        value: ""
    instance_uid:
        default: ""
        definition: Only valid if multiple instances for the same Kaapana platform are deployed
        type: string
        value: ""
    login_header:
        default: "Kaapana"
        definition: "Login page: bold title shown on the Keycloak login page"
        type: string
        value: "Kaapana"
    login_subheader:
        default: "End-to-End medical image analysis"
        definition: "Login page: muted subtitle shown under the title"
        type: string
        value: "End-to-End medical image analysis"
    login_notice:
        default: ""
        definition: "Login page: longer notice text (single line, basic HTML allowed)"
        type: string
        value: ""
    login_institution_name:
        default: ""
        definition: "Login page: alt text for the institution logo"
        type: string
        value: ""
    login_institution_logo:
        default: ""
        definition: "Login page: URL or data: URI of a logo shown next to the Kaapana logo"
        type: string
        value: ""
    kaapana_build_version:
        default: ""
        definition: The current build version of the platform
        type: string
        value: ""
    offline_mode:
        default: "false"
        definition: Offline installation build
        type: string
        value: ""
    prefetch_extensions:
        default: "false"
        definition: Comma separated list of extensions to be installed
        type: string
        value: ""
    registry_url:
        default: ""
        definition: ""
        type: string
        value: ""
    release_name:
        default: kaapana-platform-chart
        definition: Name of the helm chart for this platform
        type: string
        value: ""
    platform_prefix:
        default: ""
        definition: "Prefix prepended to project namespaces ({prefix}-project-<short_id>) inside a k8s cluster. Required."
        type: string
        value: ""
    admin_namespace:
        default: admin
        definition: "Namespace for Kubernetes resources with admin access, such as reverse proxy and authentication"
        type: string
        value: ""
    base_namespace:
        default: base
        definition: ""
        type: string
        value: ""
    extensions_namespace:
        default: extensions
        definition: Namespace for extensions installed in this platform
        type: string
        value: ""
    helm_namespace:
        default: services
        definition: Namespace for helm charts of this platform
        type: string
        value: ""
    services_namespace:
        default: services
        definition: "Namespace for fundamental resources in this platform, such as the backend and the landing page"
        type: string
        value: ""
    dicom_port:
        default: "11112"
        definition: ""
        type: string
        value: ""
    http_port:
        default: "80"
        definition: ""
        type: string
        value: ""
    http_proxy:
        default: ""
        definition: ""
        type: string
        value: ""
    https_port:
        default: "443"
        definition: ""
        type: string
        value: ""
    https_proxy:
        default: ""
        definition: ""
        type: string
        value: ""
    fast_data_dir:
        default: /home/kaapana-data
        definition: Data directory path
        type: string
        value: ""
    home_dir:
        default: /home/ubuntu
        definition: ""
        type: string
        value: ""
    slow_data_dir:
        default: /home/kaapana-data
        definition: Data directory
        type: string
        value: ""
    gpu_support:
        default: false
        definition: Enables microk8s GPU support
        type: bool
        value: ""
    pull_policy_jobs:
        default: Always
        definition: ""
        type: string
        value: ""
    pull_policy_images:
        default: Always
        definition: ""
        type: string
        value: ""
    pull_policy_pods:
        default: Always
        definition: ""
        type: string
        value: ""
