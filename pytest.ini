[pytest]
# Limit test discovery to the kaapana_test test folder to avoid importing
# unrelated modules across the repository that may require heavy runtime
# dependencies (kubernetes, airflow, docker, etc.).
testpaths = tests

# Keep pytest from recursing into large folders that are not test packages
norecursedirs = data-processing services build .venv .git .tox node_modules

# Default file pattern (keeps default but explicit for clarity)
python_files = test_*.py
addopts = --show-capture=log