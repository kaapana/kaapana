line-length = 120
target-version = "py312"
# Third-party code kept verbatim so it stays diffable against upstream.
extend-exclude = [
    "services/flow/airflow/docker/files/scheduler_job_runner_2.10.3.py",
    "services/flow/airflow/docker/files/scheduler_job_runner_2.10.3_adapted.py",
    "services/flow/airflow/docker/files/task_command_2.10.3.py",
    "services/flow/airflow/docker/files/task_command_2.10.3_adapted.py",
    "utils/internet-benchmark/docker/files/speedtest.py",
]
# Honour the excludes for explicitly passed paths too (editor and LSP invocations).
force-exclude = true

[lint]
select = [
    "E4", # pycodestyle imports: multiple imports on one line, imports not at the top of the file
    "E7", # pycodestyle statements: comparisons to None/True/False with ==, bare except, lambda assignment, ambiguous names like l
    "E9", # pycodestyle runtime: syntax errors and files that cannot be read
    "F",  # Pyflakes: undefined names, unused imports and variables, redefinitions, invalid format strings
    "I",  # isort: imports sorted and grouped (standard library, third party, first party)
]
