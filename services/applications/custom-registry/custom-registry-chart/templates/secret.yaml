{{- if eq .Values.global.secret_scope "Service-Secret" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-secret-{{ trunc 4 (sha256sum .Values.global.custom_registry_url ) }}
  namespace: "{{ .Values.global.services_namespace }}"
  labels:
    kaapana.ai/registry-secret: custom-registry
    kaapana.ai/new-registry-display-name: {{ .Values.global.display_name }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\": {\"%s\": {\"auth\": \"%s\"}}}" .Values.global.custom_registry_url (printf "%s:%s" .Values.global.credentials_custom_registry_username .Values.global.credentials_custom_registry_password | b64enc) | b64enc }}
{{- end }}
{{- if eq .Values.global.secret_scope "Project-Secret" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-secret-{{ trunc 4 (sha256sum .Values.global.custom_registry_url ) }}
  namespace: "{{ .Values.global.project_namespace }}"
  labels:
    kaapana.ai/registry-secret: custom-registry
    kaapana.ai/new-registry-display-name: {{ .Values.global.display_name }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\": {\"%s\": {\"auth\": \"%s\"}}}" .Values.global.custom_registry_url (printf "%s:%s" .Values.global.credentials_custom_registry_username .Values.global.credentials_custom_registry_password | b64enc) | b64enc }}
{{- end }}
---