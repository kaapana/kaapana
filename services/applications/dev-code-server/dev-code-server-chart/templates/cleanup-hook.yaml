apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup
  namespace: "{{ tpl .Values.global.namespace . }}"
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-cleanup
    spec:
      serviceAccountName: {{ .Release.Name }}-sa
      restartPolicy: Never
      containers:
      - name: cleanup
        image: "{{ .Values.global.registry_url }}/dev-code-server:{{ .Values.global.kaapana_build_version }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        command:
        - /bin/bash
        - -c
        - |
          echo "Cleaning up GPU jobs for release {{ .Release.Name }}..."
          kubectl delete jobs -n "{{ tpl .Values.global.namespace . }}" -l "dev-code-server-release={{ .Release.Name }}" --ignore-not-found=true
          echo "Cleanup complete."
      imagePullSecrets:
      - name: registry-secret
