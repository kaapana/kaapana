kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}
  namespace: "{{ tpl .Values.global.namespace . }}"
  labels:
    app.kubernetes.io/name: dev-code-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      securityContext:
        runAsUser: 0
      initContainers:
      - name: dev-server-chart-init
        securityContext:
          runAsUser: 0
        image: "{{ .Values.global.registry_url }}/busybox:{{ .Values.global.kaapana_build_version  }}"
        command: ["chown", "-R" , "1000:1000", "/kaapana/minio"]
        volumeMounts:
{{ include "dynamicVolumeMounts" $ | indent 10 }}
      containers:
      - name: minio-sync
        image: "{{ .Values.global.registry_url }}/minio-mirror:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        resources:
          requests:
            memory: "100Mi"
          limits:
            memory: "300Mi"
        env:
        - name: ACTION
          value: "SYNC"
        - name: MINIO_SERVICE
          value: "minio-service.{{ .Values.global.services_namespace }}.svc:9000"
        - name: LOCAL_PATH
          value: /kaapana/minio/
        - name: MINIO_PATH
          value: project-{{ .Values.global.project_short_id }}/{{ .Values.global.minio_prefix }}
        - name: MINIO_USER
          value: {{ .Values.global.credentials_minio_username  | default "" }}
        - name: MINIO_PASSWORD
          value: {{ .Values.global.credentials_minio_password | default ""}}
        - name: EXCLUDE
          value: "{{ .Values.global.exclude_patterns }}"
        volumeMounts:
{{ include "dynamicVolumeMounts" $ | indent 10 }}
      - name: code-server
        image: "{{ .Values.global.registry_url }}/dev-code-server:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        # The image entrypoint warms the autocomplete model before code-server starts.
        command: ["/entrypoint.sh"]
        env:
{{ include "dynamicEnvs" $ | indent 8 }}
        # .svc keeps Continue's requests to the shared Ollama service off the proxy.
        - name: no_proxy
          value: "traefik-{{ .Values.global.instance_uid | default 0 }}.{{ .Values.global.helm_namespace }}.svc,.svc,.svc.cluster.local,localhost,127.0.0.1"
        - name: OLLAMA_API_BASE
          value: {{ tpl .Values.global.ollama_api_base . | quote }}
        - name: OLLAMA_WARMUP_MODEL
          value: {{ .Values.global.ollama_autocomplete_model | quote }}
        - name: OLLAMA_KEEP_ALIVE
          value: {{ .Values.global.ollama_keep_alive | quote }}
        - name: http_proxy
          value: {{ .Values.global.http_proxy }}
        - name: https_proxy
          value: {{ .Values.global.https_proxy }}
        - name: KAAPANA_PROJECT_ID
          value: {{ .Values.global.project_id }}
        - name: KAAPANA_CLIENT_SECRET
          value: {{ .Values.global.oidc_client_secret }}
        - name: KAAPANA_CLIENT_ID
          value: "kaapana"
        resources:
          requests:
            memory: 200Mi
          limits:
            memory: 10Gi
        volumeMounts:
          - name: configs
            mountPath: /root/.local/share/code-server/User/keybindings.json
            subPath: keybindings.json
          - name: configs
            mountPath: /root/.local/share/code-server/User/settings.json
            subPath: settings.json
          - name: configs
            mountPath: /root/.continue/config.yaml
            subPath: continue-config.yaml
{{ include "dynamicVolumeMounts" $ | indent 10 }}
          - name: dshm
            mountPath: /dev/shm
      volumes:
      - name: configs
        configMap:
          name: {{ .Release.Name }}
          items:
          - key: keybindings.json
            path: keybindings.json
          - key: user_settings.json
            path: settings.json
          - key: continue_config.yaml
            path: continue-config.yaml
{{ include "dynamicVolumes" $ | indent 6 }}
      - name: dshm
        emptyDir:
          medium: Memory
      imagePullSecrets:
      - name: registry-secret