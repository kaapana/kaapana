kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}
  namespace: "{{ tpl .Values.global.namespace . }}"
  labels:
    app.kubernetes.io/name: dev-code-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      securityContext:
        runAsUser: 0
      initContainers:
      - name: dev-server-chart-init
        securityContext:
          runAsUser: 0
        image: "{{ .Values.global.registry_url }}/busybox:{{ .Values.global.kaapana_build_version  }}"
        command:
        - sh
        - -c
        - mkdir -p /kaapana/.minio-share/mount && chown -R 1000:1000 /kaapana/.minio-share
        volumeMounts:
{{ include "dynamicVolumeMounts" $ | indent 10 }}
      containers:
      # Mounts the selected bucket directory as a FUSE filesystem, as in the
      # jupyterlab chart: privileged for FUSE, Bidirectional so code-server sees it.
      - name: minio-mount
        image: "{{ .Values.global.registry_url }}/minio-mirror:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          privileged: true
        resources:
          requests:
            memory: "100Mi"
          limits:
            memory: "500Mi"
        env:
        - name: ACTION
          value: "MOUNT"
        - name: MINIO_SERVICE
          value: "minio-service.{{ .Values.global.services_namespace }}.svc:9000"
        - name: LOCAL_PATH
          value: /kaapana/.minio-share/mount/
        - name: MINIO_PATH
          value: project-{{ .Values.global.project_short_id }}/{{ .Values.global.minio_prefix }}
        - name: MINIO_USER
          value: {{ .Values.global.credentials_minio_username  | default "" }}
        - name: MINIO_PASSWORD
          value: {{ .Values.global.credentials_minio_password | default ""}}
        - name: RCLONE_CACHE_DIR
          value: /kaapana/cache
        volumeMounts:
          - name: rclone-cache
            mountPath: /kaapana/cache
{{ include "dynamicVolumeMounts" (dict "root" $ "mountPropagation" "Bidirectional") | indent 10 }}
      - name: code-server
        image: "{{ .Values.global.registry_url }}/dev-code-server:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        # /kaapana/minio is the user-facing path of the FUSE mount.
        command: ["sh", "-c", "ln -sfn /kaapana/.minio-share/mount /kaapana/minio && code-server --disable-workspace-trust --auth none --bind-addr 0.0.0.0:8080 ${WORKSPACE}"]
        env:
{{ include "dynamicEnvs" $ | indent 8 }}
        - name: no_proxy
          value: "traefik-{{ .Values.global.instance_uid | default 0 }}.{{ .Values.global.helm_namespace }}.svc"
        - name: http_proxy
          value: {{ .Values.global.http_proxy }}
        - name: https_proxy
          value: {{ .Values.global.https_proxy }}
        - name: KAAPANA_PROJECT_ID
          value: {{ .Values.global.project_id }}
        - name: KAAPANA_CLIENT_SECRET
          value: {{ .Values.global.oidc_client_secret }}
        - name: KAAPANA_CLIENT_ID
          value: "kaapana"
        resources:
          requests:
            memory: 200Mi
          limits:
            memory: 10Gi
        volumeMounts:
          - name: configs
            mountPath: /root/.local/share/code-server/User/keybindings.json
            subPath: keybindings.json
          - name: configs
            mountPath: /root/.local/share/code-server/User/settings.json
            subPath: settings.json
{{ include "dynamicVolumeMounts" (dict "root" $ "mountPropagation" "HostToContainer") | indent 10 }}
          - name: dshm
            mountPath: /dev/shm
      volumes:
      - name: configs
        configMap:
          name: {{ .Release.Name }}
          items:
          - key: keybindings.json
            path: keybindings.json
          - key: user_settings.json
            path: settings.json
{{ include "dynamicVolumes" $ | indent 6 }}
      - name: dshm
        emptyDir:
          medium: Memory
      - name: rclone-cache
        emptyDir: {}
      imagePullSecrets:
      - name: registry-secret