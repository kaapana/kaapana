{{- $servicesNamespace := tpl .Values.global.services_namespace . -}}
{{- $defaultOllamaHost := printf "ollama-service.%s.svc:11434" $servicesNamespace -}}
{{- $ollamaHost := $defaultOllamaHost -}}
{{- if .Values.global.ollama_host -}}
{{- $ollamaHost = tpl .Values.global.ollama_host . -}}
{{- end -}}
{{- $ollamaModel := default "qwen2.5-coder:7b" .Values.global.ollama_model -}}
{{- $ollamaKeepAlive := default "10m" .Values.global.ollama_keep_alive -}}
{{- $warmupEnabled := true -}}
{{- if hasKey .Values.global "ollama_warmup_enabled" -}}
{{- $warmupEnabled = .Values.global.ollama_warmup_enabled -}}
{{- end -}}
{{- $ollamaWarmupModel := "" -}}
{{- if $warmupEnabled -}}
{{- $ollamaWarmupModel = default $ollamaModel .Values.global.ollama_warmup_model -}}
{{- end -}}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}
  namespace: "{{ tpl .Values.global.namespace . }}"
  labels:
    app.kubernetes.io/name: dev-code-server
spec:
  # Large images can take longer to become available; allow longer rollout time
  # before Kubernetes marks the Deployment as ProgressDeadlineExceeded.
  progressDeadlineSeconds: 3600
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      securityContext:
        runAsUser: 0
      initContainers:
      - name: dev-server-chart-init
        securityContext:
          runAsUser: 0
        image: "{{ .Values.global.registry_url }}/busybox:{{ .Values.global.kaapana_build_version  }}"
        command: ["chown", "-R" , "1000:1000", "/kaapana/minio"]
        volumeMounts:
{{ include "dynamicVolumeMounts" $ | indent 10 }}
      containers:
      - name: minio-sync
        image: "{{ .Values.global.registry_url }}/minio-mirror:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        resources:
          requests:
            memory: "100Mi"
          limits:
            memory: "15Gi"
        env:
        - name: ACTION
          value: "SYNC"
        - name: MINIO_SERVICE
          value: "minio-service.{{ .Values.global.services_namespace }}.svc:9000"
        - name: LOCAL_PATH
          value: /kaapana/minio/
        - name: MINIO_PATH
          value: project-{{ .Values.global.project_name }}/{{ .Values.global.minio_prefix }}
        - name: MINIO_USER
          value: {{ .Values.global.credentials_minio_username  | default "" }}
        - name: MINIO_PASSWORD
          value: {{ .Values.global.credentials_minio_password | default ""}}
        - name: EXCLUDE
          value: "{{ .Values.global.exclude_patterns }}"
        volumeMounts:
{{ include "dynamicVolumeMounts" $ | indent 10 }}
      - name: code-server
        image: "{{ .Values.global.registry_url }}/dev-code-server:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        # Use the image entrypoint so shared Ollama connectivity is checked
        # before code-server starts issuing completion requests.
        command: ["/entrypoint.sh"]
        env:
{{ include "dynamicEnvs" $ | indent 8 }}
        - name: http_proxy
          value: {{ .Values.global.http_proxy }}
        - name: https_proxy
          value: {{ .Values.global.https_proxy }}
        # Bypass the proxy for in-cluster service calls so editor extensions can
        # still reach shared services such as Ollama directly.
        - name: no_proxy
          value: ".svc,.svc.cluster,.svc.cluster.local,localhost,127.0.0.1,{{ .Values.global.hostname }}"
        - name: NO_PROXY
          value: ".svc,.svc.cluster,.svc.cluster.local,localhost,127.0.0.1,{{ .Values.global.hostname }}"
        - name: OLLAMA_HOST
          value: {{ $ollamaHost | quote }}
        - name: OLLAMA_WARMUP_MODEL
          value: {{ $ollamaWarmupModel | quote }}
        # Keep the shared coder model warm briefly without pinning it in memory
        # for the full lifetime of the dev-code-server pod.
        - name: OLLAMA_KEEP_ALIVE
          value: {{ $ollamaKeepAlive | quote }}
        resources:
          requests:
            memory: 200Mi
          limits:
            memory: 10Gi
        volumeMounts:
          - name: configs
            mountPath: /root/.local/share/code-server/User/keybindings.json
            subPath: keybindings.json
          - name: configs
            mountPath: /root/.local/share/code-server/User/settings.json
            subPath: settings.json
          # Mount Continue YAML from ConfigMap so model/provider fixes can roll out
          # without rebuilding the full dev-code-server image.
          - name: configs
            mountPath: /root/.continue/config.yaml
            subPath: continue-config.yaml
{{ include "dynamicVolumeMounts" $ | indent 10 }}
          - name: dshm
            mountPath: /dev/shm
      volumes:
      - name: configs
        configMap:
          name: {{ .Release.Name }}
          items:
          - key: keybindings.json
            path: keybindings.json
          - key: user_settings.json
            path: settings.json
          - key: continue_config.yaml
            path: continue-config.yaml
{{ include "dynamicVolumes" $ | indent 6 }}
      - name: dshm
        emptyDir:
          medium: Memory
      imagePullSecrets:
      - name: registry-secret
