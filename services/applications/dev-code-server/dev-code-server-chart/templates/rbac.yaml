apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sa
  namespace: "{{ tpl .Values.global.namespace . }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-gpu-job-role
  namespace: "{{ tpl .Values.global.namespace . }}"
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-gpu-job-binding
  namespace: "{{ tpl .Values.global.namespace . }}"
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-sa
  namespace: "{{ tpl .Values.global.namespace . }}"
roleRef:
  kind: Role
  name: {{ .Release.Name }}-gpu-job-role
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole for reading node info (needed for GPU status checks)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
  # Allow listing pods cluster-wide to find GPU-using pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-node-reader-binding
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-sa
  namespace: "{{ tpl .Values.global.namespace . }}"
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-node-reader
  apiGroup: rbac.authorization.k8s.io
