kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}
  namespace: "{{ tpl .Values.global.namespace . }}"
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: 8080
      name: vs-http
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix-{{ .Release.Name }}
  namespace: "{{ tpl .Values.global.namespace . }}"
spec:
  stripPrefix:
    prefixes:
    - {{ printf "/%s" (tpl .Values.global.ingress_path .) }}
---
apiVersion: networking.k8s.io/v1 
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: "{{ tpl .Values.global.namespace . }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ tpl .Values.global.namespace . }}-strip-prefix-{{ .Release.Name }}@kubernetescrd
    traefik.ingress.kubernetes.io/preserve-host: "true"
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
    kaapana.ai/display-name: {{ if eq .Values.global.display_name "-" }}{{ .Release.Name }}{{ else }}{{ .Values.global.display_name }}{{ end }}
    kaapana.ai/type: application
spec:
  # Explicitly bind this ingress to the platform TLS secret so the route uses
  # the same Kaapana-managed certificate as the rest of the deployment.
  {{- $tlsSecretName := "certificate" }}
  {{- with .Values.global }}
  {{- with .tls_secret }}
  {{- $tlsSecretName = (.name | default $tlsSecretName) }}
  {{- end }}
  {{- end }}
  tls:
    # Use Kaapana's global TLS secret when provided, otherwise fall back to
    # the historical default secret name.
    - secretName: {{ $tlsSecretName }}
  rules:
  - host: 
    http:
      paths:
      - path: {{ printf "/%s" (tpl .Values.global.ingress_path .) }}
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Release.Name }}
            port:
              name: vs-http
