---
global:
  ingress_path: "applications/project/{{ .Values.global.project_id }}/release/{{ .Release.Name }}/"
  namespace: "{{ .Values.global.services_namespace }}"
  dynamicVolumes:
    - name: dev-code-server
      # Hidden shared volume for the sidecar's FUSE mount; users see /kaapana/minio.
      mount_path: /kaapana/.minio-share/
      host_path: "/applications/dev-code-server"
      storage: "10Gi"
      minio_mirror: true
  envVars:
    - name: WORKSPACE
      value: "/kaapana"

extension_params:
  display_name:
    default: "-"
    definition: Display name for the launched application
    type: string
    value: ""
  minio_prefix:
    default: "/"
    definition: Directory in the project bucket to mount into the application
    type: string
    value: "/"