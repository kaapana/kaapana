kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}
  namespace: "{{ tpl .Values.global.namespace . }}"
  labels:
    app.kubernetes.io/name: dev-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        kaapana.ai/type: "processing-container"
{{ include "dynamicLabels" $ | indent 8 }}
    spec:
      securityContext:
        runAsUser: 0
      initContainers:
      # The task image carries no code-server (base-python-cpu dropped it); this
      # container copies the install into two shared volumes, mounted below where
      # code-server expects them.
      - name: code-server-init
        image: "{{ .Values.global.registry_url }}/code-server-init:{{ .Values.global.kaapana_build_version }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        volumeMounts:
          - name: code-server
            mountPath: /mnt/code-server
          - name: code-server-extensions
            mountPath: /mnt/code-server-extensions
      containers:
      - name: code-server
        image: "{{ tpl .Values.global.complete_image . }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        command: ["sh", "-c", "/usr/lib/code-server/bin/code-server --auth none --bind-addr 0.0.0.0:8080 ${WORKSPACE}"]
        env:
        - name: no_proxy
          value: "traefik-{{ .Values.global.instance_uid | default 0 }}.{{ .Values.global.helm_namespace }}.svc"
        - name: http_proxy
          value: {{ .Values.global.http_proxy }}
        - name: https_proxy
          value: {{ .Values.global.https_proxy }}
{{ include "dynamicEnvs" $ | indent 8 }}
{{ include "dynamicEnvsFromSecretRef" $ | indent 8 }}
        resources:
          requests:
            memory: 200Mi
          limits:
            memory: 5Gi
        volumeMounts:
          - name: code-server
            mountPath: /usr/lib/code-server
          - name: code-server-extensions
            mountPath: /root/.local/share/code-server/extensions
          - name: configs
            mountPath: /root/.local/share/code-server/User/keybindings.json
            subPath: keybindings.json
          - name: configs
            mountPath:  /kaapana/.vscode/launch.json
            subPath: launch.json
          - name: configs
            mountPath: /root/.local/share/code-server/Machine/settings.json
            subPath: settings.json
{{ include "dynamicVolumeMounts" $ | indent 10 }}
          - name: dshm
            mountPath: /dev/shm
      volumes:
      - name: code-server
        emptyDir: {}
      - name: code-server-extensions
        emptyDir: {}
      - name: configs
        configMap:
          name: {{ .Release.Name }}
          items:
          - key: keybindings.json
            path: keybindings.json
          - key: launch.json
            path: launch.json
          - key: machine_settings.json
            path: settings.json
{{ include "dynamicVolumes" $ | indent 6 }}
      - name: dshm
        emptyDir:
          medium: Memory
      imagePullSecrets:
      - name: registry-secret