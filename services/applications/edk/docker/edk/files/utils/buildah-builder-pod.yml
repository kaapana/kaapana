apiVersion: v1
kind: Pod
metadata:
  name: buildah-builder
spec:
  hostNetwork: true
  containers:
  - name: buildah
    image: "{{ .Values.global.registry_url }}/buildah:{{ .Values.global.kaapana_build_version }}"
    imagePullPolicy: IfNotPresent
    command:
    - /start.sh
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      # replaces deprecated annotation: container.apparmor.security.beta.kubernetes.io/buildah: unconfined
      appArmorProfile:
        type: Unconfined
      capabilities:
        add:
          - SYS_ADMIN
    resources:
      limits:
        memory: 20Gi
      requests:
        memory: 2Gi
    env:
    - name: TLS_VERIFY
      value: "false"
    - name: BUILD_CONTEXT
      value: "CONTEXT_DIR"
    - name: BUILD_DESTINATION
      value: "DEST"
    - name: NO_PROXY
      value: "localhost,127.0.0.1,.svc,.cluster.local"
    volumeMounts:
    - name: edk
      mountPath: /kaapana/minio
    - name: storage
      mountPath: /storage
  restartPolicy: Never
  volumes:
  - name: edk
    persistentVolumeClaim:
      claimName: edk-pv-claim
  - name: storage
    emptyDir:
      sizeLimit: 30Gi
  imagePullSecrets:
  - name: registry-secret