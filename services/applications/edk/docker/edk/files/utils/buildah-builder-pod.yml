apiVersion: v1
kind: Pod
metadata:
  name: buildah-builder
  annotations:
    container.apparmor.security.beta.kubernetes.io/buildah: unconfined
spec:
  containers:
  - name: buildah
    image: "{{ .Values.global.registry_url }}/buildah:{{ .Values.global.kaapana_build_version }}"
    imagePullPolicy: Always
    command:
    - /start.sh
    hostNetwork: true
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      capabilities:
        add:
          - SYS_ADMIN
    resources:
      limits:
        memory: 20Gi
      requests:
        memory: 2Gi
    env:
    - name: BUILD_CONTEXT
      value: "CONTEXT_DIR"
    - name: BUILD_DESTINATION
      value: "DEST"
    - name: BUILD_PROXY_ARGS
      value: ""
    - name: NO_PROXY
      value: "localhost,127.0.0.1,.svc,.cluster.local"
    - name: http_proxy
      value: https_proxy=http://squid-proxy-service.admin.svc.cluster.local:3128
    - name: https_proxy
      value: https_proxy=http://squid-proxy-service.admin.svc.cluster.local:3128
    volumeMounts:
    - name: edk
      mountPath: /kaapana/minio
    - name: storage
      mountPath: /storage
  restartPolicy: Never
  volumes:
  - name: edk
    persistentVolumeClaim:
      claimName: edk-pv-claim
  - name: storage
    emptyDir:
      sizeLimit: 30Gi
  imagePullSecrets:
  - name: registry-secret