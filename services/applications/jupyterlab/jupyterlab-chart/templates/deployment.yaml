kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}
  namespace: "{{ tpl .Values.global.namespace . }}"
  labels:
    app.kubernetes.io/name: jupyterlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
{{- include "kaapana.nodeSelector" . | indent 6 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: jupyterlab-init
        securityContext:
          runAsUser: 0
        image: "{{ .Values.global.registry_url }}/busybox:{{ .Values.global.kaapana_build_version  }}"
        command:
        - sh
        - -c
        - mkdir -p /kaapana/.minio-share/mount && chown -R 1000:1000 /kaapana/.minio-share
        volumeMounts:
{{ include "dynamicVolumeMounts" $ | indent 10 }}
      containers:
      - name: minio-mount
        image: "{{ .Values.global.registry_url }}/minio-mirror:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          privileged: true
        resources:
          requests:
            memory: "100Mi"
          limits:
            memory: "500Mi"
        env:
        - name: ACTION
          value: "MOUNT"
        - name: MINIO_SERVICE
          value: "minio-service.{{ .Values.global.services_namespace }}.svc:9000"
        - name: LOCAL_PATH
          value: /kaapana/.minio-share/mount/
        - name: MINIO_PATH
          value: project-{{ .Values.global.project_name }}/{{ .Values.global.minio_prefix }}
        - name: MINIO_USER
          value: {{ .Values.global.credentials_minio_username  | default "" }}
        - name: MINIO_PASSWORD
          value: {{ .Values.global.credentials_minio_password | default ""}}
        - name: RCLONE_CACHE_DIR
          value: /kaapana/cache
        volumeMounts:
          - name: rclone-cache
            mountPath: /kaapana/cache
{{ include "dynamicVolumeMounts" (dict "root" $ "mountPropagation" "Bidirectional") | indent 10 }}
      - name: jupyterlab
        image: "{{ tpl .Values.global.complete_image . }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        resources:
          requests:
            memory: "100Mi"
          limits:
            memory: "1Gi"
        ports:
        - name: jupyterlab-http
          containerPort: 8888
        env:
        - name: INGRESS_PATH
          value: "/applications/project/{{ .Values.global.project_id }}/release/{{ .Release.Name }}"
        - name: MINIO_MOUNT_PATH
          value: /kaapana/.minio-share/mount/
{{ include "dynamicEnvs" $ | indent 8 }}
        - name: http_proxy
          value: {{ .Values.global.http_proxy }}
        - name: https_proxy
          value: {{ .Values.global.https_proxy }}
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
{{ include "dynamicVolumeMounts" (dict "root" $ "mountPropagation" "HostToContainer") | indent 10 }}
      volumes:
{{ include "dynamicVolumes" $ | indent 6 }}
      - name: dshm
        emptyDir:
          medium: Memory
      - name: rclone-cache
        emptyDir: {}
      imagePullSecrets:
      - name: registry-secret
