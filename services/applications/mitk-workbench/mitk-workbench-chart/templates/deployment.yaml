kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}
  namespace: "{{ tpl .Values.global.namespace .  }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
{{- include "kaapana.nodeSelector" . | indent 6 }}
      restartPolicy: Always
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: mitk-workbench-init
        securityContext:
          runAsUser: 0
        image: "{{ .Values.global.registry_url }}/busybox:{{ .Values.global.kaapana_build_version  }}"
        command: ["chown", "-R", "1000:1000", "/kaapana/minio"]
        volumeMounts:
{{ include "dynamicVolumeMounts" $ | indent 10 }}
      containers:
      - name: minio-input
        image: "{{ .Values.global.registry_url }}/s3-mirror:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        resources:
          requests:
            memory: "10Mi"
          limits:
            memory: "50Mi"
        env:
        - name: ACTION
          value: "FETCH"
        - name: S3_SERVICE
          value: "minio-service.{{ .Values.global.services_namespace }}.svc:9000"
        - name: LOCAL_PATH
          value: /kaapana/minio/input
        - name: S3_PATH
          value: "project-{{ .Values.global.project_short_id }}/{{ .Release.Name }}/input"
        - name: S3_USER
          value: {{ .Values.global.credentials_minio_username  | default "" }}
        - name: S3_PASSWORD
          value: {{ .Values.global.credentials_minio_password | default ""}}
        volumeMounts:
{{ include "dynamicVolumeMounts" $ | indent 10 }}
      - name: minio-output
        image: "{{ .Values.global.registry_url }}/s3-mirror:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        resources:
          requests:
            memory: "10Mi"
          limits:
            memory: "50Mi"
        env:
        - name: ACTION
          value: "PUSH"
        - name: S3_SERVICE
          value: "minio-service.{{ .Values.global.services_namespace }}.svc:9000"
        - name: LOCAL_PATH
          value: /kaapana/minio/output
        - name: S3_PATH
          value: "project-{{ .Values.global.project_short_id }}/{{ .Release.Name }}/output"
        - name: S3_USER
          value: {{ .Values.global.credentials_minio_username  | default "" }}
        - name: S3_PASSWORD
          value: {{ .Values.global.credentials_minio_password | default ""}}
        volumeMounts:
{{ include "dynamicVolumeMounts" $ | indent 10 }}
        # ToDo add init-container to wait for db-host
      - name: mitk
        securityContext:
          runAsUser: 0
        # Gate traffic until nginx serves the loading page, so traefik never 502s a not-yet-listening pod.
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
          failureThreshold: 30
        image: "{{ .Values.global.registry_url }}/mitk-workbench:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        resources:
          requests:
            memory: "4Gi"
          limits:
            memory: "12Gi"
        env:
        {{- if and (.Values.global.gpu_support) (.Values.global.gpu_container) }}
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        # Do wee need special driver capabilities?
        # - name: NVIDIA_DRIVER_CAPABILITIES
        #   value: "compute,utility,graphics,display,video"
        {{- else }}
        - name: NVIDIA_VISIBLE_DEVICES
          value: "none"
        {{- end }}
        - name: no_proxy
          value: "traefik-{{ .Values.global.instance_uid | default 0 }}.{{ .Values.global.helm_namespace }}.svc"
        - name: http_proxy
          value: {{ .Values.global.http_proxy }}
        - name: https_proxy
          value: {{ .Values.global.https_proxy }}
        - name: INGRESS_PATH
          value: "applications/project/{{ .Values.global.project_id }}/release/{{ .Release.Name }}"
        volumeMounts:
{{ include "dynamicVolumeMounts" $ | indent 10 }}
      volumes:
{{ include "dynamicVolumes" $ | indent 6 }}
      imagePullSecrets:
      - name: registry-secret
