
---
apiVersion: v1
kind: Service
metadata:
  name: slim-service
  namespace: "{{ .Values.global.services_namespace }}"
  labels:
    app.kubernetes.io/name: slim
spec:
  selector:
    app.kubernetes.io/name: slim
  ports:
    - name: slim-http
      port: 80 
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slim-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.global.services_namespace }}-slim-upgrade-insecure-requests@kubernetescrd
spec:
  rules:
  - host:
    http:
      paths:
      - path: /slim
        pathType: ImplementationSpecific
        backend:
          service:
            name: slim-service
            port:
              name: slim-http
---
# Project-scoped route (/project/<id>/slim/...): auth-backend authorizes
# against the <id>, the middleware strips the prefix, and the app derives its
# base path and DICOMweb root from the document URL (local.js).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: slim-project-ingressroute
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: PathRegexp(`^/project/[^/]+/slim(/|$)`)
      middlewares:
        - name: strip-project-prefix
        - name: slim-upgrade-insecure-requests
      services:
        - name: slim-service
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware  
metadata:
  name: slim-upgrade-insecure-requests
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  headers:
    contentSecurityPolicy: "upgrade-insecure-requests"