---
apiVersion: v1
kind: Service
metadata:
  name: split-viewer-service
  namespace: "{{ .Values.global.services_namespace }}"
  labels:
    app.kubernetes.io/name: split-viewer
spec:
  selector:
    app.kubernetes.io/name: split-viewer
  ports:
    - name: split-viewer-http
      port: 3001
      targetPort: 3001
      protocol: TCP
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix-split-viewer
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  stripPrefix:
    prefixes:
    - {{ .Values.global.split_viewer_prefix }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: split-viewer-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.global.services_namespace }}-strip-prefix-split-viewer@kubernetescrd
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
spec:
  rules:
  - host:
    http:
      paths:
      - path: {{ .Values.global.split_viewer_prefix }}
        pathType: ImplementationSpecific
        backend:
          service:
            name: split-viewer-service
            port:
              number: 3001
