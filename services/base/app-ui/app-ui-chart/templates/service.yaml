---
apiVersion: v1
kind: Service
metadata:
  name: app-ui-service
  namespace: "{{ .Values.global.services_namespace }}"
  labels:
    app.kubernetes.io/name: app-ui-service
spec:
  selector:
    app.kubernetes.io/name: app-ui
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix-app-ui
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  stripPrefix:
    prefixes:
    - /app-ui
---
# Two ui.*-annotated ingresses on one service are intentional: one menu entry each (Tasks, Apps).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ui-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.global.services_namespace }}-strip-prefix-app-ui@kubernetescrd
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
    # kaapana.ai/ui.* discovery annotations — schema owned by menu-discovery work
    kaapana.ai/ui.name: "Tasks"
    kaapana.ai/ui.section: "workflows"
    kaapana.ai/ui.icon: "mdi-checkbox-multiple-marked"
    kaapana.ai/ui.order: "70"
    kaapana.ai/ui.id: "tasks"
    kaapana.ai/ui.project: "path"
    kaapana.ai/ui.path: "/app-ui/tasks"
    # Generic menu-badge mechanism: the shell polls this project-scoped endpoint
    # and renders a count badge on this entry (kube-helm /pending-applications-count).
    kaapana.ai/ui.badge-path: "/kube-helm-api/pending-applications-count"
    kaapana.ai/ui.dev-links: "Kube-Helm API=/kube-helm-api/docs,AII=/aii/docs"
spec:
  rules:
  - host:
    http:
      paths:
      - path: /app-ui
        pathType: ImplementationSpecific
        backend:
          service:
            name: app-ui-service
            port:
              number: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ui-apps-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.global.services_namespace }}-strip-prefix-app-ui@kubernetescrd
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
    kaapana.ai/ui.name: "Apps"
    kaapana.ai/ui.section: "workflows"
    kaapana.ai/ui.icon: "mdi-apps-box"
    kaapana.ai/ui.order: "71"
    kaapana.ai/ui.id: "apps"
    kaapana.ai/ui.project: "path"
    kaapana.ai/ui.path: "/app-ui/apps"
    kaapana.ai/ui.dev-links: "Kube-Helm API=/kube-helm-api/docs,AII=/aii/docs"
spec:
  rules:
  - host:
    http:
      paths:
      - path: /app-ui/apps
        pathType: ImplementationSpecific
        backend:
          service:
            name: app-ui-service
            port:
              number: 5000
---
# Project-scoped route (/project/<id>/app-ui/...): auth-backend
# authorizes against the <id>, the middlewares strip both prefixes, and the
# app derives its project scope from the document URL (see
# the shared selectedProject util in @kaapana/base-ui).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-ui-project-ingressroute
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: PathRegexp(`^/project/[^/]+/app-ui(/|$)`)
      middlewares:
        - name: strip-project-prefix
        - name: strip-prefix-app-ui
      services:
        - name: app-ui-service
          port: 5000
