---
apiVersion: v1
kind: Service
metadata:
  name: data-gallery-ui-service
  namespace: "{{ .Values.global.services_namespace }}"
  labels:
    app.kubernetes.io/name: data-gallery-ui-service
spec:
  selector:
    app.kubernetes.io/name: data-gallery-ui
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix-data-gallery-ui
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  stripPrefix:
    prefixes:
    - /data-gallery-ui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-gallery-ui-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.global.services_namespace }}-strip-prefix-data-gallery-ui@kubernetescrd
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
    # kaapana.ai/ui.* discovery annotations — schema owned by menu-discovery work
    kaapana.ai/ui.name: "Datasets"
    kaapana.ai/ui.section: "workflows"
    kaapana.ai/ui.icon: "mdi-view-gallery-outline"
    kaapana.ai/ui.order: "20"
    kaapana.ai/ui.id: "datasets"
    kaapana.ai/ui.project: "path"
    kaapana.ai/ui.dev-links: "Kaapana Backend=/kaapana-backend/docs,AII=/aii/docs"
spec:
  rules:
  - host:
    http:
      paths:
      - path: /data-gallery-ui
        pathType: ImplementationSpecific
        backend:
          service:
            name: data-gallery-ui-service
            port:
              number: 5000
---
# Project-scoped route (/project/<id>/data-gallery-ui/...): auth-backend
# authorizes against the <id>, the middlewares strip both prefixes, and the
# app derives its project scope from the document URL (see
# the shared selectedProject util in @kaapana/base-ui).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: data-gallery-ui-project-ingressroute
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: PathRegexp(`^/project/[^/]+/data-gallery-ui(/|$)`)
      middlewares:
        - name: strip-project-prefix
        - name: strip-prefix-data-gallery-ui
      services:
        - name: data-gallery-ui-service
          port: 5000
