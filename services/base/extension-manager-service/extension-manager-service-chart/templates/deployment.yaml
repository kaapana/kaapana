---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extension-manager
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: extension-manager
      app.kubernetes.io/component: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: extension-manager
        app.kubernetes.io/component: api
        network-access-external-ips: "true"
    spec:
      containers:
      - name: extension-manager-api
        image: "{{ .Values.global.registry_url }}/extension-api:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy:  {{ .Values.global.pull_policy_images }}
        env:
          - name: http_proxy
            value: {{ .Values.global.http_proxy }}
          - name: https_proxy
            value: {{ .Values.global.http_proxy }}
          - name: no_proxy
            value: ".svc,.svc.cluster,.svc.cluster.local,{{ .Values.global.hostname }}"
          - name: APPLICATION_ROOT
            value: /extensions-api
          - name: PORT
            value: "8080"
          - name: WORKERS
            value: "4"
          - name: LOG_LEVEL
            value: INFO
          - name: DATABASE_URL
            value: "postgresql+asyncpg://{{ .Values.kaapana_database.postgres_user}}:{{ .Values.kaapana_database.postgres_password}}@{{ .Values.kaapana_database.appName | default .Chart.Name }}-database-service.{{ .Values.global.services_namespace }}.svc:5432"
{{- if .Values.global.dev_files }}
          - name: DEV_FILES
            value: "True"
{{- end }}
        volumeMounts:
          - name: extensions
            mountPath: /extensions
          - name: extensions-tmp
            mountPath: /tmp
{{- if .Values.global.dev_files }}
          - name: extension-api-dev
            mountPath: /app
{{- end }}
        ports:
          - containerPort: 8080
        resources:
          limits:
            memory: "1024Mi"
          requests:
            memory: "100Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true     
      volumes:
      - name: extensions
        persistentVolumeClaim:
          claimName: extensions-pv-claim
      - name: extensions-tmp
        persistentVolumeClaim:
          claimName: extensions-tmp-pv-claim
{{- if .Values.global.dev_files }}
      - name: extension-manager-api-dev
        persistentVolumeClaim:
          claimName: {{ .Chart.Name }}-dev-pv-claim
{{- end }}
      imagePullSecrets:
        - name: registry-secret
