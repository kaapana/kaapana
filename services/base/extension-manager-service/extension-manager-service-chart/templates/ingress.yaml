---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: extension-manager-api-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: "{{  .Values.global.services_namespace  }}-strip-prefix-extensions-api@kubernetescrd"
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
spec:
  rules:
  - host:
    http:
      paths:
      - path: /extensions-api
        pathType: Prefix
        backend:
          service:
            name: extension-manager-api
            port:
              number: 80