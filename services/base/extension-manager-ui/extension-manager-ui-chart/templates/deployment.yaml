---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extension-manager-ui
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: extension-manager-ui-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: extension-manager-ui-app
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: extension-manager-ui-container
        image: "{{ .Values.global.registry_url }}/extension-manager-ui:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy:  "{{ .Values.global.pull_policy_images }}"
        ports:
        - name: http-port
          containerPort: {{ if .Values.global.dev_files }}5173{{ else }}5000{{ end }}
        resources:
{{- if .Values.global.dev_files }}
          requests:
            memory: "5Gi"
          limits:
            memory: "5Gi"
{{- else }}
          requests:
            memory: "50Mi"
          limits:
            memory: "50Mi"
{{- end }}
        volumeMounts:
{{- if .Values.global.dev_files }}
          - name: dev-files
            mountPath: /app
{{- end }}
          - name: tmp
            mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
{{- if .Values.global.dev_files }}
          readOnlyRootFilesystem: false
{{- else }}
          readOnlyRootFilesystem: true
{{- end }}
      volumes:
{{- if .Values.global.dev_files }}
      - name: dev-files
        hostPath:
          path: {{ .Values.global.dev_files }}
          type: Directory
{{- end }}
      - name: tmp
        emptyDir: {}
      priorityClassName: kaapana-high-priority
      imagePullSecrets:
        - name: registry-secret
---
