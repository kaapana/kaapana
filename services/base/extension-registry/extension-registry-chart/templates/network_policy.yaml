---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: extension-registry-ingress
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: extension-registry
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: extension-manager
          app.kubernetes.io/component: api
    ports:
    - protocol: TCP
      port: 5000
