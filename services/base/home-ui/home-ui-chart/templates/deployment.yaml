---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-ui
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: home-ui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-ui
    spec:
      containers:
      - name: home-ui
        image: "{{ .Values.global.registry_url }}/home-ui:{{ .Values.global.kaapana_build_version }}"
        imagePullPolicy: "{{ .Values.global.pull_policy_images }}"
        ports:
        - name: http-port
          containerPort: 5000
        livenessProbe:
          httpGet:
            path: /
            port: http-port
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            memory: "10Mi"
          limits:
            memory: "100Mi"
        volumeMounts:
          - name: tmp
            mountPath: /tmp
{{- if .Values.branding.enabled }}
          - name: branding
            mountPath: /kaapana/app/branding.json
            subPath: branding.json
{{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: tmp
        emptyDir: {}
{{- if .Values.branding.enabled }}
      - name: branding
        configMap:
          name: home-ui-branding
{{- end }}
      priorityClassName: kaapana-high-priority
      imagePullSecrets:
        - name: registry-secret
