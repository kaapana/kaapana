---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-api
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-api
      app.kubernetes.io/component: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: portal-api
      containers:
      - name: portal-api
        image: "{{ .Values.global.registry_url }}/portal-api:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy:  {{ .Values.global.pull_policy_images }}
        env:
        - name: APPLICATION_ROOT
          value: /portal-api
        - name: PORT
          value: "8080"
        # single worker keeps a single in-process menu cache
        - name: WORKERS
          value: "1"
        - name: LOG_LEVEL
          value: INFO
        ports:
          - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
        resources:
          limits:
            memory: "256Mi"
          requests:
            memory: "50Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      imagePullSecrets:
        - name: registry-secret
