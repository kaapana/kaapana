---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-api
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-api
      app.kubernetes.io/component: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-api
        app.kubernetes.io/component: api
    spec:
      containers:
      - name: storage-api
        image: "{{ .Values.global.registry_url }}/storage-api:{{ .Values.global.kaapana_build_version }}"
        imagePullPolicy: {{ .Values.global.pull_policy_images }}
        env:
        - name: APPLICATION_ROOT
          value: /storage-api
        - name: PORT
          value: "8080"
        - name: WORKERS
          value: "4"
        - name: LOG_LEVEL
          value: INFO
        - name: DICOM_WADORS_ENDPOINT
          value: "http://dicom-web-filter-service.{{ .Values.global.services_namespace }}.svc:8080"
        - name: MINIO_URL
          value: "minio-service.{{ .Values.global.services_namespace }}.svc:9000"
{{- if .Values.global.dev_files }}
        - name: DEV_FILES
          value: "True"
{{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
{{- if .Values.global.dev_files }}
        - name: storage-api-dev
          mountPath: /app
{{- end }}
        ports:
          - containerPort: 8080
        resources:
          limits:
            memory: "1024Mi"
          requests:
            memory: "100Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: tmp
        emptyDir: {}
{{- if .Values.global.dev_files }}
      - name: storage-api-dev
        persistentVolumeClaim:
          claimName: {{ .Chart.Name }}-dev-pv-claim
{{- end }}
      imagePullSecrets:
        - name: registry-secret
