services:
  postgres:
    image: "docker.io/postgres:17.7-alpine"
    hostname: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=kaapanauser
      - POSTGRES_PASSWORD=kaapanapassword
      - POSTGRES_DB=kaapanauser
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaapanauser"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - workflow

  workflow-api:
    build:
      context: ../workflow-api/docker
    image: workflow-api:latest
    ports:
      - 8080:8080
      - "5678:5678" # debugpy
    environment:
      - APPLICATION_ROOT=/
      - PORT=8080
      - WORKERS=4
      - DATABASE_URL=postgresql://kaapanauser:kaapanapassword@postgres:5432/kaapanauser
      - DEV_FILES=True
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../workflow-api/docker/files:/app
    networks:
      - workflow

  # Dev server with hot reload. Build base-ui and run `npm ci` in docker/files
  # first (see docker/README.md); the mounted sources bring their node_modules.
  # The dataset picker needs kaapana-backend and stays empty here.
  workflow-ui:
    image: docker.io/node:lts-alpine3.23
    working_dir: /kaapana/workflow-ui/docker/files
    ports:
      - 5000:5000
    environment:
      - WORKFLOW_API_PROXY_TARGET=http://workflow-api:8080
    volumes:
      - ../workflow-ui/docker/files:/kaapana/workflow-ui/docker/files:cached
      - ../base-ui/docker/files:/kaapana/base-ui/docker/files:ro
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - workflow-api
    networks:
      - workflow

volumes:
  database:

networks:
  workflow:
