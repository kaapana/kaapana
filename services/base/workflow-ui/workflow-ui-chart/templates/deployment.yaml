---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-ui
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-ui-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-ui-app
    spec:
      containers:
      - name: workflow-ui-container
        image: "{{ .Values.global.registry_url }}/workflow-ui:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy:  "{{ .Values.global.pull_policy_images }}"
        ports:
        - name: http-port
          containerPort: 5000
        livenessProbe:
          httpGet:
            path: /workflow-ui/
            port: http-port
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
{{- if .Values.global.dev_files }}
          # The vite dev server needs far more memory than nginx.
          limits:
            memory: "5Gi"
          requests:
            memory: "100Mi"
{{- else }}
          limits:
            memory: "100Mi"
          requests:
            memory: "10Mi"
{{- end }}
        volumeMounts:
{{- if .Values.global.dev_files }}
          # Mount source files for hot reload in dev mode
          - name: dev-files
            mountPath: /kaapana/workflow-ui/docker/files
{{- end }}
          - name: tmp
            mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: {{ if .Values.global.dev_files }}false{{ else }}true{{ end }}  # Allow writes for dev mode (node_modules, vite cache)
      volumes:
{{- if .Values.global.dev_files }}
      # Mount workflow-ui source code from Kaapana repo for hot reload
      - name: dev-files
        hostPath:
          path: {{ .Values.global.dev_files }}
          type: Directory
{{- end }}
      - name: tmp
        emptyDir: {}
      priorityClassName: kaapana-high-priority
      imagePullSecrets:
        - name: registry-secret
---