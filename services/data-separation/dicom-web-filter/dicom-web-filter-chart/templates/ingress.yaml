---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix-dicom-web-filter
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  stripPrefix:
    prefixes:
    - /dicom-web-filter
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dicom-web-filter-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{  .Values.global.services_namespace  }}-strip-prefix-dicom-web-filter@kubernetescrd
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
spec:
  rules:
  - host:
    http:
      paths:
      - path: /dicom-web-filter
        pathType: ImplementationSpecific
        backend:
          service:
            name: dicom-web-filter-service
            port:
              number: 8080
---
# Project-scoped route (/project/<id>/dicom-web-filter/...): auth-backend
# authorizes against the <id> and injects the enriched Project header, the
# middlewares strip both prefixes before the request reaches the service.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dicom-web-filter-project-ingressroute
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: PathRegexp(`^/project/[^/]+/dicom-web-filter(/|$)`)
      middlewares:
        - name: strip-project-prefix
        - name: strip-prefix-dicom-web-filter
      services:
        - name: dicom-web-filter-service
          port: 8080

