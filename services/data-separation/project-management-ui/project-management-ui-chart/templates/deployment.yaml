---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-management-ui
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-management-ui-app
  strategy:
    type: Recreate
  template: 
    metadata:
      labels:
        app.kubernetes.io/name: project-management-ui-app
    spec:      
      containers:
      - name: project-management-ui-container
        image: "{{ .Values.global.registry_url }}/project-management-ui:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy:  {{ .Values.global.pull_policy_pods }}
        env:
        - name: POSTGRES_USER
          value: {{ .Values.global.postgres_user }}
        ports:
          - name: proj-list-http
            containerPort: {{ if .Values.global.dev_files }}5174{{ else }}80{{ end }}
        resources:
          limits:
            memory: "5Gi"
          requests:
            memory: "100Mi"
        volumeMounts:
{{- if .Values.global.dev_files }}
          # Mount source files for hot reload in dev mode
          - name: dev-files
            mountPath: /app
          - name: cache
            mountPath: /tmp/.yarn-cache
{{- end }}
          - name: tmp
            mountPath: /var/run
          - name: cache
            mountPath: /var/cache/nginx
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: {{ if .Values.global.dev_files }}false{{ else }}true{{ end }}  # Allow writes for dev mode (node_modules, vite cache)
      volumes:
{{- if .Values.global.dev_files }}
      # Mount project-management-ui source code from Kaapana repo for hot reload
      - name: dev-files
        hostPath:
          path: {{ .Values.global.dev_files }}
          type: Directory
{{- end }}
      - name: cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      priorityClassName: kaapana-high-priority
      imagePullSecrets:
        - name: registry-secret
---
