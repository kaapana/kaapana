---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-management-ui
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-management-ui-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-management-ui-app
    spec:
      containers:
      - name: project-management-ui-container
        image: "{{ .Values.global.registry_url }}/project-management-ui:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy:  {{ .Values.global.pull_policy_pods }}
        ports:
          - name: proj-list-http
            containerPort: 5000
        livenessProbe:
          httpGet:
            path: /
            port: proj-list-http
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            memory: "10Mi"
          limits:
            memory: "100Mi"
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: tmp
        emptyDir: {}
      priorityClassName: kaapana-high-priority
      imagePullSecrets:
        - name: registry-secret
---