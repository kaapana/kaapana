---
apiVersion: batch/v1
kind: Job
metadata:
  name: "create-project-user"
  namespace: "{{ .Values.global.project_namespace }}"
  labels:
    app.kubernetes.io/name: create-project-user
spec:
  template:
    metadata:
      name: create-project-user
      labels:
        app.kubernetes.io/name: create-project-user
    spec:
        initContainers:
        - name: init
          image: "{{ .Values.global.registry_url }}/service-checker:{{ .Values.global.kaapana_build_version  }}"
          imagePullPolicy: "{{ .Values.global.pull_policy_images }}"
          env:
            - name: WAIT
              value: "keycloak,keycloak-internal-service.{{  .Values.global.admin_namespace  }}.svc,443"
            - name: DELAY
              value: "3"
            - name: TIMEOUT
              value: "10"
        containers:
        - name: create-project-user
          image: "{{ .Values.global.registry_url }}/create-project-user:{{ .Values.global.kaapana_build_version  }}"
          imagePullPolicy:  "{{ .Values.global.pull_policy_images }}"
          resources:
            requests:
              memory: 200Mi
            limits:
              memory: 200Mi
          env:
            - name: KEYCLOAK_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaapana-service-password
                  key: kaapana-service-password
            - name: KEYCLOAK_HOST
              value: "keycloak-internal-service.{{  .Values.global.admin_namespace  }}.svc"
            - name: KAAPANA_PROJECT_SHORT_ID
              value: "{{ .Values.global.project_short_id }}"
            - name: KAAPANA_PROJECT_ID
              value: "{{ .Values.global.project_id }}"
            - name: SERVICES_NAMESPACE
              value: "{{ .Values.global.services_namespace }}"
            - name: KAAPANA_PROJECT_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: project-user-credentials
                  key: project-user
            - name: KAAPANA_PROJECT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-user-credentials
                  key: project-user-password
        restartPolicy: Never
        imagePullSecrets:
        - name: registry-secret