{{- $project_ns := .Values.global.project_namespace }}
{{- $services_ns := .Values.global.services_namespace }}

############################
# ServiceAccount (project ns)
############################

apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-worker-sa
  namespace: {{ $project_ns }}


############################
# RoleBinding: airflow-worker-sa-binding -> airflow-copy-from-scheduler
############################

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-worker-sa-binding-{{ $project_ns }}
  namespace: {{ $services_ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-copy-from-scheduler
subjects:
  - kind: ServiceAccount
    name: airflow-worker-sa
    namespace: {{ $project_ns }}

