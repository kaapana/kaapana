{{- if .Values.global.restricted_rbac }}
{{- $project_ns := .Values.global.project_namespace }}
{{- $services_ns := .Values.global.services_namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: create-project-user-sa
  namespace: {{ $project_ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: create-project-user-sa-binding-{{ $project_ns }}
  namespace: {{ $services_ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-managed-namespaces-editor
subjects:
  - kind: ServiceAccount
    name: create-project-user-sa
    namespace: {{ $project_ns }}
{{- end }}
