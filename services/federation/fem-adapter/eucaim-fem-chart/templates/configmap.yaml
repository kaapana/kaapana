---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-fem-client-config
  namespace: {{ .Values.global.services_namespace }}
data:
  config.py: |
    # Generated by eucaim-fem-chart from the platform's extension_params.
    # Broker credentials and TLS material are NOT here -- they are mounted
    # from the {{ .Release.Name }}-broker-credentials Secret (env vars /
    # files under /app/config/tls), never baked into this ConfigMap or the
    # image.
    import os

    node_name = "{{ .Values.global.node_name }}"
    node_user = os.environ["NODE_USER"]
    node_password = os.environ["NODE_PASSWORD"]

    central_server_ip = "{{ .Values.global.rabbitmq_host }}"
    ssl_central_server_port = {{ .Values.global.rabbitmq_port | default 5671 }}
    central_rabbitmq_vhost = "{{ .Values.global.rabbitmq_vhost }}"

    ssl_active = {{ if .Values.global.ssl_active }}True{{ else }}False{{ end }}
    ssl_cafile_path = "/app/config/tls/ca.pem"
    ssl_client_cert_path = "/app/config/tls/client-cert.pem"
    ssl_client_keys_path = "/app/config/tls/client-key.pem"

    sandbox_path = "/sandbox"
    data_path = "/data"
    # fem-adapter, not FEM-client, drives the actual task via workflow-api.
    api_base_url = "http://{{ .Release.Name }}-fem-adapter.{{ .Values.global.services_namespace }}.svc:8090"
    json_launcher = "/app/config/json_launcher.json"
    # No extra %%PLACEHOLDER%% resolution beyond what run_tool.py already
    # builds into argument_values (task_id, execution_id, user_id, ...).
    task_info_vars = {}
  json_launcher.json: |
    {
      "submit_run": {
        "cmd": "curl -sS -X POST '%%api_base_url%%/fem/submit_run' -H 'Content-Type: application/json' -d '{\"execution_id\": \"%%execution_id%%\", \"task_id\": \"%%task_id%%\", \"user_id\": \"%%user_id%%\", \"node_name\": \"%%node_name%%\", \"sandbox_host\": \"%%sandbox_host%%\", \"sandbox_fem\": \"%%sandbox_fem%%\", \"data_path\": \"%%data_path%%\", \"token\": \"%%token%%\", \"command\": \"%%TASK_COMMAND%%\"}'"
      }
    }
