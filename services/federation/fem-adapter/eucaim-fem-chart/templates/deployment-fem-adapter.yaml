---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-fem-adapter
  namespace: {{ .Values.global.services_namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-fem-adapter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-fem-adapter
    spec:
      containers:
        - name: fem-adapter
          image: "{{ .Values.global.registry_url }}/fem-adapter:{{ .Values.global.kaapana_build_version }}"
          imagePullPolicy: {{ .Values.global.pull_policy_images }}
          env:
            - name: PORT
              value: "8090"
            - name: FEM_ADAPTER_WORKFLOW_API_BASE_URL
              value: "http://workflow-api.{{ .Values.global.services_namespace }}.svc:80/v1"
            - name: FEM_ADAPTER_PROJECT_ID
              value: "{{ .Values.global.project_namespace | default `admin` }}"
            # The real workflow engine adapter, unlike the dev-sandbox's
            # "dummy" engine. DUMMY_ENGINE_AUTOCOMPLETE (see config.py) is
            # never set here -- it only exists to nudge workflow-api's
            # test-only DummyAdapter and must never run against a real
            # engine.
            - name: FEM_ADAPTER_WORKFLOW_ENGINE
              value: "airflow"
          ports:
            - containerPort: 8090
          volumeMounts:
            # Not read or written by fem-adapter's application code yet --
            # reserved for the not-yet-implemented bridge that stages
            # Kaapana workflow outputs back into FEM's
            # <sandbox>/<user_id>/<execution_id>/ layout for FEM-client's
            # send_files action (see the service README's "known gap").
            # Mounting it now avoids a second chart change once that bridge
            # is built.
            - name: sandbox
              mountPath: /sandbox
          resources:
            limits:
              memory: "256Mi"
            requests:
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
      imagePullSecrets:
        - name: registry-secret
      volumes:
        - name: sandbox
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-sandbox-pv-claim
