---
# Shared sandbox volume: FEM-client stages federated tasks in and out of
# <sandbox>/<user_id>/<execution_id>/ (see app/services/data_operations.py
# in the FEM-client source, send_files/receive_files). It is mounted
# read-write into both the fem-client and fem-adapter pods so that, once
# fem-adapter is extended to stage Kaapana workflow outputs back out to FEM
# (see the service README's "known gap"), it can write into the same paths
# FEM-client's send_files action reads from.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-sandbox-pv-volume
  labels:
    type: local
spec:
  capacity:
    storage: "10Gi"
  storageClassName: host-dir
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "{{ .Values.global.fast_data_dir }}/{{ .Values.global.sandbox_host_directory }}"
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: {{ .Release.Name }}-sandbox-pv-claim
    namespace: {{ .Values.global.services_namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-sandbox-pv-claim
  namespace: {{ .Values.global.services_namespace }}
spec:
  storageClassName: host-dir
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "10Gi"
  volumeName: {{ .Release.Name }}-sandbox-pv-volume
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-data-pv-volume
  labels:
    type: local
spec:
  capacity:
    storage: "10Gi"
  storageClassName: host-dir
  accessModes:
    - ReadOnlyMany
  hostPath:
    path: "{{ .Values.global.fast_data_dir }}/{{ .Values.global.data_host_directory }}"
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: {{ .Release.Name }}-data-pv-claim
    namespace: {{ .Values.global.services_namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data-pv-claim
  namespace: {{ .Values.global.services_namespace }}
spec:
  storageClassName: host-dir
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: "10Gi"
  volumeName: {{ .Release.Name }}-data-pv-volume
