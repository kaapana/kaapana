apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-webserver-config
  namespace: "{{ .Values.global.services_namespace }}"
data:
   webserver_config.py: |+
    from urllib.parse import urlparse, urljoin
    from flask import get_flashed_messages, request, redirect, flash, url_for
    from flask_appbuilder import expose
    from flask_appbuilder._compat import as_unicode
    from flask_appbuilder.security.views import AuthView
    from airflow.www.fab_security.manager import AUTH_REMOTE_USER
    from flask_login import login_user, logout_user
    from airflow.www.security import AirflowSecurityManager

    AUTH_TYPE = AUTH_REMOTE_USER
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Admin"


    def _safe_next_url(target):
        """Allow only same-host relative redirects, to block open-redirect attacks."""
        if not target:
            return None
        ref_url = urlparse(request.host_url)
        test_url = urlparse(urljoin(request.host_url, target))
        if test_url.scheme in ("http", "https") and ref_url.netloc == test_url.netloc:
            return target
        return None


    class CustomAuthRemoteUserView(AuthView):
        login_template = ""

        @expose("/login/")
        def login(self):
            username = request.headers.get("X-Forwarded-Preferred-Username")
            next_url = _safe_next_url(request.args.get("next"))

            if username:
                user = self.appbuilder.sm.auth_user_remote_user(username)
                if user is None:
                    flash(as_unicode(self.invalid_login_message), "warning")
                else:
                    login_user(user)
                    get_flashed_messages()
                    return redirect(next_url or self.appbuilder.get_url_for_index)
            else:
                flash(as_unicode(self.invalid_login_message), "warning")

            get_flashed_messages()
            return redirect(next_url or self.appbuilder.get_url_for_index)

        @expose("/logout/")
        def logout(self):
            logout_user()
            return redirect("/oauth2/sign_out?redirect=/")

    class CustomAirflowSecurityManager(AirflowSecurityManager):
        authremoteuserview = CustomAuthRemoteUserView


    SECURITY_MANAGER_CLASS = CustomAirflowSecurityManager
