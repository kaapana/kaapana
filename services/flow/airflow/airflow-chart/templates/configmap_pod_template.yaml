apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-pod-template
  namespace: "{{ .Values.global.services_namespace }}"
data:
   pod_template.yaml: |+
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: placeholder-name
      namespace: "{{ .Values.global.services_namespace }}"
      labels:
        network-access-internal-services: "true"
    spec:
      initContainers:
        - name: sync-dags-plugins
          image: "{{ .Values.global.registry_url }}/airflow:{{ .Values.global.kaapana_build_version }}"
          imagePullPolicy: "{{ .Values.global.pull_policy_images }}"
          command:
            - sh
            - -c
            - |
              sync() {
                wget -q -r -nH --cut-dirs=1 --no-parent --reject="index.html*" \
                    -P /sync/$1 \
                    http://airflow-dag-sync-service.${SERVICES_NAMESPACE}.svc/$1/
                rc=$?; [ $rc -eq 0 ] || [ $rc -eq 8 ] || exit $rc
              }

              sync dags && echo "DAGs synced successfully"
              sync plugins && echo "Plugins synced successfully"
          env:
            - name: SERVICES_NAMESPACE
              value: "{{ .Values.global.services_namespace }}"
            - name: no_proxy
              value: ".svc,.svc.cluster,.svc.cluster.local"
          volumeMounts:
            - name: airflow-dags
              mountPath: /sync/dags
            - name: airflow-plugins
              mountPath: /sync/plugins
      containers:
        - name: base
          image: "{{ .Values.global.registry_url }}/airflow:{{ .Values.global.kaapana_build_version }}"
          imagePullPolicy: "{{ .Values.global.pull_policy_images }}"
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: KubernetesExecutor
            - name: AIRFLOW__LOGGING__LOGGING_LEVEL
              value: "INFO"
            {{- include "airflow.env.common" . | nindent 12 }}
            {{- include "airflow.env.taskRuntime" . | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /kaapana/mounted/workflows/models
            - name: workflowdata
              mountPath: /kaapana/mounted/workflows/data
            - name: airflow-plugins
              mountPath: /kaapana/mounted/workflows/plugins
            - name: airflow-dags
              mountPath: /kaapana/mounted/workflows/dags
            - name: tmp
              mountPath: /kaapana/mounted/workflows/
            - name: tmpfs
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: 10Mi
            limits:
              memory: 10Gi
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-secret
      volumes:
        - name: airflow-dags
          emptyDir: {}
        - name: airflow-plugins
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: tmpfs
          emptyDir: {}
        - name: dshm
          emptyDir: {}
