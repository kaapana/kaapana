{{- if .Values.global.restricted_rbac }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-managed-namespaces
  namespace: {{ .Values.global.services_namespace }}
data:
  namespaces: "{{ .Values.global.services_namespace }},{{ required `global.platform_prefix is required` .Values.global.platform_prefix }}-project-admin"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-managed-namespaces-editor
  namespace: {{ .Values.global.services_namespace }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - airflow-managed-namespaces
    verbs:
      - get
      - patch
      - update
  - apiGroups: ["apps"]
    resources:
      - deployments
    resourceNames:
      - airflow-scheduler
    verbs:
      - get
      - patch
      - update
{{- end }}
