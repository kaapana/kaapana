
############################
# Role (project ns)
# Minimal rights needed by:
#   - init container (kubectl cp = pods/exec)
############################

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-copy-from-scheduler
  namespace: {{ .Values.global.services_namespace }}
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
{{- if .Values.global.managed_kubernetes }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-managed-namespaces
  namespace: {{ .Values.global.services_namespace }}
data:
  namespaces: "{{ .Values.global.services_namespace }},project-admin"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-managed-namespaces-editor
  namespace: {{ .Values.global.services_namespace }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - airflow-managed-namespaces
    verbs:
      - get
      - patch
      - update
  - apiGroups: ["apps"]
    resources:
      - deployments
    resourceNames:
      - airflow-scheduler
    verbs:
      - get
      - patch
      - update
{{- end }}
