
############################
# Role (project ns)
# Minimal rights needed by:
#   - init container (kubectl cp = pods/exec)
############################

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-copy-from-scheduler
  namespace: {{ .Values.global.services_namespace }}
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create