---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver-service
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  selector:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: webserver
  ports:
    - port: 8080
      name: airflow-http
---
apiVersion: networking.k8s.io/v1 
kind: Ingress
metadata:
  name: airflow-ingress-ip
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
    kaapana.ai/ui.name: "Airflow"
    kaapana.ai/ui.section: "system"
    kaapana.ai/ui.section-label: "System"
    kaapana.ai/ui.section-icon: "mdi-view-dashboard-variant"
    kaapana.ai/ui.section-order: "30"
    kaapana.ai/ui.order: "10"
    kaapana.ai/ui.path: "/flow/home"
spec:
  rules:
  - host: 
    http:
      paths:
      - path: /flow
        pathType: ImplementationSpecific
        backend:
          service:
            name: airflow-webserver-service
            port:
              name: airflow-http
---