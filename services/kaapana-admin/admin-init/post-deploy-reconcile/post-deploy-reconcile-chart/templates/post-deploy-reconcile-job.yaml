---
apiVersion: batch/v1
kind: Job
metadata:
  name: post-deploy-reconcile
  namespace: "{{ .Values.global.admin_namespace }}"
spec:
  backoffLimit: 0
  template:
    metadata:
      name: post-deploy-reconcile
    spec:
      initContainers:
      - name: init
        image: "{{ .Values.global.registry_url }}/service-checker:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy: "{{ .Values.global.pull_policy_images }}"
        env:
        - name: WAIT
          value: "keycloak,keycloak-internal-service.{{ .Values.global.admin_namespace }}.svc,443;access-information-interface,aii-service.{{ .Values.global.services_namespace }}.svc,8080;keycloak-database,keycloak-database-service.{{ .Values.global.admin_namespace }}.svc,5432;access-information-interface-database,access-information-interface-database-service.{{ .Values.global.services_namespace }}.svc,5432"
        - name: DELAY
          value: "3"
        - name: TIMEOUT
          value: "10"
      containers:
      - name: post-deploy-reconcile
        image: "{{ .Values.global.registry_url }}/post-deploy-reconcile:{{ .Values.global.kaapana_build_version }}"
        imagePullPolicy: "{{ .Values.global.pull_policy_images }}"
        env:
        - name: ADMIN_NAMESPACE
          value: "{{ .Values.global.admin_namespace }}"
        - name: SERVICES_NAMESPACE
          value: "{{ .Values.global.services_namespace }}"
      restartPolicy: Never
      serviceAccountName: kaapana-kube-admin
      imagePullSecrets:
      - name: registry-secret
