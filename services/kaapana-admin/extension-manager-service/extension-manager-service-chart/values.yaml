admin: true
global:
  admin_namespace: "admin"
  services_namespace: "services"
  namespace: "{{ .Values.global.admin_namespace }}"
  registry_url: ""
  credentials_registry_username: ""
  credentials_registry_password: ""
  offline_mode: false
  plain_http: false
  hostname: ""
  http_proxy: ""
  kaapana_build_version: ""
  pull_policy_images: "Always"
  storage_node: "storage"
  dynamicVolumes:
    - name: extension-manager-extensions
      storage_class: slow
      storage: 10Gi
    - name: extension-manager-tmp
      storage_class: slow
      storage: 10Gi

kaapana_database:
  admin: true
  postgres_user: "postgres"
  postgres_password: "postgres"
  postgres_db: "postgres"
  appName: "extension-manager"

extension_upload:
  max_bytes: 104857600
