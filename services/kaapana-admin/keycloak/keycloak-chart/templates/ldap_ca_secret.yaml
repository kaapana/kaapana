{{- if .Values.global.keycloak_ldap_ca }}
# Keycloak needs the CA certificates of the site's LDAP servers to verify LDAPS and
# StartTLS connections.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-ldap-ca
  namespace: "{{ .Values.global.admin_namespace }}"
type: Opaque
data:
  ca.crt: {{ .Values.global.keycloak_ldap_ca | b64enc | quote }}
{{- end }}
