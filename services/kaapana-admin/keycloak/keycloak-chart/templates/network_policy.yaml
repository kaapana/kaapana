{{- if .Values.global.keycloak_ldap_egress_cidrs }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-ldap-egress
  namespace: "{{ .Values.global.admin_namespace }}"
spec:
  # Allow Keycloak to reach configured external LDAP endpoints without
  # broadening egress for the entire admin namespace.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/component: keycloak
  policyTypes:
  - Egress
  egress:
  {{- range .Values.global.keycloak_ldap_egress_cidrs }}
  - to:
    - ipBlock:
        cidr: {{ . | quote }}
    ports:
    - protocol: TCP
      port: 389
    - protocol: TCP
      port: 636
  {{- end }}
{{- end }}
