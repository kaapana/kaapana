{{- if .Values.global.keycloak_ldap_egress_cidrs }}
# The admin namespace only allows traffic to addresses inside the cluster.
# Without this policy, Keycloak cannot reach an external LDAP or AD server, and
# logins and user syncs hang. The policy opens LDAP and LDAPS for the Keycloak pods
# only, so the rest of the namespace stays restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-ldap-egress
  namespace: "{{ .Values.global.admin_namespace }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/component: keycloak
  policyTypes:
  - Egress
  egress:
  {{- range .Values.global.keycloak_ldap_egress_cidrs }}
  - to:
    - ipBlock:
        cidr: {{ . | quote }}
    ports:
    - protocol: TCP
      port: 389
    - protocol: TCP
      port: 636
  {{- end }}
{{- end }}
