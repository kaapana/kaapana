---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-external-service
  namespace: "{{  .Values.global.admin_namespace  }}"
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak
  type: ClusterIP
  ports:
  - name: kc-http-port
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-internal-service
  namespace: "{{  .Values.global.admin_namespace  }}"
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak
  type: ClusterIP
  ports:
  - name: kc-https-port
    port: 443
    targetPort: https
    protocol: TCP
  - name: kc-admin-port
    port: 9090
    targetPort: admin
    protocol: TCP
---
apiVersion: networking.k8s.io/v1 
kind: Ingress
metadata:
  name: keycloak-ingress-ip
  namespace: "{{  .Values.global.admin_namespace  }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure

    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
    kaapana.ai/ui.name: "Keycloak"
    kaapana.ai/ui.section: "system"
    kaapana.ai/ui.order: "30"
    kaapana.ai/ui.path: "/auth/admin/master/console/#/kaapana"
spec:
  rules:
  - host: 
    http:
      paths:
      - path: /auth
        pathType: ImplementationSpecific
        backend:
          service:
            name: keycloak-external-service
            port:
              name: kc-http-port
---