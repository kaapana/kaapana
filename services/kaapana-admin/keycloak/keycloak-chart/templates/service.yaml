---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-external-service
  namespace: "{{  .Values.global.admin_namespace  }}"
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak
  type: ClusterIP
  ports:
  - name: kc-http-port
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-internal-service
  namespace: "{{  .Values.global.admin_namespace  }}"
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak
  type: ClusterIP
  ports:
  - name: kc-https-port
    port: 443
    targetPort: https
    protocol: TCP
  - name: kc-admin-port
    port: 9090
    targetPort: admin
    protocol: TCP
---
apiVersion: networking.k8s.io/v1 
kind: Ingress
metadata:
  name: keycloak-ingress-ip
  namespace: "{{  .Values.global.admin_namespace  }}"
  annotations:  
    {{- if or (eq .Values.global.external_ingress "traefik") (not .Values.global.external_ingress) }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- end }}
    {{- if eq .Values.global.external_ingress "nginx" }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
spec:
  {{- if and .Values.global.external_ingress (ne .Values.global.external_ingress "") }}
  ingressClassName: {{ .Values.global.external_ingress | quote }}
  {{- end }}
  rules:
  - host: {{ .Values.global.hostname }}
    http:
      paths:
      - path: /auth
        pathType: ImplementationSpecific
        backend:
          service:
            name: keycloak-external-service
            port:
              name: kc-http-port
---