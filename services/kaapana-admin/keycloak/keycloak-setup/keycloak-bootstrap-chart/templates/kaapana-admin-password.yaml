apiVersion: v1
kind: Secret
metadata:
  name: "kaapana-admin-password"
  namespace: "{{ .Values.global.admin_namespace }}"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # The kaapana-admin client secret is the ONLY persisted Keycloak credential.
  # keep + lookup preserve it across redeploys; generated once on first install.
  # lookup must use admin_namespace (release namespace differs from resource namespace).
  {{- $secretObj := (lookup "v1" "Secret" .Values.global.admin_namespace "kaapana-admin-password") | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $alphaNum := ( randAlphaNum 28 ) }}
  {{- $special := ( trunc 4 ( shuffle "!§$%&/()=?-+[]^")) }}
  {{- $password := (shuffle ( nospace ( cat $alphaNum $special ))) }}
  {{- $mySecret := (get $secretData "kaapana-admin-password") | default ( $password | b64enc) }}
  kaapana-admin-password: {{ $mySecret | quote }}
