apiVersion: v1
kind: Secret
metadata:
  name: "kaapana-service-password"
  namespace: "{{ .Values.global.services_namespace }}"
type: Opaque
data:
  # retrieve the secret data using lookup function from the admin namespace
  {{- $secretObj := (lookup "v1" "Secret" .Values.global.admin_namespace "kaapana-service-password") | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $mySecret := required "kaapana-service-password not found in admin namespace — deploy keycloak-setup-chart first" (get $secretData "kaapana-service-password") }}
  kaapana-service-password: {{ $mySecret | quote }}
