{{- $uuid := uuidv4 | trunc 10 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-kube-helm-collections-{{ $uuid }}
  namespace: "{{ .Values.global.admin_namespace }}"
spec:
  template:
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: kaapana.io/rwo-anchor
                    operator: In
                    values:
                      - "true"
              topologyKey: kubernetes.io/hostname
      {{- if .Values.global.storage_node }}
      nodeSelector:
        kaapana.io/node: {{ .Values.global.storage_node }}
      {{- end }}
      containers:
      - name: copy-kube-helm-collections-{{ $uuid }}
        image: "{{ .Values.kube_helm_collection }}"
        {{- if .Values.global.offline_mode }}
        imagePullPolicy: IfNotPresent
        {{- else }}
        imagePullPolicy: Always
        {{- end }}
        env:
        - name: ACTION
          value: copy
        - name: TARGET_PREFIX
          value: "{{ .Values.global.target_prefix }}"
        volumeMounts:
        - name: data
          mountPath: /kaapana/mounted/extensions
          subPath: extensions
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: extensions-pv-claim
      restartPolicy: Never
      imagePullSecrets:
      - name: registry-secret
  backoffLimit: 0
