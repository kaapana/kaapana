  
apiVersion: v1
kind: Service
metadata:
  name: kube-helm-service
  namespace: "{{  .Values.global.admin_namespace  }}"
  labels:
    app.kubernetes.io/name: kube-helm
spec:
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-helm
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kh-strip-prefix
  namespace: "{{  .Values.global.admin_namespace  }}"
spec:
  stripPrefix:
    prefixes:
    - /kube-helm-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-helm-ingress
  namespace: "{{  .Values.global.admin_namespace  }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{  .Values.global.admin_namespace  }}-kh-strip-prefix@kubernetescrd
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
spec:
  rules:
  - host:
    http:
      paths:
      - path: /kube-helm-api
        pathType: ImplementationSpecific
        backend:
          service:
            name: kube-helm-service
            port:
              number: 5000
---
# Project-scoped route (/project/<id>/kube-helm-api/...): auth-backend
# authorizes against the <id> and injects the enriched Project header, the
# middlewares strip both prefixes before the request reaches the service.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kube-helm-project-ingressroute
  namespace: "{{  .Values.global.admin_namespace  }}"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: PathRegexp(`^/project/[^/]+/kube-helm-api(/|$)`)
      middlewares:
        - name: strip-project-prefix
        - name: kh-strip-prefix
      services:
        - name: kube-helm-service
          port: 5000
---
