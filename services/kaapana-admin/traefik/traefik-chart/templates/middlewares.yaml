---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-strip-prefix
  namespace: "{{  .Values.global.helm_namespace  }}"
spec:
  stripPrefix:
    prefixes:
    - /traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-redirect
  namespace: "{{  .Values.global.helm_namespace  }}"
spec:
  redirectRegex:
    regex: ^.*/traefik$
    replacement: /traefik/dashboard/#/
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-check
  namespace: "{{  .Values.global.helm_namespace  }}"
spec:
  forwardAuth:
    address: http://auth-backend-service.{{  .Values.global.admin_namespace  }}.svc:5000/auth-check
    authResponseHeaders:
      - Project
---
# Strips the platform-wide /project/<id> URL prefix from the project-scoped
# IngressRoute of kube-helm. auth-backend resolves the <id> for authorization
# before the strip happens, so the service receives the plain path plus the
# enriched Project header. Cross-namespace middleware references are disabled,
# hence one copy per namespace - the services-namespace copy is owned by the
# platform chart, which creates that namespace.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-project-prefix
  namespace: "{{  .Values.global.admin_namespace  }}"
spec:
  stripPrefixRegex:
    regex:
      - "^/project/[^/]+"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: remove-auth-headers
  namespace: "{{  .Values.global.helm_namespace  }}"
spec:
  headers:
    customRequestHeaders:
      X-Auth-Token: ""
      X-Auth-Username: ""
      X-Auth-Userid: ""
      X-Auth-Email: ""
      X-Auth-Subject: ""
      Authorization: ""
      kc-state: ""
      cookie: ""
---
    