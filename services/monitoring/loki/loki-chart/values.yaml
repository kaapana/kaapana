global:
  pull_policy: "IfNotPresent"
  dynamicVolumes:
  - name: loki

loki:
  port: 3100
  resources:
    requests:
      # Raised 256Mi/1Gi -> 768Mi/1536Mi: Loki was OOM-killed during log
      # replay after restarts/redeploys.
      memory: "768Mi"
      cpu: "100m"
    limits:
      memory: "1536Mi"
      cpu: "1000m"
  storage_size: 10Gi
