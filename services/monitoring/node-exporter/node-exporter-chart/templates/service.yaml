{{- /* promtail and node-exporter need hostPath volumes (rejected by PodSecurity baseline) and cluster-wide reads: not deployed with restricted RBAC */}}
{{- if not .Values.global.restricted_rbac }}
kind: Service
apiVersion: v1
metadata:
  name: node-exporter
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port:   '9100'
spec:
  selector:
      app.kubernetes.io/component: exporter
      app.kubernetes.io/name: node-exporter
  ports:
  - name: node-exporter
    protocol: TCP
    port: 9100
    targetPort: 9100
{{- end }}
