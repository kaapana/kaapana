apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/name: subpath-reaper
  name: subpath-reaper
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: maintenance
      app.kubernetes.io/name: subpath-reaper
  template:
    metadata:
      labels:
        app.kubernetes.io/component: maintenance
        app.kubernetes.io/name: subpath-reaper
    spec:
      serviceAccountName: subpath-reaper
      # Needed to enter the host mount namespace (nsenter -t 1 -m) and perform the
      # unmount where the kubelet sees it.
      hostPID: true
      # Run on every node, including any tainted control-plane node.
      tolerations:
        - operator: Exists
      containers:
        - name: subpath-reaper
          image: "{{ .Values.global.registry_url }}/subpath-reaper:{{ .Values.global.kaapana_build_version }}"
          imagePullPolicy: {{ .Values.global.pull_policy_images }}
          env:
            - name: INTERVAL
              value: "{{ .Values.subpathReaper.interval }}"
            - name: GRACE_MIN
              value: "{{ .Values.subpathReaper.graceMinutes }}"
            - name: KUBELET_PODS
              value: "/kubelet-pods"
            - name: HOST_KUBELET_PODS
              value: "{{ .Values.subpathReaper.kubeletPodsDir }}"
          securityContext:
            # Required: nsenter into PID 1 mount namespace + umount need full privileges.
            privileged: true
          resources:
            requests:
              cpu: {{ .Values.subpathReaper.resources.requests.cpu }}
              memory: {{ .Values.subpathReaper.resources.requests.memory }}
            limits:
              cpu: {{ .Values.subpathReaper.resources.limits.cpu }}
              memory: {{ .Values.subpathReaper.resources.limits.memory }}
          volumeMounts:
            # Read-only view of the kubelet pods dir, only to enumerate pod UIDs and
            # their dir age. The actual umount happens via nsenter in the host ns.
            - name: kubelet-pods
              mountPath: /kubelet-pods
              readOnly: true
      volumes:
        - name: kubelet-pods
          hostPath:
            path: "{{ .Values.subpathReaper.kubeletPodsDir }}"
            type: Directory
      imagePullSecrets:
        - name: registry-secret
