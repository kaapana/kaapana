apiVersion: v1
kind: ServiceAccount
metadata:
  name: subpath-reaper
  namespace: "{{ .Values.global.services_namespace }}"
  labels:
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/name: subpath-reaper
---
# Needs to list pods cluster-wide to know which kubelet pod dirs are still active.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: subpath-reaper
  labels:
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/name: subpath-reaper
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: subpath-reaper
  labels:
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/name: subpath-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: subpath-reaper
subjects:
  - kind: ServiceAccount
    name: subpath-reaper
    namespace: "{{ .Values.global.services_namespace }}"
