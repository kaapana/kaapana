apiVersion: v1
data: 
  dcm4che-iid.ldif: |-
    version: 1
    dn: dcmWebAppName=KAAPANA,dicomDeviceName=kaapana,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org
    changetype: modify
    add: dcmProperty
    dcmProperty: IID_PATIENT_URL=/ohif
    -

    dn: dcmWebAppName=KAAPANA,dicomDeviceName=kaapana,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org
    changetype: modify
    add: dcmProperty
    dcmProperty: IID_STUDY_URL=/ohif/IHEInvokeImageDisplay?requestType=STUDY&studyUID={{ "{{" }}studyUID{{ "}}" }}

    dn: cn=JPEG LS Lossless,dicomDeviceName=kaapana,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org
    objectClass: dcmArchiveCompressionRule
    cn: JPEG LS Lossless
    dicomTransferSyntax: 1.2.840.10008.1.2.4.80
    dcmImageWriteParam: maxPixelValueError=0.0
    dcmProperty: Modality=MR|CT

    dn: dcmWebAppName=KAAPANA,dicomDeviceName=kaapana,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org
    changetype: modify
    add: dcmProperty
    dcmProperty: IID_URL_TARGET=_self

    dn: dicomDeviceName=kaapana,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org
    changetype: modify
    replace: dcmRemapRetrieveURL
    dcmRemapRetrieveURL: https://{{ .Values.global.hostname }}:{{ .Values.global.https_port }}

    version: 1
    dn: dicomDeviceName=kaapana,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org
    changetype: modify
    replace: dcmQidoMaxNumberOfResults
    dcmQidoMaxNumberOfResults: 0
    -

    # dcm4chee identifies a patient by PatientID plus IssuerOfPatientID. Its default
    # SupplementIssuerOfPatientID rule fills a missing issuer with a hash of PatientName and
    # PatientBirthDate, so one PatientID whose name or birth date differs between senders
    # (pseudonymised, multicentric data) becomes several patients, and a later series of an
    # existing study is refused (409 on STOW). Drop that rule and nullify the issuer on every
    # received object instead: without an issuer dcm4chee matches the existing patient and
    # study by PatientID alone and keeps whatever issuer is already stored, so earlier data
    # needs no rewrite.
    dn: cn=SupplementIssuerOfPatientID,dicomAETitle=KAAPANA,dicomDeviceName=kaapana,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org
    changetype: delete

    dn: cn=NullifyIssuerOfPatientID,dicomAETitle=KAAPANA,dicomDeviceName=kaapana,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org
    objectClass: dcmArchiveAttributeCoercion2
    cn: NullifyIssuerOfPatientID
    dcmDIMSE: C_STORE_RQ
    dicomTransferRole: SCU
    dcmURI: merge-attrs:
    dcmMergeAttribute: IssuerOfPatientID=
kind: ConfigMap
metadata:
  name: dcm4che-iid-config
  namespace: "{{ .Values.global.services_namespace }}"
---