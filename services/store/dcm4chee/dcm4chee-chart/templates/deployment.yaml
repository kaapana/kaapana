---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcm4chee
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dcm4chee
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcm4chee
    spec:
{{- include "kaapana.nodeSelector" . | indent 6 }}
      initContainers:
      - name: init
        image: "{{ .Values.global.registry_url }}/service-checker:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy:  {{ .Values.global.pull_policy_images }}
        env:
          - name: WAIT
            value: "ldap,ldap-service.{{  .Values.global.services_namespace  }}.svc,389;postgres-dcm4che,postgres-dcm4che-service.{{  .Values.global.services_namespace  }}.svc,5432"
          - name: DELAY
            value: "2"
          - name: TIMEOUT
            value: "10"
      # The ldap image imports dcm4che-iid.ldif only when it initialises an empty LDAP volume, so a
      # site that already ran once never received later changes to that file. This step re-applies
      # the file before every dcm4chee start: `-a` adds entries without a changetype, `-c` carries on
      # past the "already exists" / "no such object" answers that every entry but the first-ever
      # application produces. The file must therefore stay idempotent. dcm4chee starts afterwards
      # and reads the result at boot, so no reload is needed.
      - name: apply-ldap-config
        image: "{{ .Values.global.registry_url }}/dcm4chee-ldap:{{ .Values.global.kaapana_build_version  }}"
        imagePullPolicy:  {{ .Values.global.pull_policy_images }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            AE_DN="dicomAETitle=KAAPANA,dicomDeviceName=kaapana,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org"
            # On a fresh install the ldap container is still importing its default configuration;
            # wait until the archive AE exists so the file is applied to a complete tree.
            for i in $(seq 1 150); do
              ldapsearch -x -H "$LDAP_URL" -D cn=admin,dc=dcm4che,dc=org -w "$LDAP_ROOTPASS" -b "$AE_DN" -s base dn >/dev/null 2>&1 && break
              echo "waiting for the archive AE in LDAP ($i)"; sleep 2
            done
            ldapmodify -a -c -x -H "$LDAP_URL" -D cn=admin,dc=dcm4che,dc=org -w "$LDAP_ROOTPASS" -f /import/dcm4che-iid.ldif || true
            exit 0
        env:
          - name: LDAP_URL
            value: ldap://ldap-service.{{  .Values.global.services_namespace  }}.svc:389
          - name: LDAP_ROOTPASS
            value: secret
        volumeMounts:
          - mountPath: /import
            name: ldif
      containers:
        - name: dcm4chee-container
          image: "{{ .Values.global.registry_url }}/dcm4chee-arc:{{ .Values.global.kaapana_build_version  }}"
          imagePullPolicy:  {{ .Values.global.pull_policy_images }}
          env:
          - name: ARCHIVE_DEVICE_NAME
            value: KAAPANA
          - name: LDAP_URL
            value: ldap://ldap-service.{{  .Values.global.services_namespace  }}.svc:389
          - name: LDAP_ROOTPASS
            value: secret
          - name: POSTGRES_HOST
            value: postgres-dcm4che-service.{{  .Values.global.services_namespace  }}.svc
          - name: POSTGRES_PORT
            value: "5432"
          - name: POSTGRES_DB
            value: pacsdb
          - name: POSTGRES_USER
            value: pacs
          - name: POSTGRES_PASSWORD
            value: pacs
          - name: HTTP_PORT
            value: "8080"
          - name: HTTPS_PORT
            value: "8443"
          - name: STORAGE_DIR
            value: /storage/fs1
          - name: WILDFLY_CHOWN
            value: /opt/wildfly/standalone /storage
          - name: WILDFLY_WAIT_FOR
            value: ldap-service.{{  .Values.global.services_namespace  }}.svc:389 postgres-dcm4che-service.{{  .Values.global.services_namespace  }}.svc:5432
          - name: TZ
            value: Europe/Paris
          - name: WILDFLY_CRON_ENABLED
            value: "true"
          - name: WILDFLY_LOG_RETENTION_DAYS
            value: "7"
          - name: http_proxy
            value: "{{ .Values.global.http_proxy }}"
          - name: https_proxy
            value: "{{ .Values.global.http_proxy }}"
          - name: no_proxy
            value: ".svc,.svc.cluster,.svc.cluster.local,{{ .Values.global.hostname }}"
          ports:
            - containerPort: 8443
            - containerPort: 9990
            - containerPort: 11112
            - containerPort: 2575
          livenessProbe:
            httpGet:
              path: /dcm4chee-arc/ui2
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 120
          resources:
            requests:
              memory: "{{ .Values.global.pacs_memory_request }}Mi"
            limits:
              memory: "{{ .Values.global.pacs_memory_limit }}Mi"
          volumeMounts:
            - mountPath: /opt/wildfly/standalone
              name: standalone-data
            - mountPath: /storage
              name: storage-data
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: standalone-data
          persistentVolumeClaim:
            claimName: dcm4chee-standalone-pv-claim
        - name: storage-data
          persistentVolumeClaim:
            claimName: dcm4chee-dicom-pv-claim
        - name: ldif
          configMap:
            name: dcm4che-iid-config
        - name: nginx-conf
          configMap:
            name: nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
      priorityClassName: kaapana-high-priority
      imagePullSecrets:
      - name: registry-secret
---
