apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.global.services_namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.main_node_name }}
      restartPolicy: Always
      securityContext:
        runAsUser: {{ int .Values.global.uid }}
        runAsGroup: {{ int .Values.global.gid }}
        fsGroup: {{ int .Values.global.gid }}
      initContainers:
        - name: minio-sync-permission-fix
          securityContext:
            runAsUser: 0
          image: "{{ .Values.global.registry_url }}/busybox:{{ .Values.global.kaapana_build_version }}"
          command: ["chown", "-R", "{{ int .Values.global.uid }}:{{ int .Values.global.gid }}", "/mount"]
          volumeMounts:
            - name: {{ .Release.Name }}-host-path
              mountPath: /mount
      containers:
        - name: minio-sync
          image: "{{ .Values.global.registry_url }}/minio-mirror:{{ .Values.global.kaapana_build_version }}"
          imagePullPolicy:  {{ .Values.global.pull_policy_pods }}
          env:
          - name: LOCAL_PATH
            value: /host
          - name: MINIO_PATH
            value: {{ .Values.global.minio_path }}
          - name: ACTION
            value: {{ if eq .Values.global.sync_strategy "Minio2Host" }}"FETCH"{{ else if eq .Values.global.sync_strategy "Host2Minio"}}"PUSH"{{ else if eq .Values.global.sync_strategy "Bidirectional" }}"SYNC"{{ else }}{{.Values.global.sync_strategy }}{{ end }}
          - name: MINIO_SERVICE
            value: "minio-service.{{ .Values.global.services_namespace }}.svc:9000"
          - name: MINIO_USER
            value: {{ .Values.global.credentials_minio_username  | default "" }}
          - name: MINIO_PASSWORD
            value: {{ .Values.global.credentials_minio_password | default ""}}
          - name: REQUIRED_HOST_FS_TYPE
            value: {{ .Values.global.required_host_fs_type | default "" | quote }}
          {{- if .Values.global.required_host_fs_type }}
          # The host directory is bound into the container when it starts and
          # never re-bound while it runs (no mount propagation). A share that
          # goes stale therefore needs a container restart, which binds whatever
          # the host has mounted by then; start.sh refuses to sync until that is
          # the share again.
          livenessProbe:
            exec:
              command: ["/usr/bin/bash", "/kaapana/app/check_host_filesystem.sh"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - name: {{ .Release.Name }}-host-path
              mountPath: /host
      imagePullSecrets:
        - name: registry-secret
      volumes:
        - name: {{ .Release.Name }}-host-path
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-host-path-pv-claim
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-host-path-pv-volume
  labels:
    type: local
spec:
  capacity:
    storage: "1Mi"
  storageClassName: host-dir
  accessModes:
    - ReadWriteOnce
  hostPath: 
    path: "{{ $.Values.global.fast_data_dir }}/{{ .Values.global.host_directory }}"
  persistentVolumeReclaimPolicy: Delete
  claimRef:
    name: {{ .Release.Name }}-host-path-pv-claim
    namespace: {{ .Values.global.services_namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-host-path-pv-claim
  namespace: {{ .Values.global.services_namespace }}
spec:
  storageClassName: host-dir
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Mi"
  volumeName: {{ .Release.Name }}-host-path-pv-volume
---