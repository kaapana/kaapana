apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.global.services_namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.global.main_node_name }}
      restartPolicy: Always
      securityContext:
        runAsUser: {{ int .Values.global.uid }}
        runAsGroup: {{ int .Values.global.gid }}
        fsGroup: {{ int .Values.global.gid }}
      initContainers:
        - name: minio-sync-permission-fix
          securityContext:
            runAsUser: 0
          image: "{{ .Values.global.registry_url }}/busybox:{{ .Values.global.kaapana_build_version }}"
          command: ["chown", "-R", "{{ int .Values.global.uid }}:{{ int .Values.global.gid }}", "/mount"]
          volumeMounts:
            - name: {{ .Release.Name }}-host-path
              mountPath: /mount
              # Pick up (re)mounts the host performs under this path (e.g. a
              # Windows/CIFS share mounted into the synced directory) instead of
              # staying pinned to the mount namespace from pod creation time.
              mountPropagation: HostToContainer
      containers:
        - name: minio-sync
          image: "{{ .Values.global.registry_url }}/s3-mirror:{{ .Values.global.kaapana_build_version }}"
          imagePullPolicy:  {{ .Values.global.pull_policy_pods }}
          env:
          - name: LOCAL_PATH
            value: /host
          - name: S3_PATH
            value: project-{{ .Values.global.project_name }}/{{ .Values.global.minio_path }}
          - name: ACTION
            value: {{ if eq .Values.global.sync_strategy "Minio2Host" }}"FETCH"{{ else if eq .Values.global.sync_strategy "Host2Minio"}}"PUSH"{{ else if eq .Values.global.sync_strategy "Bidirectional" }}"SYNC"{{ else }}{{.Values.global.sync_strategy }}{{ end }}
          - name: S3_SERVICE
            value: "minio-service.{{ .Values.global.services_namespace }}.svc:9000"
          - name: S3_USER
            value: {{ .Values.global.credentials_minio_username  | default "" }}
          - name: S3_PASSWORD
            value: {{ .Values.global.credentials_minio_password | default ""}}
          - name: EXCLUDE
            value: "{{ .Values.global.exclude_patterns }}"
          resources:
            requests:
              memory: 200Mi
            limits:
              memory: 15Gi
          volumeMounts:
            - name: {{ .Release.Name }}-host-path
              mountPath: /host
              # When the host (un)mounts a share underneath the synced directory
              # (e.g. a Windows/CIFS mount that drops and comes back), propagate
              # that mount into the running container. Without this the container
              # keeps the filesystem view it had at startup, so a remount on the
              # host becomes invisible and rclone keeps syncing against the stale
              # view - which is why only deleting and recreating the pod recovered.
              mountPropagation: HostToContainer
      imagePullSecrets:
        - name: registry-secret
      volumes:
        - name: {{ .Release.Name }}-host-path
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-host-path-pv-claim
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-host-path-pv-volume
  labels:
    type: local
spec:
  capacity:
    storage: "1Mi"
  storageClassName: host-dir
  accessModes:
    - ReadWriteOnce
  hostPath: 
    path: "{{ $.Values.global.fast_data_dir }}/{{ .Values.global.host_directory }}"
  persistentVolumeReclaimPolicy: Delete
  claimRef:
    name: {{ .Release.Name }}-host-path-pv-claim
    namespace: {{ .Values.global.services_namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-host-path-pv-claim
  namespace: {{ .Values.global.services_namespace }}
spec:
  storageClassName: host-dir
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Mi"
  volumeName: {{ .Release.Name }}-host-path-pv-volume
---