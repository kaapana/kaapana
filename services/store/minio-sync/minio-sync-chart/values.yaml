---
global:
  # extension_params
  host_directory: ""
  minio_path: ""
  sync_strategy: ""
  uid: ""
  gid: ""
  required_host_fs_type: ""

extension_params:
  doc:
    type: "doc"
    title: "Sync files from the filesytem to MINIO"
    html: >
      This service will constantly sync the host directory located directly on the server with a folder inside a MINIO bucket following a sync strategy.
      <br/>
      The following strategies are available:
      <br/>
      <ul>
          <li><b>Bidirectional</b>: Syncs files from the host to minio and back</li>
          <li><b>Host2Minio</b>: Syncs files undirectional form host into minio</li>
          <li><b>Minio2Host</b>: Syncs files undirectional from MINIO to the host</li>
      </ul>

  separator_configuration:
    type: "doc"
    title: "Configuration"

  host_directory:
    definition: "Host Directory inside $FAST_DATA_DIR"
    help: >
      <h1>Host Directory</h1><br/>
      <p>A subdirectory of $FAST_DATA_DIR on the machine Kaapana is running on (e.g. /minio-sync referes to $FAST_DAT_DIR/minio-sync)</p>
    type: "string"
    value: "/minio-sync"
    default: "/minio-sync"

  minio_path:
    definition: "MINIO Path"
    help: >
      <h1>MINIO Path</h1><br/>
      <p>Path to sync within minio<br/>
      <b>Note:</b>The first component of the path is considered the bucket (e.g. bucket-name/path/in/bucket)
      </p>
    type: "string"
    value: ""
    default: "uploads/minio-sync"

  sync_strategy:
    definition: "Sync Strategy"
    type: "list_single"
    help: >
      Defines the semantics of the sync:
      <ul>
          <li><b>Bidirectional</b>: Syncs files from the host to minio and back</li>
          <li><b>Host2Minio</b>: Syncs files undirectional form host into minio</li>
          <li><b>Minio2Host</b>: Syncs files undirectional from MINIO to the host</li>
      </ul>
    value: ["Host2Minio", "Minio2Host", "Bidirectional"]
    default: "Bidirectional"

  uid:
    definition: "User ID"
    help: >
      <h1>User ID</h1><br/>
      <p>The id of the user owning the host directory.</p>
    type: "string"
    value: ""
    default: "1000"
  
  gid:
    definition: "Group ID"
    help: >
      <h1>Group ID</h1><br/>
      <p>The id of the group owning the host directory.</p>
    type: "string"
    value: ""
    default: "1000"

  required_host_fs_type:
    definition: "Required filesystem type of the host directory"
    help: >
      <h1>Required filesystem type</h1><br/>
      <p>Set this when the host directory lies on a share the host mounts separately, e.g. "cifs" for
      a Windows share or "nfs4" for NFS (comma-separated for several). The sync then refuses to run
      while the host directory is on any other filesystem, so files are never written into the local
      directory underneath an unmounted share, and it restarts when the share stops answering. It
      resumes by itself once the share is mounted again. Leave empty to sync without this check.</p>
    type: "string"
    value: ""
    default: ""
