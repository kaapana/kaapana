{{- if .Values.global.gpu_support }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nninteractive-proxy
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nninteractive-proxy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nninteractive-proxy
        app.kubernetes.io/part-of: nninteractive-ohif
    spec:
      containers:
        - name: nninteractive-proxy
          image: "{{ .Values.global.registry_url }}/nninteractive-proxy:{{ .Values.global.kaapana_build_version }}"
          imagePullPolicy: "{{ .Values.global.pull_policy_images }}"
          env:
            - name: DICOMWEB_ROOT
              value: "{{ .Values.nninteractiveProxy.dicomwebRoot | default (printf "http://dicom-web-filter-service.%s.svc:8080" .Values.global.services_namespace) }}"
            - name: NNINTERACTIVE_SERVER_URL
              value: "{{ .Values.nninteractiveProxy.nninteractiveServerUrl | default (printf "http://nninteractive-server-service.%s.svc:1527" .Values.global.services_namespace) }}"
            - name: MAX_CACHED_SESSIONS
              value: "{{ .Values.nninteractiveProxy.maxCachedSessions }}"
            - name: MAX_CACHED_IMAGES
              value: "{{ .Values.nninteractiveProxy.maxCachedImages }}"
{{- if .Values.nninteractiveProxy.apiKey }}
            - name: NN_INTERACTIVE_API_KEY
              value: "{{ .Values.nninteractiveProxy.apiKey }}"
{{- end }}
          ports:
            - containerPort: {{ .Values.nninteractiveProxy.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.nninteractiveProxy.port }}
            initialDelaySeconds: {{ .Values.nninteractiveProxy.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.nninteractiveProxy.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.nninteractiveProxy.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.nninteractiveProxy.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.nninteractiveProxy.port }}
            initialDelaySeconds: {{ .Values.nninteractiveProxy.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.nninteractiveProxy.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.nninteractiveProxy.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.nninteractiveProxy.livenessProbe.failureThreshold }}
          resources:
            requests:
              memory: "{{ .Values.nninteractiveProxy.memoryRequest }}"
            limits:
              memory: "{{ .Values.nninteractiveProxy.memoryLimit }}"
      priorityClassName: kaapana-high-priority
      imagePullSecrets:
        - name: registry-secret
{{- end }}
