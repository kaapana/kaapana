{{- if .Values.global.gpu_support }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix-nninteractive-proxy
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  stripPrefix:
    prefixes:
      - /nninteractive
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nninteractive-proxy-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    kaapana.ai/hide-link: "true"
    kaapana.ai/type: service
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.global.services_namespace }}-strip-prefix-nninteractive-proxy@kubernetescrd
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
spec:
  rules:
    - host:
      http:
        paths:
          - path: /nninteractive
            pathType: ImplementationSpecific
            backend:
              service:
                name: nninteractive-proxy-service
                port:
                  number: {{ .Values.nninteractiveProxy.port }}
---
# Project-scoped route (/project/<id>/nninteractive/...), used when OHIF runs under
# /project/<id>/ohif/: auth-backend authorizes against <id> and adds the Project header,
# which the proxy passes on so dicom-web-filter scopes image reads to that project.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nninteractive-proxy-project-ingressroute
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: PathRegexp(`^/project/[^/]+/nninteractive(/|$)`)
      middlewares:
        - name: strip-project-prefix
        - name: strip-prefix-nninteractive-proxy
      services:
        - name: nninteractive-proxy-service
          port: {{ .Values.nninteractiveProxy.port }}
          # The service annotation only covers Ingress routes; long inferences need these timeouts.
          serversTransport: nninteractive-proxy-transport
{{- end }}
