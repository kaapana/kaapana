{{- if .Values.global.gpu_support }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix-nninteractive-proxy
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  stripPrefix:
    prefixes:
      - /nninteractive
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nninteractive-proxy-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    kaapana.ai/hide-link: "true"
    kaapana.ai/type: service
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.global.services_namespace }}-strip-prefix-nninteractive-proxy@kubernetescrd
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
spec:
  rules:
    - host:
      http:
        paths:
          - path: /nninteractive
            pathType: ImplementationSpecific
            backend:
              service:
                name: nninteractive-proxy-service
                port:
                  number: {{ .Values.nninteractiveProxy.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nninteractive-ohif-launcher-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    kaapana.ai/display-name: "nnInteractive OHIF"
    kaapana.ai/type: application
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
spec:
  rules:
    - host:
      http:
        paths:
          - path: /ohif
            pathType: ImplementationSpecific
            backend:
              service:
                name: ohif-service
                port:
                  name: ohif-port
{{- end }}
