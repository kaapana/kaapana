{{- if .Values.global.gpu_support }}
---
apiVersion: v1
kind: Service
metadata:
  name: nninteractive-proxy-service
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: {{ .Values.global.services_namespace }}-nninteractive-proxy-transport@kubernetescrd
  labels:
    app.kubernetes.io/name: nninteractive-proxy
    app.kubernetes.io/part-of: nninteractive-ohif
spec:
  selector:
    app.kubernetes.io/name: nninteractive-proxy
  ports:
    - name: http
      port: {{ .Values.nninteractiveProxy.port }}
      targetPort: {{ .Values.nninteractiveProxy.port }}
      protocol: TCP
  type: ClusterIP
{{- end }}
