{{- if .Values.global.gpu_support }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nninteractive-server
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nninteractive-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nninteractive-server
        app.kubernetes.io/part-of: nninteractive-ohif
    spec:
      containers:
        - name: nninteractive-server
          image: "{{ .Values.global.registry_url }}/nninteractive-server:{{ .Values.global.kaapana_build_version }}"
          imagePullPolicy: "{{ .Values.global.pull_policy_images }}"
{{- if .Values.nninteractiveServer.extraArgs }}
          args:
{{ toYaml .Values.nninteractiveServer.extraArgs | indent 12 }}
{{- end }}
          env:
            - name: NNINTERACTIVE_HOST
              value: "0.0.0.0"
            - name: NNINTERACTIVE_PORT
              value: "{{ .Values.nninteractiveServer.port }}"
{{- if .Values.nninteractiveServer.apiKey }}
            - name: NN_INTERACTIVE_API_KEY
              value: "{{ .Values.nninteractiveServer.apiKey }}"
{{- end }}
          ports:
            - containerPort: {{ .Values.nninteractiveServer.port }}
          resources:
            requests:
              memory: "{{ .Values.nninteractiveServer.memoryRequest }}"
            limits:
              memory: "{{ .Values.nninteractiveServer.memoryLimit }}"
              nvidia.com/gpu: "{{ .Values.nninteractiveServer.gpuCount }}"
      priorityClassName: kaapana-high-priority
      imagePullSecrets:
        - name: registry-secret
{{- end }}
