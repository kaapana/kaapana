---
global:
  pull_policy_images: "Always"

nninteractiveProxy:
  image: "nninteractive-proxy"
  port: 8002
  dicomwebRoot: ""
  nninteractiveServerUrl: ""
  apiKey: ""
  maxCachedSessions: 8
  memoryRequest: 512Mi
  memoryLimit: 4Gi
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 20

nninteractiveServer:
  image: ghcr.io/mic-dkfz/nninteractive-server
  tag: 2.5.0-nninteractive_v1.0
  port: 1527
  apiKey: ""
  gpuCount: 1
  memoryRequest: 6Gi
  memoryLimit: 16Gi
  extraArgs: []

networkPolicy:
  enabled: true
  ingressNamespace: admin
