---
global:
  pull_policy_images: "Always"

nninteractiveProxy:
  port: 8002
  dicomwebRoot: ""
  nninteractiveServerUrl: ""
  apiKey: ""
  maxCachedSessions: 8
  maxCachedImages: 2
  memoryRequest: 512Mi
  memoryLimit: 4Gi
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 20
  traefik:
    responseHeaderTimeout: 180s
    idleConnTimeout: 180s

nninteractiveServer:
  # The server image is built/mirrored by docker/nninteractive-server/Dockerfile and
  # served from the platform registry (registry_url/nninteractive-server:kaapana_build_version),
  # like the proxy. The image name is referenced directly in server-deployment.yaml.
  port: 1527
  apiKey: ""
  gpuCount: 1
  memoryRequest: 6Gi
  memoryLimit: 16Gi
  extraArgs: []

networkPolicy:
  enabled: true
  ingressNamespace: admin
