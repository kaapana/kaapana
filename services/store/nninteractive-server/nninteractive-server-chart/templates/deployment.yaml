---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nninteractive-server
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nninteractive-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nninteractive-server
    spec:
      containers:
        - name: nninteractive-server
          image: "{{ .Values.nninteractive.image }}:{{ .Values.nninteractive.tag }}"
          imagePullPolicy: "{{ .Values.global.pull_policy_images }}"
{{- if .Values.nninteractive.extraArgs }}
          args:
{{ toYaml .Values.nninteractive.extraArgs | indent 12 }}
{{- end }}
          env:
            - name: NNINTERACTIVE_HOST
              value: "0.0.0.0"
            - name: NNINTERACTIVE_PORT
              value: "{{ .Values.nninteractive.port }}"
{{- if .Values.nninteractive.apiKey }}
            - name: NN_INTERACTIVE_API_KEY
              value: "{{ .Values.nninteractive.apiKey }}"
{{- end }}
          ports:
            - containerPort: {{ .Values.nninteractive.port }}
          resources:
            requests:
              memory: "{{ .Values.nninteractive.memoryRequest }}"
            limits:
              memory: "{{ .Values.nninteractive.memoryLimit }}"
{{- if .Values.global.gpu_support }}
              nvidia.com/gpu: "{{ .Values.nninteractive.gpuCount }}"
{{- end }}
      priorityClassName: kaapana-high-priority
      imagePullSecrets:
        - name: registry-secret
