---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix-nninteractive
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  stripPrefix:
    prefixes:
      - /nninteractive
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nninteractive-server-ingress
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.global.services_namespace }}-strip-prefix-nninteractive@kubernetescrd
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
spec:
  rules:
    - host:
      http:
        paths:
          - path: /nninteractive
            pathType: ImplementationSpecific
            backend:
              service:
                name: nninteractive-server-service
                port:
                  number: {{ .Values.nninteractive.port }}
