---
apiVersion: v1
kind: Service
metadata:
  name: ohif-service
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  selector:
    app.kubernetes.io/name: ohif
  ports:
  - name: ohif-port
    port: 80
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1 
kind: Ingress
metadata:
  name: ohif-ingress-ip
  namespace: "{{ .Values.global.services_namespace }}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    kubernetes.io/ingress.global-static-ip-name: "kubernetes-ingress"
    kaapana.ai/ui.name: "OHIF"
    # trailing slash avoids OHIF's own /ohif -> /ohif/ redirect, which downgrades
    # to http:// behind the TLS-terminating gateway and gets blocked as mixed content
    kaapana.ai/ui.path: "/ohif/"
    kaapana.ai/ui.section: "store"
    kaapana.ai/ui.section-label: "Store"
    kaapana.ai/ui.section-icon: "mdi-store"
    kaapana.ai/ui.section-order: "20"
    kaapana.ai/ui.order: "10"
    # The viewer URL decides the DICOMweb scope (see kaapana.js), so the shell
    # serves it under /project/<short_id>/ohif/ and reloads it on a switch.
    kaapana.ai/ui.project: "path"
spec:
  rules:
  - host:
    http:
      paths:
      - path: /ohif
        pathType: ImplementationSpecific
        backend:
          service:
            name: ohif-service
            port:
              name: ohif-port
---
# The bare shape /project/<id>/ohif (no trailing slash) has no matching nginx
# location after the prefix strip, so OHIF would 301 to /ohif/ -- dropping the
# project scope and downgrading to http:// (blocked as mixed content behind TLS).
# Redirect it in-scope to /project/<id>/ohif/ before stripping the prefix.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ohif-project-trailing-slash
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  redirectRegex:
    regex: "^.*/project/([^/]+)/ohif$"
    replacement: "/project/${1}/ohif/"
    permanent: true
---
# Project-scoped route (/project/<id>/ohif/...): auth-backend authorizes
# against the <id>, the middleware strips the prefix, and the app derives its
# router basename and DICOMweb roots from the document URL (kaapana.js).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ohif-project-ingressroute
  namespace: "{{ .Values.global.services_namespace }}"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: PathRegexp(`^/project/[^/]+/ohif(/|$)`)
      middlewares:
        - name: ohif-project-trailing-slash
        - name: strip-project-prefix
      services:
        - name: ohif-service
          port: 80
---
