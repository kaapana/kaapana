[supervisord]
# NOTE: redirect_stderr/stopsignal/autorestart below are program-level keys and
# are inert in [supervisord]; log redirection is therefore set per program.
redirect_stderr=true
stopsignal=QUIT
autorestart=true
directory=/root

[program:nginx]
# priority 1: bind port 80 and serve the loading page before the X stack, so the
# ingress gets a 200 (loading page) instead of a 502 as early as possible.
priority=1
command=nginx -c /etc/nginx/nginx.conf -g 'daemon off;'
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backend]
priority=10
directory=/usr/local/lib/backend/
command=uvicorn app:app --workers 1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
environment=DISPLAY=":1"

[group:x]
programs=xvfb,wm,tint2,pcmanfm,x11vnc,novnc

[program:wm]
priority=15
command=/usr/bin/openbox
environment=DISPLAY=":1",HOME="/root",USER="root"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tint2]
priority=15
directory=%HOME%
command=/usr/bin/tint2
user=%USER%
environment=DISPLAY=":1",HOME="%HOME%",USER="%USER%"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pcmanfm]
priority=15
directory=%HOME%
command=/usr/bin/pcmanfm --desktop --profile LXDE
user=%USER%
stopwaitsecs=3
environment=DISPLAY=":1",HOME="%HOME%",USER="%USER%"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
priority=10
# Initial resolution is changes by the vnc-resize-backend when client connects
command=/usr/local/bin/xvfb.sh
stopsignal=KILL
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
priority=20
command=x11vnc -display :1 -xkb -forever -shared -repeat -capslock
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
priority=25
directory=/opt/novnc/utils/
command=bash -c "/opt/novnc/utils/novnc_proxy --vnc localhost:5900"
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
