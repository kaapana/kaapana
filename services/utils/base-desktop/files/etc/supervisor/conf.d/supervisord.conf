[supervisord]
# NOTE: redirect_stderr/stopsignal/autorestart below are program-level keys and
# are inert in [supervisord]; log redirection is therefore set per program.
redirect_stderr=true
stopsignal=QUIT
autorestart=true
directory=/root

[program:nginx]
# priority 1: bind port 80 and serve the loading page before the X stack, so the
# ingress gets a 200 (loading page) instead of a 502 as early as possible.
priority=1
command=nginx -c /etc/nginx/nginx.conf -g 'daemon off;'
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[group:x]
programs=xvfb,wm,tint2,pcmanfm,pulseaudio,selkies

[program:wm]
priority=15
command=/usr/bin/openbox
user=%USER%
environment=DISPLAY=":1",HOME="%HOME%",USER="%USER%"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tint2]
priority=15
directory=%HOME%
command=/usr/bin/tint2
user=%USER%
environment=DISPLAY=":1",HOME="%HOME%",USER="%USER%"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pcmanfm]
priority=15
directory=%HOME%
command=/usr/bin/pcmanfm --desktop --profile LXDE
user=%USER%
stopwaitsecs=3
environment=DISPLAY=":1",HOME="%HOME%",USER="%USER%"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
priority=10
# Large virtual screen + RANDR; Selkies resizes the display to the client window natively.
# Runs as %USER% (not root) so the X server and pixelflux share one uid — XShm capture
# requires the capture process and the X server to be the same user.
command=/usr/local/bin/xvfb.sh
user=%USER%
environment=HOME="%HOME%",USER="%USER%"
stopsignal=KILL
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulseaudio]
priority=16
command=/usr/local/bin/pulseaudio.sh
user=%USER%
environment=HOME="%HOME%",USER="%USER%"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:selkies]
# Replaces x11vnc + websockify + noVNC: streams the X11 display (:1) as H.264
# over a single WebSocket (pixelflux), served to the browser via WebCodecs. nginx proxies
# the ".../api/websockets" path to :8082. Streaming-sensitive features are locked off (medical
# desktop): sharing/collab links, command channel, gamepads, microphone, printing.
# NOTE: server-side file transfer cannot currently be fully disabled via Selkies config (an
# empty/"none" value for the list-type setting falls back to its default), so we only hide the
# UI affordance; transfers remain gated by the platform's oauth2-proxy + OPA project auth.
# --use-css-scaling=true: on HiDPI/retina clients the browser otherwise requests a device-pixel
# resolution (devicePixelRatio 2 → ~4x the pixels), so the CPU encoder gets a huge framebuffer and
# the desktop feels sluggish and tiny. With CSS scaling the client sends the logical resolution and
# stretches the canvas — ~4x less to encode on retina, normal-sized UI, and a 1:1 no-op on DPR=1.
# --framerate=30-30: default is 60fps; a medical desktop is mostly static, so halving the frame
# cap roughly halves the CPU encoder's peak load with no perceptible cost. A single value would
# only set the starting rate, which the client can raise.
# --encoder=h264enc --use-cpu=true: full-frame H.264 on the CPU. Not h264enc-striped: together
# with --use-css-scaling it draws the desktop into the top-left quarter on HiDPI clients. When the
# container is started with an NVENC-capable GPU, startup.sh rewrites --use-cpu=true to
# --use-cpu=false so pixelflux offloads to the GPU.
# --rate-control-mode=crf --video-streaming-mode=false: encode at constant quality and only
# when the screen changes. The defaults (constant 8 Mbit/s, every frame) cost about 1.5 Mbit/s
# and three times the CPU for an idle desktop.
# --enable-basic-auth=false: selkies refuses to start without a password otherwise; the platform's
# oauth2-proxy authenticates.
priority=20
command=selkies --addr=127.0.0.1 --port=8082 --mode=websockets --enable-basic-auth=false --encoder=h264enc --use-cpu=true --use-css-scaling=true --rate-control-mode=crf --video-streaming-mode=false --framerate=30-30 --gamepad-enabled=false --enable-sharing=false --command-enabled=false --microphone-enabled=false --printing-enabled=false --ui-sidebar-show-files=false
user=%USER%
environment=DISPLAY=":1",HOME="%HOME%",USER="%USER%"
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
