[project]
name = "kaapana-platform-benchmark"
version = "0.1.0"
description = "Benchmark a running Kaapana instance: ingestion pipeline, internet, GPU"
requires-python = ">=3.9"
dependencies = [
    "typer",
    "requests",
    "urllib3",
    "matplotlib",
    "numpy",
]

[project.scripts]
benchmark = "cli:app"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "store", "compare", "analyze", "client", "core", "send", "report",
              "metrics", "hardware", "registry"]
packages = ["suites"]
